name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the develop branch
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # luacheck. The job keeps its original name, "build", in case a required check refers to it.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v7

    # Use "Factorio Mod luacheck" from the marketplace
    - name: Factorio Mod luacheck
      uses: Roang-zero1/factorio-mod-luacheck@v1.1.0
      with:
          # URL to the luacheckrc configuration file to be used during checking.
          # Per https://github.com/Roang-zero1/factorio-mod-luacheck/issues/2 - an empty string will use the project's .luacheckrc
          luacheckrc_url: "" # optional, default is https://raw.githubusercontent.com/Nexela/Factorio-luacheckrc/0.17/.luacheckrc

  # In-game tests (*_tests.lua, run by utils/test) on headless Factorio servers: every scenario
  # template's map runs the whole suite (see .github/scripts/run-all.ps1), split over a few jobs
  # that run at once. A failing test doesn't fail these jobs; the "in-game test results" check
  # below sums them all up, every test grouped by map, and fails if any test did.
  ingame-tests:
    name: in-game tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    env:
      # the Factorio version the scenario is written for, without the patch number: CI runs its
      # latest stable release
      FACTORIO_LINE: "2.0"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@v7

    # the latest stable release in FACTORIO_LINE, from the list of headless releases (newer ones
    # than stable are experimental)
    - name: Find the Factorio version
      shell: pwsh
      run: |
        $available = (Invoke-RestMethod 'https://updater.factorio.com/get-available-versions?apiVersion=2').'core-linux_headless64'
        $stable = [version]($available | Where-Object stable).stable
        $version = $available.to | Where-Object { $_ -like "$env:FACTORIO_LINE.*" -and [version]$_ -le $stable } |
            Sort-Object { [version]$_ } | Select-Object -Last 1
        if (-not $version) { throw "no stable Factorio $env:FACTORIO_LINE release" }
        "Factorio $version"
        "FACTORIO_VERSION=$version" >> $env:GITHUB_ENV

    - name: Cache Factorio headless
      id: cache-factorio
      uses: actions/cache@v6
      with:
        path: ~/factorio
        key: factorio-headless-${{ env.FACTORIO_VERSION }}

    # the headless server is a free download, no account needed
    - name: Download Factorio headless
      if: steps.cache-factorio.outputs.cache-hit != 'true'
      run: curl -fsSL "https://www.factorio.com/get-download/${FACTORIO_VERSION}/headless/linux64" | tar -xJ -C ~

    # a server waits now and then (map generation, robots in flight), so two per CPU
    - name: In-game tests
      shell: pwsh
      env:
        SHARD: ${{ matrix.shard }}/4
        JOBS: 8
        RESULTS_DIR: results
      # the summary is the results check's to write
      run: |
        $env:GITHUB_STEP_SUMMARY = $null
        ./.github/scripts/run-all.ps1 ~/factorio
        exit 0

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ingame-test-results-${{ matrix.shard }}
        path: results

  ingame-test-results:
    name: in-game test results
    needs: ingame-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        pattern: ingame-test-results-*
        merge-multiple: true
        path: results

    - name: Results
      shell: pwsh
      run: ./.github/scripts/test-summary.ps1 results scenario_templates
