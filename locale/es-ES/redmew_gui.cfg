# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]Información de RedMew[/color][/font]\n Comunidad, normas, funciones, información del mapa
welcome_header=¡Bienvenido a RedMew!
welcome_text=RedMew es una comunidad para jugadores de todos los niveles, comprometida con llevar al límite el multijugador de Factorio mediante scripts personalizados y diseños de mapa disparatados.\n\nSomos gente amable, nuestro objetivo es pasarlo lo mejor posible y esperamos que tú también.
chatting_header=Cómo chatear
chatting_text=Para chatear con otros jugadores, pulsa la tecla __CONTROL__toggle-console__ de tu teclado.\nLa tecla predeterminada en los teclados ingleses es la grave (`) y está debajo de la tecla ESC.\nEsto se puede cambiar en __1__ -> __2__ -> __3__.
free_coin_header=Monedas gratis
free_coin_text=Has recibido __1__ __2__ por mirar la pestaña de bienvenida.\nConsultar cada pestaña te recompensará con __1__ __2__ más.\n
free_coin_print=__1__ __2__ otorgados por leer una pestaña en la pantalla de información.
links_header=Enlaces útiles
links_discord=Echa un vistazo a nuestro Discord para ver información sobre mapas nuevos y para sugerir mapas o ideas nuevas.
links_patreon=Contribuye a nuestro Patreon para recibir ventajas especiales y ayudar a mantener nuestros servidores.
links_saves=Descarga nuestros mapas, con su estado inicial y final, desde nuestra página web.
links_factoriomaps=Consulta nuestros mapas anteriores como un mapa de Google.
rules_header=Normas
rules_text=Diviértete y juega bien. Recuerda que todos estamos aquí para pasarlo bien, así que mantengámoslo así.\n\nNi contenido ofensivo ni ataques personales.\n\nSi sospechas que alguien está haciendo griefing, avisa al equipo de administradores usando /report o haciendo clic en el botón de reportar junto al jugador en la lista de jugadores.
rules_text_danger_ore=Si hay que modificar o eliminar la construcción de otro jugador, debe haber una discusión de equipo o una votación antes de la modificación o eliminación.\n\nNo es necesaria una discusión de equipo ni una votación si el jugador que la construyó está conectado y acepta la modificación o eliminación.\n\nEl cambio de módulos en todo el mapa y la mejora de cintas deben votarse en equipo antes de hacer el cambio o la mejora.\n\nEn caso de votación de equipo, gana la mayoría.\n\nCon solo 1 o 2 jugadores conectados no basta para una discusión de equipo o una votación. Aun así, puede ser necesario modificar o eliminar una construcción para que la base funcione sin problemas. Se debe dejar un mensaje en el chat del juego indicando que se va a modificar o eliminar una construcción y por qué es necesario hacerlo. No basta con decir que tu diseño o construcción es mejor o tiene mejor aspecto.
map_info_button=Info del mapa
map_info_header=Información del mapa
map_name_label=Nombre del mapa:
map_desc_label=Descripción del mapa:
map_extra_info_label=Información adicional:
softmods_button=Funciones
softmods_header=Funciones y plugins del servidor
softmods_rank_text=Tenemos un sistema de rangos básico para evitar el griefing. No puedes usar bombas nucleares ni el planificador de desmantelamiento si eres invitado. Si juegas un par de horas, un administrador te ascenderá a habitual. También puedes pedirle un ascenso a un administrador si estás trabajando en un proyecto que lo requiera.\n
softmods_rank_is=Tu rango es:
softmods_market_label=Mercado
softmods_market_text=En la mayoría de los mapas encontrarás un mercado cerca del punto de aparición donde puedes usar monedas para hacer compras. Las monedas se consiguen talando árboles, fabricando objetos a mano y destruyendo nidos de biter. La mayoría de los artículos del mercado son fijos, pero algunos dependen del mapa (normalmente el relleno) y rotan de vez en cuando.
softmods_saviour_label=Salvavidas de trenes
softmods_saviour_text=Los trenes son el peor enemigo de un jugador de Factorio. Si tienes al menos un puerto de jugador en el inventario y un tren te mata, se te perdonará la vida, pero perderás un puerto de jugador. Puedes conseguir puertos de jugador en el mercado.
softmods_plist_label=Lista de jugadores
softmods_plist_text=Muestra todos los jugadores del servidor y algunas estadísticas. Puedes ordenar la lista haciendo clic en los encabezados de las columnas. También puedes dar un toque a la gente, lo que suelta un sustantivo aleatorio en el chat.
softmods_polls_label=Encuestas
softmods_polls_text=Las encuestas ayudan a los jugadores a llegar a un consenso para acciones importantes. ¿Quieres mejorar una construcción importante? Haz una encuesta para comprobar que todos están de acuerdo. Necesitas ser un habitual para crear nuevas encuestas.
softmods_tags_label=Etiquetas
softmods_tags_text=Puedes asignarte un rol con etiquetas para que los demás jugadores sepan qué estás haciendo. O simplemente usar la etiqueta como decoración. Los habituales pueden crear nuevas etiquetas personalizadas, así que demuestra tu creatividad.
softmods_tasks_label=Tareas
softmods_tasks_text=¿No sabes en qué deberías estar trabajando? Echa un vistazo a las tareas y comprueba qué hay que hacer. Los habituales pueden añadir nuevas tareas.
softmods_bp_label=Ayudante\nde planos
softmods_bp_text=El ayudante de planos™ te permite voltear planos horizontal o verticalmente y también te permite\nconvertir las entidades usadas en el plano, p. ej. cambiar cintas amarillas por cintas rojas.
softmods_score_label=Puntuación
softmods_score_text=¡Muestra el número de cohetes lanzados, bichos liberados, entidades construidas y mucho más!
softmods_shortcuts_label=Atajos
softmods_shortcuts_text=Los atajos del jugador son botones de fácil acceso que proporcionan herramientas útiles. Limpia los cadáveres de bichos del suelo, ordena tu inventario en cofres/hornos cercanos, recarga las baterías de tu equipo con acumuladores cercanos y mucho más.
softmods_production_hud_label=HUD de prod.
softmods_production_hud_text=El HUD de producción es una ventana de estadísticas de producción que puede permanecer en pantalla todo el tiempo. Añade/elimina objetos de la lista de seguimiento y ¡asegúrate de que la fábrica esté bien alimentada!
softmods_train_station_teleport_label=Teletransportador
softmods_train_station_teleport_text=El teletransporte de estaciones de tren permite teletransportarse instantáneamente entre [entity=train-stop] por todo el mapa. Solo tienes que colocarte cerca de un [entity=train-stop] y, desde la vista del mapa, abrir otro [entity=train-stop] y teletransportarte a él con su botón de teletransporte.
softmods_autofill_label=Autocompletar
softmods_autofill_text=Suelta munición automáticamente al construir torretas. Puede configurarse para filtrar los tipos y la cantidad de munición.
softmods_paint_brush_label=Pincel
softmods_paint_brush_text=¡La fábrica debe crecer! ...con estilo
whats_new_button=Novedades

