# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=¡La cueva se ha derrumbado!
cave_collapse_warning=Extraer entidades como muros, senderos de piedra, hormigón\ny rocas puede provocar un derrumbe, ¡ten cuidado, minero!\n\nConsejo del capataz: Coloca un muro cada 4 casillas para\nevitar un derrumbe. Usa senderos de piedra y hormigón\npara reforzarlo aún más.

night_time_warning=¡Colocar paneles solares bajo tierra no parece\ntener ningún efecto en la producción de energía!\nLos estudios muestran que lo mismo se aplica a la versión portátil!\n\nConsejo del capataz: Los paneles solares solo son útiles para fabricar\nsatélites

cracking_sound_1=C O R R E N,  I N S E N S A T O S !
cracking_sound_2=C R A C

score_cave_collapses=Derrumbes de cueva
score_mine_size=Tamaño de la mina

auto_play_cutscene=Reproducir automáticamente la cinemática de Diggy
cutscene_case_line2=Bienvenido a __1__
cutscene_case_line4=Este es un escenario personalizado desarrollado por __1__
cutscene_case_line5=Únete a nosotros en __1__
cutscene_case_line6=¡La siguiente introducción te ayudará a empezar!
cutscene_case_line7=Si tienes problemas durante esta cinemática, avísanos
cutscene_case0_line1=Esta es la zona inicial
cutscene_case0_line3=¡Expandir la mina es peligroso!
cutscene_case1_line1=Los muros se usan para evitar que el techo de la cueva nos aplaste
cutscene_case2_line1=El mercado proporciona suministros extra a cambio de monedas
cutscene_case2_line3=Desbloqueas objetos nuevos al subir de nivel
cutscene_case3_line1=Los derrumbes ocurren con frecuencia si no añades soportes
cutscene_case3_line3=Los distintos tipos de ladrillo y hormigón pueden reforzar nuestros pilares de soporte
cutscene_case4_line1=Este mundo contiene rocas frágiles
cutscene_case4_line3=Nuestras herramientas son demasiado potentes y destruyen los recursos
cutscene_case5_line1=La mayoría de las acciones dan experiencia
cutscene_case5_line3=El texto flotante indica la cantidad y la causa de la experiencia
cutscene_case6_line1=La población nativa acecha en la oscuridad
cutscene_case6_line3=Ten cuidado al excavar, lleva siempre algunas defensas contigo
cutscene_case7_line1=Esto concluye la introducción
cutscene_case7_line3=¡Diviértete y sigue excavando!
replay_cutscene=Para volver a ver la introducción, usa el comando __1__

blueprint_tools_tooltip=Mostrar herramientas de planos

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Reproducir automáticamente la cinemática de Crashsite
cutscene1_case_line2=Bienvenido a __1__
cutscene1_case_line4=Este es un escenario personalizado desarrollado por __1__
cutscene1_case_line5=Únete a nosotros en __1__
cutscene1_case_line6=¡La siguiente introducción te ayudará a empezar a jugar!
cutscene1_case0_line3=¡Esta es nuestra barra de herramientas!
cutscene1_case0_line4=¡Aquí encontrarás una gran variedad de herramientas e información sobre nosotros!
cutscene1_case0_line5=Pasa el ratón por encima de ellas para más información
cutscene1_case0_line6=Puedes mostrar u ocultar nuestra barra de herramientas con este botón
cutscene1_case1_line1=Esta es la zona inicial. Tiene un mercado y una casa de la moneda.
cutscene1_case1_line2=La casa de la moneda produce monedas a un ritmo limitado, mejorable en el mercado.
cutscene1_case1_line3=También se pueden obtener monedas matando biters, spitters, gusanos y nidos.
cutscene1_case2_line1=Las monedas se usan para comprar objetos en el mercado.
cutscene1_case3_line1=Esto, junto con los yacimientos de mineral y el muro, es tu zona de aparición. Vamos con los puestos avanzados.

cutscene2_case_line1=Esto es un "puesto avanzado". Los hay de muchas formas y tamaños, con todo, desde planchas de hierro hasta armaduras MK2.
cutscene2_case_line2=Encontrarás muchas estructuras similares a esta repartidas por el mapa.
cutscene2_case0_line1=Los puestos avanzados están defendidos por torretas y muros enemigos. La fuerza de las torretas escala con las recompensas del interior.
cutscene2_case0_line2=Para "capturar" un puesto avanzado, debes destruir todas las torretas.
cutscene2_case1_line1=El puesto avanzado contiene un mercado, cofres de botín y fábricas mágicas (ensambladoras, plantas químicas, etc.).
cutscene2_case2_line1=Las fábricas mágicas no requieren materiales ni electricidad, producen objetos gratis. (Esta fabrica planchas de hierro.)
cutscene2_case3_line1=Puedes mejorar la velocidad de fabricación en el mercado (local) con monedas. Algunos mercados contienen objetos adicionales.
cutscene2_case4_line1=Los biters evolucionan rápido (¡y a veces se multiplican al morir!). Consejo: mantén la contaminación al mínimo utilizando los objetos gratis.
cutscene2_case5_line1=El objetivo de este escenario es eliminar todos los biters y lanzar un cohete en el mapa de tamaño limitado.
cutscene2_case5_line2=Esto concluye el tour. ¡Buena suerte y diviértete!
replay_cutscene=Para volver a ver la introducción, usa el comando __1__. También puedes pulsar el icono de información para ver un resumen en texto.

# locale linked to the quadrants scenario
[quadrants]
on=ACTIVADO
off=DESACTIVADO

compi_spawn_welcome=¡Bienvenido a Redmew - Quadrants!\n\n¡Usa la interfaz gráfica de la esquina superior izquierda para jugar!
compi_spawn_cute=Soy muy mono

compi_common_transfer_item=¿Cómo transferir objetos?\nPuedes usar cintas subterráneas para llegar al otro lado\n\nTambién puedes lanzar objetos al otro lado, solo usa la tecla ´Z´
compi_common_chat=¿Te han silenciado?\nPuedes chatear usando la tecla situada debajo de ESC\n\nPuedes cambiarlo en Ajustes -> Controles -> Activar o desactivar la consola de Lua
compi_common_market=¿Te sobran unas monedas?\nVen a gastar aquí tus duramente ganadas monedas en el mercado
compi_common_switch=¡Puedes cambiar de área!\nSolo necesitas tener el inventario vacío\n\nSimplemente quédate cerca de mí y usa la interfaz de la esquina superior izquierda para cambiar
compi_common_chests=¿No puedes eliminar algunos cofres?\nLos jugadores que cambian de área pueden dejar atrás un cofre\n\nPuedes vaciarlo para eliminarlo

compi_quadrant1_welcome=¡Bienvenido a Ciencia y Militar!\n\nCentro de mando del avance militar y científico
compi_quadrant1_science=Esta área es la única que puede investigar\n\nTendrías que importar algunos paquetes de ciencia de otras áreas
compi_quadrant1_military=En esta área solo puedes fabricar objetos militares\n\nLas otras áreas dependen de que les envíes objetos militares

compi_quadrant2_welcome=¡Bienvenido a Productos Intermedios y Minería!\n\n¡El único productor de acero y circuitos electrónicos!
compi_quadrant2_steel=Esta área es la única que puede producir acero\n\nLas otras áreas dependen de que les envíes acero
compi_quadrant2_circuits=Esta área es la única que puede producir circuitos\n\n¡Necesitas exportarlos a otras áreas!
compi_quadrant2_resources=Corren rumores:\nEsta área es extra rica en recursos\n\nEs ideal para operaciones mineras

compi_quadrant3_welcome=¡Bienvenido a Petróleo y Alta Tecnología!\n\nHogar del procesamiento de petróleo y la tecnología
compi_quadrant3_oil=Esta área es la única que puede procesar petróleo crudo\n\nPuede que necesites importar petróleo crudo de otras áreas
compi_quadrant3_tech=Esta área es la única que puede producir varios objetos de alta tecnología\n\n¡Puede que necesites importar muchos productos intermedios!
compi_quadrant3_rocket=He oído:\nEsta área es un lugar perfecto para lanzar un cohete\n\nLas otras áreas pueden proporcionarte las piezas que necesites

compi_quadrant4_welcome=Bienvenido a Logística y Transporte\n\nHogar del espagueti y de las estaciones de tren
compi_quadrant4_logistic=Esta área es la única que puede ofrecer soluciones logísticas\n\n¡El éxito de la región depende de que las exportes!
compi_quadrant4_born=¿Sabías esto?\nMis hermanos y yo nacimos aquí

popup_quadrant1_title=Centro de investigación y mando
popup_quadrant2_title=Producción intermedia y minería
popup_quadrant3_title=Producción de petróleo y alta tecnología
popup_quadrant4_title=Producción logística
popup_quadrant1=Nuestro objetivo principal es proporcionar a la región nuevos descubrimientos científicos\n\nEn segundo lugar, somos el centro de mando central\nProporcionamos a la región equipo militar
popup_quadrant2=Nuestro objetivo principal es proporcionar a la región productos intermedios\nPrincipalmente suministramos circuitos electrónicos de varias densidades\n¡También somos el área con el acero de mayor calidad!\nEl estudio inicial muestra más recursos en esta área
popup_quadrant3=Nuestro objetivo principal es proporcionar a la región productos derivados del petróleo\nEn segundo lugar, somos el líder tecnológico de la región\nProporcionamos a la región varios productos de alta tecnología (y radiactivos)
popup_quadrant4=Nuestro objetivo principal es proporcionar a la región soluciones logísticas\nPrincipalmente suministramos soluciones basadas en cintas y robots\n¡También estamos especializados en redes de trenes de alto rendimiento!

