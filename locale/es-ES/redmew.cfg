description=[font=default-bold]RedMew es una comunidad de Factorio que aloja servidores personalizados, mapas de distintas formas y tamaños, escenarios guionizados y servidores moddeados.[/font]\nNuestro escenario ofrece más de 100 mapas diferentes, y puedes seleccionar el que prefieras con los siguientes pasos:\n\n[color=green]Modo simple: visita[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Modo experto: edita map_selection.lua en la carpeta del escenario[/color]\nPara más detalles sobre cada mapa, consulta la lista en [color=blue]redmew.com/maps[/color]\n\nEnlaces útiles: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]¡Gracias por elegir Redmew, un escenario de Refactorio![/color]
