# This file holds all the locale strings for command help and descriptions
# Ideally, string keys match command names (with - turned to _)

[command_description]
reward=Se da una recompensa a un jugador objetivo (se elimina si la cantidad es negativa)
diggy_clear_void=Borra el vacío en un área determinada pero sigue activando todos los eventos que Diggy lanzaría al borrar el vacío.
config_restart=Abre la ventana de reinicio del servidor desde las configuraciones del servidor
restart=Reinicia el mapa.
abort=Cancela un reinicio.
danger_ore_restart_condition_not_met=No se han lanzado suficientes [item=satellite] para reiniciar el mapa.
diggy_restart_condition_not_met=¡Mina más duro, enano! Debes alcanzar Productividad de Minería __1__ para empezar una nueva aventura minera!
crash_site_restart=Se reinicia el escenario crashsite.
crash_site_restart_abort=Se aborta el reinicio del escenario crashsite.
crash_site_spy=Gasta monedas para enviar un pez a espiar al enemigo durante un breve tiempo.
crash_site_spy_invalid=Debes añadir una ubicación válida para enviar un pez espía. p. ej. /spy [gps=-110,-17,redmew]
crash_site_spy_funds=¡Entrenar a estos peces espía no es barato! ¡Necesitas más monedas!
crash_site_spy_success=__1__ usó el comando /spy y gastó __2__ monedas para entrenar a un pez que espíe al enemigo [gps=__3__,__4__,redmew]
crash_site_airstrike_invalid=Coordenadas no válidas.
crash_site_airstrike=Lanza un ataque aéreo contra el enemigo con cápsulas de veneno.
crash_site_airstrike_count=Mejora el daño del ataque aéreo al nivel [font=var]__1__[/font]\n\nPara usar el ataque aéreo, coloca cápsulas de veneno en el cofre de aparición y escribe /strike seguido de una posición gps\n\nLas mejoras de daño aumentan el número de cápsulas de veneno lanzadas por el ataque aéreo.\n\n[color=255,230,192][font=default-bold]Nivel actual:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Cantidad actual de proyectiles:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Coste actual:[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=Mejora el radio del ataque aéreo al nivel [font=var]__1__[/font]\n\nPara usar el ataque aéreo, coloca cápsulas de veneno en el cofre de aparición y escribe /strike seguido de una posición gps\n\n[color=255,230,192][font=default-bold]Nivel actual:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Radio actual:[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]Radio de ataque aéreo __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]Daño de ataque aéreo __1__\n[/font][/color]
crash_site_airstrike_not_researched=Todavía no has investigado el ataque aéreo. Visita el mercado en el punto de aparición [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=Para enviar un ataque aéreo, carga __1__ cápsulas de veneno más en el cofre de pago [gps=2.5,-7.5,redmew]
crash_site_airstrike_friendly_fire_error=No querrás hacer eso: no se han encontrado enemigos en la zona objetivo.
crash_site_airstrike_damage_upgrade_success=__1__ ha mejorado el Daño de ataque aéreo al nivel __2__
crash_site_airstrike_radius_upgrade_success=__1__ ha mejorado el Radio de ataque aéreo al nivel __2__
crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]Mando de ataque de veneno\n[/font][/color]
crash_site_airstrike_planner_description=Usa este planificador de demolición para lanzar fácilmente un ataque de veneno con un clic. Ponlo en tu barra de acceso rápido para tenerlo a mano.
crash_site_airstrike_no_enemies=No se han encontrado enemigos en [gps=__1__,__2__,__3__]. ¡Vaya desperdicio de cápsulas de veneno!
crash_site_barrage_planner_label=[color=255,230,192][font=default-large-bold]Mando de bombardeo\n[/font][/color]
crash_site_barrage_planner_description=Usa este planificador de demolición para lanzar fácilmente un bombardeo de artillería con un clic. Ponlo en tu barra de acceso rápido para tenerlo a mano.
crash_site_barrage_invalid=Coordenadas no válidas.
crash_site_barrage=Lanza un bombardeo de cohetes teledirigidos contra el enemigo.
crash_site_barrage_count=Mejora el daño del bombardeo al nivel [font=var]__1__[/font]\n\nPara usar el bombardeo, coloca cohetes explosivos en el cofre de aparición y escribe /barrage seguido de una posición gps\n\nLas mejoras de daño aumentan el número de cohetes lanzados.\n\n[color=255,230,192][font=default-bold]Nivel actual:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Cohetes actuales:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Coste actual:[/font][/color] [font=var]__4__[/font]
crash_site_barrage_radius=Mejora el radio del bombardeo al nivel [font=var]__1__[/font]\n\nPara usar el bombardeo, coloca cohetes explosivos en el cofre de aparición y escribe /barrage seguido de una posición gps\n\n[color=255,230,192][font=default-bold]Nivel actual:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Radio actual:[/font][/color] [font=var]__3__[/font]
crash_site_barrage_radius_name_label=[color=255,230,192][font=default-large-bold]Radio de bombardeo de cohetes __1__\n[/font][/color]
crash_site_barrage_count_name_label=[color=255,230,192][font=default-large-bold]Daño de andanada de cohetes __1__\n[/font][/color]
crash_site_barrage_not_researched=Aún no has investigado Andanada. Visita el mercado en el punto de aparición [gps=-3,-3,redmew]
crash_site_barrage_insufficient_currency_error=Para enviar una andanada de cohetes, carga __1__ cohetes explosivos más en el cofre de pago [gps=-4.5,-7.5,redmew]
crash_site_barrage_no_nests=No se han encontrado nidos en estas coordenadas ([gps=__1__,__2__,__3__]), ¡menudo desperdicio de cohetes!
crash_site_barrage_damage_upgrade_success=__1__ ha mejorado Daño de andanada de cohetes al nivel __2__
crash_site_barrage_radius_upgrade_success=__1__ ha mejorado Radio de andanada de cohetes al nivel __2__
crash_site_rocket_tanks_name_label=[color=255,230,192][font=default-large-bold]Intervalo de fuego de los tanques de cohetes __1__\n[/font][/color]
crash_site_rocket_tank_upgrade_success=__1__ ha mejorado el intervalo de los tanques de cohetes al nivel __2__
crash_site_rocket_tanks_description=Mejora el intervalo de disparo de los tanques de cohetes para reducir el tiempo entre cohetes.\n\nColoca cohetes en el inventario del tanque para que apunten automáticamente a los gusanos y nidos enemigos.
crash_site_spider_army_decon_label=[color=255,230,192][font=default-large-bold]Planificador de agrupación de ejército de arañatrón\n[/font][/color]
crash_site_spider_army_decon_description=Usa este planificador de demolición para agrupar rápidamente los arañatrón en un ejército. Primero, selecciona en grupo un área que contenga tus arañatrón. Después, haz un clic izquierdo en un arañatrón objetivo para que tu grupo lo siga.
max_level=(NIVEL MÁXIMO)
dataset_copy=Copia un conjunto de datos
dataset_move=Mueve un conjunto de datos
dataset_delete=Borra un conjunto de datos
dataset_transform=Transforma un conjunto de datos y lo escribe al conjunto de datos de destino. Llama storage.transform_function y envía la tabla de entradas mientras se espera que una tabla retorne.
dataset_transform_test=Muestra el conjunto de datos resultante de una operación de transformación. Vea /help dataset-transform para más información.
report=Reporta a un usuario a los administradores
kill=Lo matará.
afk=Muestra cuánto tiempo han estado los jugadores AFK.
zoom=Establece tu zoom.
find=Muestra una alerta en el mapa donde se encuentra el jugador
show_rail_block=Mostrar visualización de los bloques de rieles.
server_time=Imprime el tiempo del servidor.
seeds=Listar las semillas de todas las superficies
redmew_version=Imprime la versión del escenario Redmew
whois=Da información sobre un jugador dado, los administradores pueden ver el inventario de un jugador añadiendo "sí" como un segundo argumento
clear_corpses=Elimina los cadáveres cercanos al jugador (Regular o superior). Usa /clear_corpses surface o /clear_corpses s para eliminar todos los cadáveres de la superficie (solo administradores).
meltdown_get=Obtiene el estado de la fusión.
meltdown_set=Establece el estado de la fusión.
redmew_color=Establecer guardará su color actual para los mapas futuros. Restablecer borrará su color guardado. Al azar le dará un color aleatorio.
performance_scale_set=Establece la escala de rendimiento entre 0.05 y 1. Cambiará la velocidad del juego, la velocidad de minería manual, la velocidad de fabricación manual y la velocidad de carrera del personaje por fuerza.
performance_scale_get=Muestra la escala de rendimiento actual.
permissions_reset=Usa "/permissions-reset" para restablecer los permisos de todos los jugadores a los valores predeterminados
permissions_set_scenario=Usa "/permissions-set-scenario" para reaplicar los permisos del escenario, si los hay
market=Pone un mercado cerca de usted. Use /market removeall para eliminar todos los mercados en un mapa
lazy_bastard_bootstrap=Pone los requisitos mínimos para empezar
toast=Envía un toast a todos los jugadores
toast_player=Envía un toast a un jugador específico
sent_all_toast=__1__ envió un toast a todos los jugadores
sent_player_toast=__1__ envió un toast a __2__
task=Crea una nueva tarea.
tag=Establece la etiqueta de un jugador
popup=Muestra un popup a todos los jugadores conectados
popup_update=Muestra una actualización emergente a todos los jugadores conectados
popup_player=Muestra un popup al jugador.
poll=Crea una nueva encuesta
poll_result=Imprime el resultado del número de encuesta dado.
debug=Abre el depurador
watch=Te permite observar a otros jugadores.
donator_welcome_message=Añade, borra o lista mensajes de bienvenida del donador.
donator_death_message=Añade, borra o lista mensajes de muerte de donador.
reveal=Revela radio alrededor del usuario
particle_scale=Proporciona una fracción entre 0 y 1 para reducir o aumentar la cantidad de partículas (máx). Deja vacío para ver los valores actuales.
apocalypse=Esto realmente termina el mapa. La primera vez que lo ejecutes, el juego se guardará. Cuando se ejecute una segunda vez, el apocalipsis comenzará.
a=Chat de administradores. Envía mensajes a todos los demás administradores.
dc=silent-command
hax=Activa tu hax (hace que las recetas no cuesten nada)
regular=Da a un jugador el rango regular.
regular_remove=Degrada a un jugador del rango regular al siguiente rango más bajo
probation=Pon al jugador en prueba. (No podrán usar comandos redmew y nunca ganarán el rango de confianza automática.)
probation_remove=Eliminar jugador de la prueba.
showreports=Mostrar informes de usuario
jail=Pon a un jugador en la cárcel
unjail=Elimina a un jugador de la cárcel
pool=Genera una piscina de agua
invoke=Teletransporta al jugador a ti.
tp=Si está en blanco, teletransporta a la entidad seleccionada. mode = activa el modo tp, en el que puedes teletransportarte a un fantasma colocado. player = teletransporta a un jugador.
revive_ghosts=Revive los fantasmas dentro del radio proporcionado alrededor de ti
destroy=Destruye la entidad bajo tu cursor cuando ejecutes este comando
quick_bar_save=Guarda tus [color=yellow]barras rápidas[/color] en el servidor para futuros mapas
quick_bar_load=Carga tus [color=yellow]barras rápidas[/color] del servidor (sobrescribiendo las barras existentes)
quick_bar_delete=Borra tus [color=yellow]barras rápidas[/color] guardadas del servidor
logistic_requests_save=Guarda tus [color=blue]solicitudes logísticas[/color] en el servidor para futuros mapas
logistic_requests_load=Carga tus [color=blue]solicitudes logísticas[/color] desde el servidor (sobrescribiendo las barras existentes)
logistic_requests_delete=Borra tus [color=blue]solicitudes logísticas[/color] guardadas del servidor
set_pollution_multiplier=EXPERIMENTAL. Un número entero que se multiplica por 0,01 para obtener la cantidad de contaminación que emiten los fabricantes mágicos de crash site. El valor predeterminado es 0
get_pollution_multiplier=El multiplicador de contaminación actual de crash site. El valor predeterminado es 0.
perks=Lista a los donantes de Patreon que contribuyen a las ventajas actualmente activas.
generate_desc=Genera el nombre, la descripción y las etiquetas del servidor para pegarlas en la interfaz de /config
radio=Abre la ventana de la radio
rich_text=Abre la interfaz de texto enriquecido
rpg_stats=Muestra las estadísticas del jugador
rpg_update=Actualiza las estadísticas y la interfaz de RPG del jugador indicado
rpg_leaderboard=Muestra la clasificación de RPG
calculator_tech=Calcula el coste en paquetes de ciencia para investigar la tecnología indicada
calculator_tech_player=Calcula el coste en paquetes de ciencia para investigar la tecnología indicada para el jugador especificado
af_reset=Restablece todas las funciones
af_debug=Muestra el nivel actual de todas las funciones
af_max=Establece todas las funciones en su nivel máximo respectivo
frontier_ping_silo=Marca la posición del silo en el mapa
frontier_toggle_debug_ai=Activa/desactiva el modo de depuración de la IA
frontier_toggle_debug_shop=Activa/desactiva el modo de depuración de la tienda
frontier_print_global=Muestra la tabla global
frontier_log_global=Registra la tabla global en el registro
moderator=Concede a un jugador el rango de moderador
moderator_remove=Degrada a un jugador de moderador al siguiente rango más bajo
regular_all=Concede a todos los jugadores conectados el rango de regular, si no están en periodo de prueba
blueprint_tools=Abre la interfaz gráfica del gestor de Blueprint Tools
inventory=Muestra el inventario del jugador objetivo. Si no se indica ningún jugador, se muestran todos los inventarios.

