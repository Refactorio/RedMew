# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=Die Höhle ist eingestürzt!
cave_collapse_warning=Das Abbauen von Objekten wie Wänden, Steinwegen, Beton\nund Felsen kann einen Höhleneinsturz verursachen, sei vorsichtig, Miner!\n\nTipp des Vorarbeiters: Platziere alle 4 Kacheln eine Wand, um\neinen Höhleneinsturz zu verhindern. Nutze Steinwege und Beton,\num sie weiter zu verstärken.

night_time_warning=Das Platzieren von Solarpanels unter der Erde scheint\nkeine Wirkung auf die Stromerzeugung zu haben!\nStudien zeigen, dass dasselbe auch für die tragbare Version gilt!\n\nTipp des Vorarbeiters: Solarpanels sind nur beim Herstellen\nvon Satelliten nützlich

cracking_sound_1=RENNT, IHR IDIOTEN !
cracking_sound_2=C R A C K

score_cave_collapses=Höhleneinstürze
score_mine_size=Größe der Mine

auto_play_cutscene=Diggy-Zwischensequenz automatisch abspielen
cutscene_case_line2=Willkommen zu __1__
cutscene_case_line4=Dies ist ein von __1__ entwickeltes benutzerdefiniertes Szenario
cutscene_case_line5=Trete uns auf __1__ bei
cutscene_case_line6=Die folgende Einführung wird dir zum Einstieg helfen!
cutscene_case_line7=Wenn du Probleme mit den Zwischensequenzen hast, lass es uns wissen
cutscene_case0_line1=Dies ist der Startbereich
cutscene_case0_line3=Das Erweitern der Mine ist gefährlich!
cutscene_case1_line1=Wände verhindern, dass uns die Höhlendecke zerquetscht
cutscene_case2_line1=Der Markt bietet zusätzliche Vorräte im Tausch gegen Münzen
cutscene_case2_line3=Du schaltest neue Gegenstände frei, wenn du ein Level aufsteigst
cutscene_case3_line1=Einstürze ereignen sich häufig, wenn du keine Stützpfeiler setzt
cutscene_case3_line3=Verschiedene Arten von Ziegeln und Beton können unsere Stützpfeiler verstärken!
cutscene_case4_line1=Diese Welt enthält brüchiges Gestein
cutscene_case4_line3=Unsere Werkzeuge sind zu mächtig, um Ressourcen vor der Zerstörung zu bewahren
cutscene_case5_line1=Die meisten Aktionen geben Erfahrung!
cutscene_case5_line3=Der schwebende Text zeigt die Menge und Ursache der Erfahrung an
cutscene_case6_line1=Die einheimische Bevölkerung lauert in der Dunkelheit
cutscene_case6_line3=Sei vorsichtig beim Graben und nimm immer ein paar Verteidigungen mit
cutscene_case7_line1=Damit endet die Einführung
cutscene_case7_line3=Viel Spaß und grab weiter!
replay_cutscene=Um die Einführung erneut anzusehen, benutze den Befehl __1__

blueprint_tools_tooltip=Blaupausen-Werkzeuge anzeigen

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Crashsite-Zwischensequenz automatisch abspielen
cutscene1_case_line2=Willkommen zu __1__
cutscene1_case_line4=Dies ist ein von __1__ entwickeltes benutzerdefiniertes Szenario
cutscene1_case_line5=Trete uns auf __1__ bei
cutscene1_case_line6=Die folgende Einführung hilft dir beim Einstieg ins Spiel!
cutscene1_case0_line3=Das ist unsere Werkzeugleiste!
cutscene1_case0_line4=Hier findest du eine große Auswahl an Werkzeugen und Informationen über uns!
cutscene1_case0_line5=Bewege die Maus darüber für weitere Informationen
cutscene1_case0_line6=Mit dieser Schaltfläche kannst du unsere Werkzeugleiste ein- und ausblenden
cutscene1_case1_line1=Das ist der Startbereich. Er verfügt über einen Markt und eine Münzprägung.
cutscene1_case1_line2=Die Münzprägung erzeugt Münzen in begrenztem Tempo und ist am Markt aufrüstbar.
cutscene1_case1_line3=Münzen gibt es auch für das Töten von Bitern, Spitern, Würmern und Nestern.
cutscene1_case2_line1=Münzen werden verwendet, um Gegenstände am Markt zu kaufen.
cutscene1_case3_line1=Das hier, zusammen mit den Erzfeldern und der Wand, ist dein Spawnpunkt. Weiter zu den Außenposten.

cutscene2_case_line1=Das ist ein "Außenposten". Es gibt sie in vielen Formen und Größen, mit allem von Eisenplatten bis zur MK2-Rüstung.
cutscene2_case_line2=Über die gesamte Karte verteilt findest du viele Strukturen, die dieser hier ähneln.
cutscene2_case0_line1=Außenposten werden von feindlichen Geschützen und Mauern verteidigt. Die Stärke der Geschütze skaliert mit den Belohnungen darin.
cutscene2_case0_line2=Um einen Außenposten zu „erobern“, musst du alle Geschütze zerstören.
cutscene2_case1_line1=Der Außenposten enthält einen Markt, Beutekisten und Magische Fertiger (Montagemaschinen, Chemiefabriken usw.).
cutscene2_case2_line1=Magische Fertiger benötigen keine Zutaten und keinen Strom, sie stellen Gegenstände gratis her. (Dieser stellt Eisenplatten her.)
cutscene2_case3_line1=Am (lokalen) Markt kannst du die Fertigungsgeschwindigkeit mit Münzen verbessern. Manche Märkte enthalten zusätzliche Gegenstände.
cutscene2_case4_line1=Biter entwickeln sich schnell (und vermehren sich manchmal, wenn man sie tötet!). Tipp: Halte die Umweltverschmutzung möglichst gering, indem du die gratis Gegenstände nutzt.
cutscene2_case5_line1=Das Ziel dieses Szenarios ist es, alle Biter zu beseitigen und auf der begrenzt großen Karte eine Rakete zu starten.
cutscene2_case5_line2=Damit endet die Tour. Viel Glück und viel Spaß!
replay_cutscene=Um die Einleitung erneut anzusehen, verwende den Befehl __1__. Du kannst auch auf das Informationssymbol klicken, um eine Textzusammenfassung zu erhalten.

# locale linked to the quadrants scenario
[quadrants]
on=An
off=Aus

compi_spawn_welcome=Willkommen bei Redmew - Quadrants!\n\nBenutze die GUI in deiner linken oberen Ecke um zu spielen!
compi_spawn_cute=Ich bin wirklich süß

compi_common_transfer_item=Wie kann man Gegenstände übertragen?\nDu kannst unterirdische Fließbänder verwenden, um die andere Seite zu erreichen\n\nDu kannst auch Gegenstände über den Punkt fallen lassen, indem du mit dem Item in der Hand 'Z' drückst
compi_common_chat=Wurdest du stummgeschaltet?\nDu kannst mit der Taste unter ESC chatten\n\nDies kannst du unter Einstellungen -> Steuerung -> "Lua-Konsole umschalten" ändern
compi_common_market=Wechselgeld übrig?\nGib dein hart verdientes Geld hier im Markt aus
compi_common_switch=Du kannst den Bereich wechseln!\nAlles was du brauchst ist ein leeres Inventar\n\nEinfach in meiner Nähe stehen und das GUI in deiner oberen linken Ecke zum wechseln benutzen
compi_common_chests=Kannst keine Truhen entfernen?\nSpieler, die den Bereich wechseln, können eine Truhe hinterlassen\n\nDu kannst sie leeren, um sie zu entfernen

compi_quadrant1_welcome=Willkommen bei Wissenschaft und Militär!\n\nBefehlszentrum für militärische und wissenschaftliche Fortschritte
compi_quadrant1_science=Dieser Bereich ist der einzige, der forschen kann\n\nDu müsstest einige Wissenschaftspakete aus anderen Bereichen importieren
compi_quadrant1_military=Du kannst nur militärische Gegenstände in diesem Bereich herstellen\n\nWeitere Bereiche sind davon abhängig, dass du Militär-Items an sie schickst

compi_quadrant2_welcome=Willkommen bei Zwischenprodukten und Bergbau!\n\nDer einzige Hersteller von Stahl und elektronischen Schaltungen!
compi_quadrant2_steel=Dieser Bereich ist der einzige, der Stahl herstellen kann\n\nWeitere Bereiche hängen davon ab, dass du Stahl an sie schickst
compi_quadrant2_circuits=Dieser Bereich ist der einzige, der Schaltkreise herstellen kann\n\nDu musst sie in andere Bereiche exportieren!
compi_quadrant2_resources=Gerüchte sagen:\nDieser Bereich ist sehr reich an Ressourcen\n\nEs ist ideal für Bergbau-Operationen

compi_quadrant3_welcome=Willkommen bei Öl und High Tech!\n\nHeimat der Ölverarbeitung und Technologie
compi_quadrant3_oil=Dieser Bereich ist der einzige, der Rohöl verarbeiten kann\n\nDu musst möglicherweise Rohöl aus anderen Bereichen importieren
compi_quadrant3_tech=Dieser Bereich ist der einzige, der verschiedene High-Tech-Items herstellen kann\n\nDu musst möglicherweise viele Zwischenprodukte importieren!
compi_quadrant3_rocket=Ich habe gehört:\nDieser Bereich ist ein perfekter Ort, um eine Rakete zu starten\n\nAndere Bereiche können dir die benötigten Teile liefern

compi_quadrant4_welcome=Willkommen bei Logistik und Transport\n\nHeimat der Spaghetti und Bahnhöfe
compi_quadrant4_logistic=Dieser Bereich ist der einzige, der logistische Lösungen liefern kann\n\nDer Erfolg der Region hängt davon ab, dass du diese exportierst!
compi_quadrant4_born=Wusstest du schon?\nMeine Geschwister und ich wurden hier geboren

popup_quadrant1_title=Forschungs- und Kommandozentrum
popup_quadrant2_title=Zwischenproduktion und Bergbau
popup_quadrant3_title=Öl- und Hightech-Produktion
popup_quadrant4_title=Logistik-Produktion
popup_quadrant1=Unser Hauptziel ist es, der Region neue wissenschaftliche Entdeckungen zu liefern\n\nSekundär sind wir der zentrale Kommandopunkt\nWir bieten der Region militärische Ausrüstung
popup_quadrant2=Unser Hauptziel ist es, der Region Zwischenprodukte zu bieten\nWir liefern in erster Linie elektronische Schaltungen in verschiedenen Dichten\nWir sind auch der Bereich mit dem besten Qualitätsstahl!\nErste Umfragen zeigen erhöhte Ressourcen in diesem Gebiet
popup_quadrant3=Unser Hauptziel ist es, der Region Öl-basierte Produkte zu liefern\nSekundär sind wir die technologisch führende Region\nWir bieten der Region verschiedene Hightech- (und radioaktive) Produkte an
popup_quadrant4=Unser Hauptziel ist es, der Region logistische Lösungen zu bieten\nWir liefern hauptsächlich Fließband- und roboterbasierte Lösungen\nWir sind auch auf Hochleistungs-Zugnetze spezialisiert!

