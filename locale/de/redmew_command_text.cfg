# This file holds all the locale strings for command help and descriptions
# Ideally, string keys match command names (with - turned to _)

[command_description]
reward=Gibt einem Spieler deiner Wahl eine Belohnung (entfernt, wenn die Menge negativ ist)
diggy_clear_void=Entfernt die Leere in einem gegebenen Gebiet, löst aber trotzdem alle Ereignisse aus, die Diggy beim Entfernen von Leere auslösen würde.
config_restart=Öffnet das Server-Neustart-Fenster aus den Server-Konfigurationen
restart=Startet die Karte neu.
abort=Bricht einen Neustart ab.
danger_ore_restart_condition_not_met=Es wurden nicht genügend [item=satellite] gestartet, um die Karte neu zu starten.
diggy_restart_condition_not_met=Grabe härter, Zwerg! Du musst Bergbauproduktivität __1__ erreichen, um ein neues Bergbau-Abenteuer zu starten!
crash_site_restart=Startet das Crashsite Szenario neu.
crash_site_restart_abort=Bricht den Neustart des Crashsite Szenarios ab.
crash_site_spy=Gib Münzen aus, um einen Fisch zu senden, der für kurze Zeit den Feind ausspioniert.
crash_site_spy_invalid=Du musst eine gültige Position angeben, um einen Spionage-Fisch zu senden. z.B. /spy [gps=-110,-17,redmew]
crash_site_spy_funds=Das Training dieser Spionage-Fische ist nicht billig! Du brauchst mehr Münzen!
crash_site_spy_success=__1__ hat den Befehl /spy benutzt und __2__ Münzen ausgegeben, um einen Fisch auszubilden, der den Feind ausspioniert [gps=__3__,__4__,redmew]
crash_site_airstrike_invalid=Ungültige Koordinaten.
crash_site_airstrike=Führe einen Luftangriff gegen den Feind mit Giftkapseln durch.
crash_site_airstrike_count=Rüste den Luftangriffsschaden auf Stufe [font=var]__1__[/font] auf\n\nUm den Luftangriff zu nutzen, lege Giftkapseln in die Spawn-Kiste und tippe /strike gefolgt von einer GPS-Position\n\nSchadens-Upgrades erhöhen die Anzahl der beim Luftangriff abgefeuerten Giftkapseln.\n\n[color=255,230,192][font=default-bold]Aktuelle Stufe:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Aktuelle Anzahl Giftkapseln:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Aktuelle Kosten:[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=Rüste den Luftangriffsradius auf Stufe [font=var]__1__[/font] auf\n\nUm den Luftangriff zu nutzen, lege Giftkapseln in die Spawn-Kiste und tippe /strike gefolgt von einer GPS-Position\n\n[color=255,230,192][font=default-bold]Aktuelle Stufe:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Aktueller Radius:[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]Luftangriffsradius __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]Luftangriffsschaden __1__\n[/font][/color]
crash_site_airstrike_not_researched=Du hast den Luftangriff noch nicht erforscht. Besuche den Markt am Spawn [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=Um einen Luftangriff zu senden, lade __1__ weitere Giftkapseln in die Bezahlkiste [gps=2.5,-7.5,redmew]
crash_site_airstrike_friendly_fire_error=Das willst du nicht tun, im Zielgebiet wurden keine Feinde gefunden.
crash_site_airstrike_damage_upgrade_success=__1__ hat den Luftangriffsschaden auf Stufe __2__ verbessert
crash_site_airstrike_radius_upgrade_success=__1__ hat den Luftangriffsradius auf Stufe __2__ verbessert
crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]Fernbedienung für Giftangriff\n[/font][/color]
crash_site_airstrike_planner_description=Benutze diesen Abrissplaner, um einen Giftangriff mit einem Klick einfach zu starten. Lege ihn in deine Schnellzugriffsleiste für einfachen Zugriff.
crash_site_airstrike_no_enemies=Keine Feinde gefunden bei [gps=__1__,__2__,__3__]. Was für eine Verschwendung von Giftkapseln!
crash_site_barrage_planner_label=[color=255,230,192][font=default-large-bold]Fernbedienung für Sperrfeuer\n[/font][/color]
crash_site_barrage_planner_description=Benutze diesen Abrissplaner, um ein Artillerie-Sperrfeuer mit einem Klick einfach zu starten. Lege ihn in deine Schnellzugriffsleiste für einfachen Zugriff.
crash_site_barrage_invalid=Ungültige Koordinaten.
crash_site_barrage=Feuere ein Sperrfeuer wärmesuchender Raketen auf den Feind ab.
crash_site_barrage_count=Rüste den Sperrfeuer-Schaden auf Stufe [font=var]__1__[/font] auf\n\nUm das Sperrfeuer zu nutzen, lege Sprengstoffraketen in die Spawn-Kiste und tippe /barrage gefolgt von einer GPS-Position\n\nSchadens-Upgrades erhöhen die Anzahl der abgefeuerten Raketen.\n\n[color=255,230,192][font=default-bold]Aktuelle Stufe:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Aktuelle Raketenanzahl:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Aktuelle Kosten:[/font][/color] [font=var]__4__[/font]
crash_site_barrage_radius=Rüste den Sperrfeuer-Radius auf Stufe [font=var]__1__[/font] auf\n\nUm das Sperrfeuer zu nutzen, lege Sprengstoffraketen in die Spawn-Kiste und tippe /barrage gefolgt von einer GPS-Position\n\n[color=255,230,192][font=default-bold]Aktuelle Stufe:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Aktueller Radius:[/font][/color] [font=var]__3__[/font]
crash_site_barrage_radius_name_label=[color=255,230,192][font=default-large-bold]Raketensalven-Radius __1__\n[/font][/color]
crash_site_barrage_count_name_label=[color=255,230,192][font=default-large-bold]Raketensalven-Schaden __1__\n[/font][/color]
crash_site_barrage_not_researched=Du hast das Sperrfeuer noch nicht erforscht. Besuche den Markt am Spawn [gps=-3,-3,redmew]
crash_site_barrage_insufficient_currency_error=Um eine Raketensalve abzufeuern, lade __1__ weitere Spreng-Raketen in die Bezahlkiste [gps=-4.5,-7.5,redmew]
crash_site_barrage_no_nests=Keine Nester an diesen Koordinaten gefunden ([gps=__1__,__2__,__3__]), was für eine Verschwendung von Raketen!
crash_site_barrage_damage_upgrade_success=__1__ hat den Raketensalven-Schaden auf Stufe __2__ verbessert
crash_site_barrage_radius_upgrade_success=__1__ hat den Raketensalven-Radius auf Stufe __2__ verbessert
crash_site_rocket_tanks_name_label=[color=255,230,192][font=default-large-bold]Feuerintervall der Raketenpanzer __1__\n[/font][/color]
crash_site_rocket_tank_upgrade_success=__1__ hat das Raketenpanzer-Intervall auf Stufe __2__ verbessert
crash_site_rocket_tanks_description=Verbessere das Feuerintervall des Raketenpanzers, um die Zeit zwischen den Raketen zu verkürzen.\n\nLege Raketen in das Tankinventar, damit sie automatisch feindliche Würmer und Nester anvisieren.
crash_site_spider_army_decon_label=[color=255,230,192][font=default-large-bold]Spidertron-Armee-Gruppierungsplaner\n[/font][/color]
crash_site_spider_army_decon_description=Benutze diesen Abrissplaner, um Spidertrons schnell zu einer Armee zusammenzufassen. Wähle zuerst mit der Gruppenauswahl einen Bereich aus, der deine Spidertrons enthält. Klicke dann mit einem einzelnen Linksklick auf ein Ziel-Spidertron, dem deine Gruppe folgen soll.
max_level=(MAX. STUFE)
dataset_copy=Kopiert einen Datensatz
dataset_move=Verschiebt einen Datensatz
dataset_delete=Löscht einen Datensatz
dataset_transform=Transformiert einen Datensatz und schreibt ihn in den Zieldatensatz. Ruft storage.transform_function auf und sendet die Tabelle der Einträge, während eine zurückzugebende Tabelle erwartet wird.
dataset_transform_test=Zeigt den resultierenden Datensatz einer Transformationsoperation an. Siehe /help dataset-transform für weitere Informationen.
report=Meldet einen Spieler an Admins
kill=Wird dich töten.
afk=Zeigt an, wie lange Spieler bereits AFK waren.
zoom=Setzt deinen Zoom.
find=Zeigt eine Warnung auf der Karte an, an der sich der Spieler befindet
show_rail_block=Schaltet die Visualisierung von Gleisblöcken um.
server_time=Gibt die Zeit des Servers aus.
seeds=Listet die Seeds aller Oberflächen auf
redmew_version=Gibt die Version des RedMew-Szenarios aus
whois=Liefert Informationen über einen bestimmten Spieler. Administratoren können das Inventar eines Spielers sehen, indem sie "Ja" als zweites Argument hinzufügen
clear_corpses=Entfernt Leichen in der Nähe des Spielers (Regular oder höher). Benutze /clear_corpses surface oder /clear_corpses s, um alle Leichen auf der Oberfläche zu entfernen (nur Admin).
meltdown_get=Gibt den Status der Kernschmelze aus.
meltdown_set=Setzt den Status der Kernschmelze.
redmew_color=Set speichert deine aktuelle Farbe für zukünftige Karten. Reset löscht deine gespeicherte Farbe. Random gibt dir eine zufällige Farbe.
performance_scale_set=Setzt die Leistungsskala zwischen 0,05 und 1. Ändert die Spielgeschwindigkeit, die manuelle Abbaugeschwindigkeit, die manuelle Fertigungsgeschwindigkeit und die Laufgeschwindigkeit des Charakters pro Fraktion.
performance_scale_get=Zeigt die aktuelle Leistungsskala an.
permissions_reset=Benutze "/permissions-reset", um die Berechtigungen aller Spieler auf die Standardeinstellungen zurückzusetzen
permissions_set_scenario=Benutze "/permissions-set-scenario", um die Berechtigungen des Szenarios erneut anzuwenden, falls vorhanden
market=Platziert einen Markt in deiner Nähe. Benutze /market removeall, um alle Märkte auf einer Karte zu entfernen
lazy_bastard_bootstrap=Platziert die Mindestanforderungen für den Start
toast=Sendet einen Toast an alle Spieler
toast_player=Sendet einen Toast an einen bestimmten Spieler
sent_all_toast=__1__ hat allen Spielern einen Toast gesendet
sent_player_toast=__1__ hat einen Toast an __2__ gesendet
task=Erstellt eine neue Aufgabe.
tag=Setzt den Tag eines Spielers
popup=Zeigt ein Popup an alle verbundenen Spieler
popup_update=Zeigt ein Update-Popup an alle verbundenen Spieler
popup_player=Zeigt ein Popup für den Spieler an.
poll=Erstellt eine neue Umfrage
poll_result=Gibt das Ergebnis für die angegebene Umfrage aus.
debug=Öffnet den Debugger
watch=Ermöglicht es dir, andere Spieler zu beobachten.
donator_welcome_message=Fügt Willkommensnachrichten von Spendern hinzu, löscht oder listet sie auf.
donator_death_message=Fügt Todesnachrichten von Spendern hinzu, löscht sie oder listet sie auf.
reveal=Deckt einen Radius um den Benutzer auf
particle_scale=Gib einen Bruchteil zwischen 0 und 1 an, um die Anzahl der (maximalen) Partikel zu verringern oder zu erhöhen. Lasse das Feld leer, um die aktuellen Werte anzuzeigen.
apocalypse=Dies beendet die Karte wirklich. Beim ersten Ausführen wird das Spiel gespeichert. Beim zweiten Ausführen beginnt die Apokalypse.
a=Admin-Chat. Benachrichtigt alle anderen Admins.
dc=Stiller Befehl
hax=Schaltet deinen Cheat-Modus um (Rezepte kosten nichts)
regular=Gibt einem Spieler den Stammgast-Rang.
regular_remove=Stuft einen Spieler vom Stammgast-Rang auf den nächstniedrigeren Rang herab
probation=Stellt einen Spieler auf Bewährung. (Er kann keine Redmew-Befehle verwenden und erhält niemals automatisch den vertrauenswürdigen Rang.)
probation_remove=Entfernt einen Spieler aus der Bewährung.
showreports=Zeigt Spielerberichte
jail=Bringt einen Spieler ins Gefängnis
unjail=Entfernt einen Spieler aus dem Gefängnis
pool=Erzeugt einen Wasserpool
invoke=Teleportiert den Spieler zu dir.
tp=Wenn leer, teleportiere zum ausgewählten Objekt. mode = schaltet den TP-Modus um, in dem du zu einem platzierten Geist teleportieren kannst. player = teleportiere zum Spieler.
revive_ghosts=Belebt die Geister innerhalb des angegebenen Radius um dich herum wieder
destroy=Zerstört das Objekt unter deinem Mauszeiger, wenn du diesen Befehl ausführst
quick_bar_save=Speichert deine [color=yellow]Schnellleisten[/color] serverseitig für zukünftige Karten
quick_bar_load=Lädt deine [color=yellow]Schnellleisten[/color] vom Server (überschreibt vorhandene Leisten)
quick_bar_delete=Löscht deine gespeicherten [color=yellow]Schnellleisten[/color] vom Server
logistic_requests_save=Speichert deine [color=blue]Logistikbestellungen[/color] serverseitig für zukünftige Karten
logistic_requests_load=Lädt deine [color=blue]Logistikbestellungen[/color] vom Server (überschreibt vorhandene Bestellungen)
logistic_requests_delete=Löscht deine gespeicherten [color=blue]Logistikbestellungen[/color] vom Server
set_pollution_multiplier=EXPERIMENTELL. Eine Ganzzahl, die mit 0,01 multipliziert wird, um die Menge der Verschmutzung zu ergeben, die die magischen Fertiger der Crash-Site ausstoßen. Standardwert ist 0
get_pollution_multiplier=Der aktuelle Verschmutzungsmultiplikator für die Crash-Site. Standardwert ist 0.
perks=Listet Patreon-Spender auf, die zu derzeit aktiven Vorteilen beitragen.
generate_desc=Erzeugt Servername, Beschreibung und Tags zum Einfügen in die /config-GUI
radio=Öffnet das Radio-Fenster
rich_text=Öffnet die Rich-Text-GUI
rpg_stats=Zeigt die Spielerstatistiken an
rpg_update=Aktualisiert die RPG-Statistiken und die GUI für den Zielspieler
rpg_leaderboard=Zeigt die RPG-Bestenliste an
calculator_tech=Berechnet die Kosten in Wissenschaftspaketen zur Erforschung der Zieltechnologie
calculator_tech_player=Berechnet die Kosten in Wissenschaftspaketen zur Erforschung der Zieltechnologie für den Zielspieler
af_reset=Setzt alle Funktionen zurück
af_debug=Zeigt die aktuelle Stufe aller Funktionen an
af_max=Setzt alle Funktionen auf ihre jeweilige Maximalstufe
frontier_ping_silo=Pingt die Siloposition auf der Karte an
frontier_toggle_debug_ai=Schaltet den KI-Debugmodus EIN/AUS
frontier_toggle_debug_shop=Schaltet den Shop-Debugmodus EIN/AUS
frontier_print_global=Gibt die Global-Tabelle aus
frontier_log_global=Protokolliert die Global-Tabelle
moderator=Gibt einem Spieler den Moderator-Rang
moderator_remove=Stuft einen Spieler vom Moderator auf den nächstniedrigeren Rang herab
regular_all=Gibt allen Online-Spielern den Stammgast-Rang, sofern sie nicht auf Bewährung sind
blueprint_tools=Öffnet die GUI des Blueprint-Werkzeugs-Managers
inventory=Zeigt das Inventar des Ziel-Spielers an. Wird kein Spieler angegeben, werden alle Inventare angezeigt.

