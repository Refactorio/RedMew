# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew-Info[/color][/font]\n Community, Regeln, Funktionen, Karteninfos
welcome_header=Willkommen bei RedMew!
welcome_text=RedMew ist eine Community für Spieler aller Könnenstufen, die sich zum Ziel gesetzt hat, die Grenzen des Factorio-Multiplayer durch eigene Skripte und verrückte Kartendesigns auszureizen.\n\nWir sind ein freundlicher Haufen und unser Ziel ist es, so viel Spaß wie möglich zu haben und wir hoffen, dass du es auch haben wirst.
chatting_header=Wie man chatten kann
chatting_text=Um mit anderen Spielern zu chatten, drücke die Taste __CONTROL__toggle-console__ auf deiner Tastatur.\nDie Standardtaste auf englischen Tastaturen ist die Gravis-Taste (`) und liegt unter der ESC-Taste.\nDies kann in __1__ -> __2__ -> __3__ geändert werden.
free_coin_header=Kostenlose Münzen
free_coin_text=Du hast __1__ __2__ dafür erhalten, dass du dir den Willkommens-Tab angeschaut hast.\nWenn du jeden Tab überprüfst, bekommst du __1__ mehr __2__.\n
free_coin_print=Du hast __1__ __2__ für das Lesen eines Tabs auf dem Info-Bildschirm erhalten.
links_header=Nützliche Links
links_discord=Schau in unserem Discord nach neuen Karteninformationen und schlage neue Karten oder Ideen vor.
links_patreon=Wenn du unser Patreon unterstützt, erhältst du spezielle Vorteile und hilfst uns, die Server zu betreiben.
links_saves=Lade Karten, im Anfangs- und Endstadium, von unserer Webseite herunter.
links_factoriomaps=Sieh dir unsere bisherigen Karten als Google Map an.
rules_header=Regeln
rules_text=Viel Spaß und sei freundlich. Denk daran, dass wir alle nur hier sind, um Spaß zu haben, also sollten wir es dabei belassen.\n\nKeine Hass-Inhalte oder persönliche Angriffe.\n\nWenn du vermutest, dass jemand griefet, benachrichtige das Admin-Team über /report oder über den Melde-Button neben dem Spieler in der Spielerliste.
rules_text_danger_ore=Wenn der Bau eines anderen Spielers geändert oder entfernt werden muss, muss vor der Änderung oder Entfernung eine Teamdiskussion oder Abstimmung/Umfrage stattfinden.\n\nEine Teamdiskussion oder Abstimmung/Umfrage ist nicht notwendig, wenn der Spieler, der ihn gebaut hat, online ist und der Änderung oder Entfernung zustimmt.\n\nKartenweites Ändern von Modulen und das Aufrüsten von Förderbändern müssen vor der Änderung oder Aufrüstung als Team abgestimmt werden.\n\nIm Falle einer Teamabstimmung/Umfrage gewinnt die Mehrheit.\n\nNur 1 oder 2 Spieler online reichen für eine Teamdiskussion oder Abstimmung/Umfrage nicht aus. Trotzdem kann die Änderung oder Entfernung eines Baus notwendig sein, damit die Basis reibungslos weiterläuft. Eine Nachricht sollte im Spielchat hinterlassen werden, die besagt, dass ein Bau geändert oder entfernt wird und warum dies nötig ist. Nur zu behaupten, dein Design oder Bau sei besser oder sehe schöner aus, reicht nicht aus.
map_info_button=Karteninfo
map_info_header=Karteninformationen
map_name_label=Kartenname:
map_desc_label=Kartenbeschreibung:
map_extra_info_label=Zusätzliche Informationen:
softmods_button=Szenario-Mods
softmods_header=Enthaltene Mods und Server Plugins
softmods_rank_text=Wir haben ein grundlegendes Rangsystem, um Griefing zu verhindern. Du kannst keine Atombomben oder den Dekonstruktionsplaner verwenden, wenn du ein Gast bist. Wenn du ein paar Stunden spielst, wirst du von einem Admin zum Stammgast befördert. Du kannst auch einen Admin um eine Beförderung bitten, wenn du an einem Projekt arbeitest, das dies erfordert.\n
softmods_rank_is=Dein Rang ist:
softmods_market_label=Markt
softmods_market_text=Auf den meisten Karten findest du einen Markt in der Nähe des Spawns, wo du mit Münzen Einkäufe tätigen kannst. Münzen bekommst du durch das Abholzen von Bäumen, das Herstellen von Gegenständen von Hand und das Zerstören von Beißer-Nestern. Die meisten Gegenstände auf dem Markt sind konstant, aber einige sind kartenspezifisch (normalerweise Deponie) und wechseln sich von Zeit zu Zeit ab.
softmods_saviour_label=Zugretter
softmods_saviour_text=Züge sind der schlimmste Feind eines Factorio-Spielers. Wenn du mindestens einen Spieler-Port in deinem Inventar hast und von einem Zug getötet wirst, wird dein Leben verschont, aber du verlierst einen Spieler-Port. Spieler-Ports kannst du vom Markt erhalten.
softmods_plist_label=Spielerliste
softmods_plist_text=Listet alle Spieler auf dem Server auf und zeigt einige Statistiken. Du kannst die Liste durch Anklicken der Spaltenüberschriften sortieren. Du kannst auch andere Spieler anstupsen, wodurch ein zufälliges Wort im Chat erscheint.
softmods_polls_label=Umfragen
softmods_polls_text=Umfragen helfen Spielern, Konsens für größere Aktionen zu finden. Möchtest du einen wichtigen Bau verbessern? Erstelle eine Umfrage, um zu prüfen, ob alle damit einverstanden sind. Du musst Stammgast sein, um neue Umfragen zu erstellen.
softmods_tags_label=Tags
softmods_tags_text=Du kannst dir mit Tags eine Rolle zuweisen, damit andere Spieler wissen, was du machst. Oder benutze den Tag einfach als Dekoration. Stammgäste können neue eigene Tags erstellen – zeig ruhig, wie kreativ du bist.
softmods_tasks_label=Aufgaben
softmods_tasks_text=Du weißt nicht, woran du arbeiten solltest? Wirf doch einen Blick auf die Aufgaben und sieh nach, was zu tun ist. Stammgäste können neue Aufgaben hinzufügen.
softmods_bp_label=BP\nHelfer
softmods_bp_text=Mit dem Blaupausen-Helfer™ kannst du Blaupausen horizontal oder vertikal spiegeln und\ndarin verwendete Objekte umwandeln, z. B. gelbe Fließbänder in rote Fließbänder.
softmods_score_label=Punkte
softmods_score_text=Zeigt die Anzahl der gestarteten Raketen, der erledigten Beißer, der gebauten Objekte und vieles mehr an!
softmods_shortcuts_label=Schnellzugriffe
softmods_shortcuts_text=Spieler-Schnellzugriffe sind leicht zugängliche Schaltflächen, die dem Spieler nützliche Werkzeuge bieten. Entferne Biter-Leichen vom Boden, sortiere dein Inventar in nahegelegene Truhen/Öfen, lade deine ausgerüsteten Batterien über nahegelegene Akkus auf und vieles mehr.
softmods_production_hud_label=Prod.-HUD
softmods_production_hud_text=Das Produktions-HUD ist ein Fenster mit Produktionsstatistiken, das die ganze Zeit auf dem Bildschirm bleiben kann. Füge Gegenstände zur beobachteten Liste hinzu oder entferne sie daraus und stell sicher, dass die Fabrik stets gut versorgt ist!
softmods_train_station_teleport_label=Teleporter
softmods_train_station_teleport_text=Der Bahnhofsteleport erlaubt Spielern, sich sofort zwischen [entity=train-stop] auf der ganzen Karte zu teleportieren. Du musst nur neben einem [entity=train-stop] stehen, in der Kartenansicht einen anderen [entity=train-stop] öffnen und dich über dessen Teleport-Schaltfläche dorthin teleportieren.
softmods_autofill_label=Autofill
softmods_autofill_text=Legt beim Bauen von Geschützen automatisch Munition ab. Kann so konfiguriert werden, dass Munitionstypen und Menge gefiltert werden.
softmods_paint_brush_label=Pinsel
softmods_paint_brush_text=Die Fabrik muss wachsen! ...mit Stil
whats_new_button=Was ist neu

