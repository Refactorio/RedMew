description=[font=default-bold]RedMew ist eine Factorio-Community, die eigene Server, Karten in den verschiedensten Formen und Größen, gescriptete Szenarien und modifizierte Server betreibt.[/font]\nUnser Szenario bietet über 100 verschiedene Karten, und du kannst die Karte deiner Wahl mit den folgenden Schritten auswählen:\n\n[color=green]Einfacher Modus: besuche[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Expertenmodus: bearbeite map_selection.lua im Szenario-Ordner[/color]\nWeitere Details zu den einzelnen Karten findest du in der Liste unter [color=blue]redmew.com/maps[/color]\n\nNützliche Links: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Danke, dass du dich für Redmew entschieden hast – ein Szenario von Refactorio![/color]
