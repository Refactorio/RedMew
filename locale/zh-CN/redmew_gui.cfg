# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew 信息[/color][/font]\n 社区、规则、功能、地图信息
welcome_header=欢迎加入Redmew游戏场景!
welcome_text=Redmew是一个面向致力于探索Factorio多人游戏之极致的各种水平的玩家设立的社区. Redmew通过定制的场景脚本和地图设计实现这一目标.\n\n我们是一群友好的玩家, 我们的目标是尽可能的玩开心, 希望您也能玩开心.
chatting_header=如何聊天
chatting_text=按 __CONTROL__toggle-console__键来和其他人聊天.\n 默认是ESC下面的(~)键.\n 这个按键可以在以下菜单中修改:__1__ -> __2__ -> __3__.
free_coin_header=免费硬币
free_coin_text=因为您阅读了欢迎界面, 奖励您__1__个__2__.\n 查看其他标签页会再奖励您__1__个__2__.\n
free_coin_print=您因为阅读信息页面被奖励了__1__个__2__.
links_header=实用链接
links_discord=加入我们的discord频道来获取新地图信息并提交新地图或想法。
links_patreon=在Patreon平台上向我们捐赠以获得特别待遇并帮助我们维护服务器.
links_saves=从我们的网站上下载我们的地图,包括开局地图和终局地图.
links_factoriomaps=在 Google 地图上查看我们过去的地图。
rules_header=规则
rules_text=玩得开心，友好游戏。请记住我们都是来玩的，让我们保持这样。\n\n禁止仇恨内容或人身攻击。\n\n如果你怀疑有人在进行恶意破坏，请使用 /report 向管理团队举报，或在玩家列表中点击该玩家旁边的举报按钮。
rules_text_danger_ore=如需修改或拆除其他玩家的建筑，必须先进行团队讨论或投票。\n\n若建造该建筑的玩家在线并同意修改或拆除，则无需团队讨论或投票。\n\n全地图范围的模块更换和传送带升级必须先经团队投票后方可进行。\n\n进行团队投票时，少数服从多数。\n\n只有 1 或 2 名玩家在线时不足以进行团队讨论或投票。然而，为保持基地平稳运转，修改或拆除某座建筑可能是必要的。此时应在游戏内聊天中留言，说明自己正在修改或拆除某建筑以及为何需要这样做。仅仅声称自己的设计或建筑更好、更好看是不够的。
map_info_button=地图信息
map_info_header=地图信息
map_name_label=地图名称：
map_desc_label=地图描述：
map_extra_info_label=详细信息：
softmods_button=场景Mod
softmods_header=脚本和服务器插件
softmods_rank_text=我们有一个基本的等级系统来防止恶意破坏。如果你是访客，将无法使用核弹或拆除规划器。如果你游玩了几个小时，管理员会将你提升为正式成员。如果你正在进行需要该等级的项目，也可以向管理员申请提升。\n
softmods_rank_is=您的身份是：
softmods_market_label=超市
softmods_market_text=在大多数地图上，出生点附近会有一个市场，你可以用硬币在那里购物。硬币可以通过砍树、手工制作物品和摧毁虫巢获得。市场中的大多数商品是固定的，但有些是地图专属的（通常是填土），会不时轮换上下架。
softmods_saviour_label=火车救星
softmods_saviour_text=火车是 Factorio 玩家最大的敌人。如果你的物品栏中至少有一个玩家端口并被列车撞死，你的生命将被挽救，但你会失去一个玩家端口。玩家端口可以从市场获得。
softmods_plist_label=玩家列表
softmods_plist_text=列出服务器上的所有玩家并显示一些统计数据。您可以通过点击列标题来排序列表。您也可以“戳”其他玩家，这会在聊天中发送一条随机消息。
softmods_polls_label=投票
softmods_polls_text=投票帮助玩家就重大行动达成共识。想改进一座重要建筑？发起投票以确认大家都同意。发起新投票需要正式成员等级。
softmods_tags_label=标签
softmods_tags_text=您可以通过标签给自己设定角色，让其他玩家知道您在做什么。也可以仅将标签用作装饰。正式成员可以创建新的自定义标签。
softmods_tasks_label=任务
softmods_tasks_text=不确定该做什么?看看任务列表。常规玩家可以添加新的任务。
softmods_bp_label=蓝图\n助手
softmods_bp_text=蓝图助手™可以帮你水平或垂直翻转蓝图，\n并可以转换蓝图中的实体，例如将黄色传送带换成红色传送带。
softmods_score_label=分数
softmods_score_text=显示发射的火箭数、解放的虫子数、建造的实体数等更多信息！
softmods_shortcuts_label=快捷方式
softmods_shortcuts_text=玩家快捷方式是便于访问的按钮，为玩家提供实用工具：清除地上的虫子尸体、将物品栏整理进附近的箱子/熔炉、用附近的蓄电器为已装备的电池充电，等等。
softmods_production_hud_label=生产 HUD
softmods_production_hud_text=生产 HUD 是一个可以一直停留在屏幕上的生产统计窗口。添加/移除追踪列表中的物品，确保工厂补给充足！
softmods_train_station_teleport_label=传送器
softmods_train_station_teleport_text=火车站传送功能允许玩家在地图各处的 [entity=train-stop] 之间瞬间传送。只需站在某个 [entity=train-stop] 附近，然后在地图视图中打开另一个 [entity=train-stop]，点击其传送按钮即可传送过去。
softmods_autofill_label=自动填充
softmods_autofill_text=建造炮塔时自动投放弹药。可配置筛选弹药类型和数量。
softmods_paint_brush_label=刷漆笔
softmods_paint_brush_text=工厂必须扩张！……而且要有格调
whats_new_button=新功能

