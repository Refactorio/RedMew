auto_stash_tooltip=[font=default-bold]自动收纳[/font] - 将你的背包物品分类存入附近的箱子。\n[color=yellow][font=default-bold]鼠标左键[/font][/color]:收纳所有物品(快捷栏物品除外)。\n[color=yellow][font=default-bold]鼠标右键[/font][/color]:仅将矿石存入附近的箱子(快捷栏物品除外)。\n[color=yellow][font=default-bold]CTRL + 鼠标右键[/font][/color]:装满附近的冶炼炉。\n[color=yellow][font=default-bold]SHIFT + 鼠标左键[/font][/color]:将所有物品存入货车/箱子的已过滤槽位。\n[color=yellow][font=default-bold]SHIFT + 鼠标右键[/font][/color]:仅将矿石存入货车。

