description=[font=default-bold]RedMew 是一个 Factorio 社区，运营自定义服务器、各种形状与大小的地图、脚本化剧情以及模组服务器。[/font]\n我们的剧本提供超过 100 张不同的地图，你可以按照以下步骤选择你喜欢的地图：\n\n[color=green]简单模式：访问[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]专家模式：编辑剧本文件夹中的 map_selection.lua[/color]\n欲了解每张地图的详细信息，请查看 [color=blue]redmew.com/maps[/color] 上的列表\n\n实用链接：Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]感谢选择 Redmew——Refactorio 出品的剧本！[/color]
