logistic_requests_save=将你的 [color=blue]物流请求[/color] 保存在服务器上，供以后的地图使用
logistic_requests_load=从服务器加载你的 [color=blue]物流请求[/color]（会覆盖现有栏位）
logistic_requests_delete=从服务器上删除你保存的 [color=blue]物流请求[/color]
set_pollution_multiplier=实验性功能。一个整数，乘以 0.01 后即为 crash site 魔法制造厂产生的污染量。默认值为 0
get_pollution_multiplier=Crash site当前的污染倍数。默认值为0。
perks=列出为当前生效的福利做出贡献的 Patreon 捐助者。
generate_desc=生成服务器名称、描述和标签，以便粘贴到 /config 界面中
