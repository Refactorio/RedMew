meltdown_get=获取熔毁状态。
meltdown_set=设置熔毁状态。
redmew_color=Set(设置) 将为将来的地图保存当前颜色。Reset(重置) 将会删除您保存的颜色。Random(随机) 将给您一个随机颜色。
performance_scale_set=设置介于 0.05 至 1 之间的性能比例。将按阵营改变游戏速度、手工采矿速度、手工制作速度和角色奔跑速度。
performance_scale_get=显示当前的性能等级。
permissions_reset=使用 "/permissions-reset" 将所有玩家的权限重置为默认值
permissions_set_scenario=使用 "/permissions-set-scenario" 重新应用场景的权限（如有）
market=在您附近放置一个超市。使用 /market removeall 可移除地图上的所有超市
lazy_bastard_bootstrap=放置起步所需的最低限度设施
