crash_site_barrage_count=将弹幕伤害升级至 [font=var]__1__[/font] 级\n\n要使用弹幕，请将爆炸火箭放入出生点箱子，然后输入 /barrage 及一个 gps 坐标\n\n伤害升级会增加发射的火箭数量。\n\n[color=255,230,192][font=default-bold]当前等级:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]当前火箭数量:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]当前花费:[/font][/color] [font=var]__4__[/font]
crash_site_barrage_radius=将弹幕半径升级至 [font=var]__1__[/font] 级\n\n要使用弹幕，请将爆炸火箭放入出生点箱子，然后输入 /barrage 及一个 gps 坐标\n\n[color=255,230,192][font=default-bold]当前等级:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]当前半径:[/font][/color] [font=var]__3__[/font]
crash_site_barrage_radius_name_label=[color=255,230,192][font=default-large-bold]火箭弹幕半径 __1__\n[/font][/color]
crash_site_barrage_count_name_label=[color=255,230,192][font=default-large-bold]火箭弹幕伤害 __1__\n[/font][/color]
crash_site_barrage_not_researched=你尚未研究弹幕技术。请前往出生点的市场 [gps=-3,-3,redmew]
crash_site_barrage_insufficient_currency_error=要发起火箭弹幕，请向付款箱 [gps=-4.5,-7.5,redmew] 中再装入 __1__ 枚爆炸火箭
crash_site_barrage_no_nests=在这些坐标处没有发现巢穴 ([gps=__1__,__2__,__3__])，火箭真是白费了！
crash_site_barrage_damage_upgrade_success=__1__ 已将火箭弹幕伤害升级至 __2__ 级
crash_site_barrage_radius_upgrade_success=__1__ 已将火箭弹幕半径升级至 __2__ 级
crash_site_rocket_tanks_name_label=[color=255,230,192][font=default-large-bold]坦克火箭开火间隔 __1__\n[/font][/color]
crash_site_rocket_tank_upgrade_success=__1__已将坦克火箭的间隔时间升级到__2__级
crash_site_rocket_tanks_description=升级坦克火箭的开火间隔，以缩短火箭发射之间的时间。\n\n将火箭放入坦克物品栏中，它们会自动攻击敌方蠕虫和虫巢。
crash_site_spider_army_decon_label=[color=255,230,192][font=default-large-bold]蜘蛛机甲军团编组规划器\n[/font][/color]
crash_site_spider_army_decon_description=使用此拆除规划器可快速将蜘蛛机甲编组成一支军团。第一步，框选一个包含你的蜘蛛机甲的区域。第二步，单击左键选择一个目标蜘蛛机甲，让你的编队跟随它。
