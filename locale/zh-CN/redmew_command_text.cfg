[command_custom_help]
tp=<blank|mode|player> 3 种不同的用法: "/tp" 传送到选中的实体。"/tp mode" 切换 tp 模式。"/tp Newcott" 传送到 Newcott。
poll=<{question = "问题", answers = {"答案 1", "答案 2"}, duration = 300}>
module_only=仅在启用相应模块时可用
