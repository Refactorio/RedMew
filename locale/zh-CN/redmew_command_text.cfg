danger_ore_restart_condition_not_met=没有发射足够的[item=satellite] 来重新启动地图。
diggy_restart_condition_not_met=更卖力地挖矿吧，矮人！你必须达到采矿生产力 __1__ 才能开始新的采矿远征！
crash_site_restart=重新启动crashsite场景。
crash_site_restart_abort=中止重启crashsite场景。
crash_site_spy=花费硬币买一条鱼去侦察敌人一小段时间。
crash_site_spy_invalid=您需要添加一个有效的位置来发送间谍鱼。例如/spy [gps=-110,-17,redmew]
crash_site_spy_funds=训练这些间谍鱼不便宜！你需要更多的硬币！
crash_site_spy_success=__1__ 使用了 /spy 命令并花费 __2__ 枚硬币训练一条鱼去侦察敌人 [gps=__3__,__4__,redmew]
crash_site_airstrike_invalid=无效的坐标。
crash_site_airstrike=使用剧毒胶囊对虫群发动空袭。
crash_site_airstrike_count=将空袭伤害升级至 [font=var]__1__[/font] 级\n\n要使用空袭，请将剧毒胶囊放入出生点箱子，然后输入 /strike 及一个 gps 坐标\n\n伤害升级会增加空袭发射的剧毒胶囊数量。\n\n[color=255,230,192][font=default-bold]当前等级：[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]当前毒胶囊数量：[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]当前花费：[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=将空袭半径升级至 [font=var]__1__[/font] 级\n\n要使用空袭，请将剧毒胶囊放入出生点箱子，然后输入 /strike 及一个 gps 坐标\n\n[color=255,230,192][font=default-bold]当前等级：[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]当前半径：[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]空袭半径 __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]空袭伤害 __1__\n[/font][/color]
crash_site_airstrike_not_researched=您还没有研究空袭。请访问出生点的市场 [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=要发起空袭，请向付款箱 [gps=2.5,-7.5,redmew] 中再装入 __1__ 枚毒胶囊
crash_site_airstrike_friendly_fire_error=你不想那样做，目标区域中没有找到敌人。
crash_site_airstrike_damage_upgrade_success=__1__ 已将空袭伤害升级到 __2__级
crash_site_airstrike_radius_upgrade_success=__1__已将空袭半径升级到__2__级
crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]毒气打击瞄准遥控器\n[/font][/color]
crash_site_airstrike_planner_description=使用此拆除规划器，只需点击一下即可轻松发起毒气打击。将它放入快捷栏以便随时使用。
crash_site_airstrike_no_enemies=在 [gps=__1__,__2__,__3__] 处没有发现敌人。毒胶囊真是白费了！
