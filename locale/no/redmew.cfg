description=[font=default-bold]RedMew er et Factorio-samfunn som drifter egendefinerte servere, kart i ulike former og størrelser, skriptbaserte scenarier og moddede servere.[/font]\nScenarioet vårt tilbyr over 100 forskjellige kart, og du kan velge det du ønsker med følgende trinn:\n\n[color=green]Enkel modus: besøk[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Ekspertmodus: rediger map_selection.lua i scenariomappen[/color]\nFor flere detaljer om hvert kart kan du se listen på [color=blue]redmew.com/maps[/color]\n\nNyttige lenker: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Takk for at du velger Redmew, et scenario av Refactorio![/color]
