# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew Info[/color][/font]\n Samfunn, regler, funksjoner, kartinfo
welcome_header=Velkommen til Redmew!
welcome_text=RedMew er et samfunn for spillere på alle ferdighetsnivåer, forpliktet til å presse grensene for Factorio-flerspiller gjennom tilpassede skript og sprø kartdesign.\n\nVi er en vennlig gjeng, målet vårt er å ha så mye moro som mulig, og vi håper du også får det.
chatting_header=Hvordan chatte
chatting_text=For å chatte med andre spillere, trykk på __CONTROL__toggle-console__-tasten på tastaturet ditt.\nStandardtasten på engelsk tastatur er apostrof (`) og ligger under ESC-tasten.\nDette kan endres i __1__ -> __2__ -> __3__.
free_coin_header=Gratis Mynter
free_coin_text=Du har blitt tildelt __1__ __2__ for å se på velkomstfanen.\nÅ sjekke hver fane gir deg __1__ flere __2__.\n
free_coin_print=__1__ __2__ tildelt for å lese en fane på informasjonskjermen.
links_header=Nyttige linker
links_discord=Sjekk ut Discord-serveren vår for ny kartinfo og for å foreslå nye kart / ideer.
links_patreon=Bidra til vår Patreon for å motta spesielle fordeler og bidra til å opprettholde våre servere.
links_saves=Last ned kartene våre, start og slutt, fra vår hjemmeside.
links_factoriomaps=Se våre tidligere kart i Google Map.
rules_header=Regler
rules_text=Ha det gøy og spill pent. Husk at vi alle bare er her for å ha det gøy, så la oss holde det slik.\n\nIngen hatelige innhold eller personlige angrep.\n\nHvis du mistenker at noen griefer, gi beskjed til adminteamet ved å bruke /report eller ved å klikke på rapportknappen ved siden av spilleren i spillerlisten.
rules_text_danger_ore=Hvis bygget til en annen spiller må endres eller fjernes, må det holdes en teamdiskusjon eller avstemming før endringen eller fjerningen gjøres.\n\nEn teamdiskusjon eller avstemming er ikke nødvendig hvis spilleren som bygde det er pålogget og samtykker til endringen eller fjerningen.\n\nKartomfattende endring av moduler og oppgradering av belter må stemmes over som et team før endringen eller oppgraderingen gjøres.\n\nVed en teamavstemming vinner flertallet.\n\nBare 1 eller 2 spillere pålogget er ikke nok til en teamdiskusjon eller avstemming. Likevel kan det være nødvendig å endre eller fjerne et bygg for at basen skal fungere smidig. Da bør det legges igjen en melding i spillchaten om at et bygg endres eller fjernes, og hvorfor det er nødvendig. Det er ikke nok å bare si at designet eller bygget ditt er bedre eller ser penere ut.
map_info_button=Kartinfo
map_info_header=Kartinformasjon
map_name_label=Kartnavn:
map_desc_label=Kartbeskrivelse:
map_extra_info_label=Ekstra info:
softmods_button=Funksjoner
softmods_header=Funksjoner og servertillegg
softmods_rank_text=Vi har et enkelt rangsystem for å forhindre griefing. Du kan ikke bruke atomraketter eller rivningsplanleggeren hvis du er gjest. Hvis du spiller i et par timer, vil en admin forfremme deg til regular. Du kan også be en admin om forfremmelse hvis du jobber med et prosjekt som krever det.\n
softmods_rank_is=Rangen din er:
softmods_market_label=Marked
softmods_market_text=På de fleste kart finner du et marked i nærheten av spawn, der du kan bruke mynter til å kjøpe ting. Mynter skaffes ved å hogge trær, håndlage gjenstander og ødelegge biter-reir. De fleste varene i markedet er faste, men noen er kartspesifikke (vanligvis landfill) og roterer inn og ut fra tid til annen.
softmods_saviour_label=Togfrelser
softmods_saviour_text=Tog er en Factorio-spillers verste fiende. Hvis du har minst én spillerport i inventaret ditt og blir drept av et tog, blir livet ditt spart, men du mister en spillerport. Du kan få tak i spillerporter fra markedet.
softmods_plist_label=Spillerliste
softmods_plist_text=Viser alle spillere på serveren og viser litt statistikk. Du kan sortere listen ved å klikke på kolonneoverskriftene. Du kan også poke folk, noe som kaster et tilfeldig substantiv ut i chatten.
softmods_polls_label=Meningsmålinger
softmods_polls_text=Avstemninger hjelper spillerne å få konsensus rundt store tiltak. Vil du forbedre et viktig bygg? Lag en avstemning for å sjekke at alle er ok med det. Du må være regular for å lage nye avstemninger.
softmods_tags_label=Tagger
softmods_tags_text=Du kan gi deg selv en rolle med tagger for å la andre spillere vite hva du gjør. Eller bare bruk taggen som dekorasjon. Regulars kan opprette nye egendefinerte tagger, så vis gjerne frem kreativiteten din.
softmods_tasks_label=Oppgaver
softmods_tasks_text=Ikke sikker på hva du bør jobbe med? Hvorfor ikke se på oppgavene og se hva som må gjøres. Regulars kan legge til nye oppgaver.
softmods_bp_label=BP\nhjelper
softmods_bp_text=Med blåkopihjelperen™ kan du speile blåkopier horisontalt eller vertikalt, og lar deg\nkonvertere enhetene som brukes i blåkopien, f.eks. endre gule rullebånd til røde rullebånd.
softmods_score_label=Poeng
softmods_score_text=Viser antall raketter skutt opp, bitere frigjort, enheter bygget og mye mer!
softmods_shortcuts_label=Snarveier
softmods_shortcuts_text=Spillersnarveier er lettilgjengelige knapper som gir spilleren nyttige verktøy. Fjern biter-lik fra bakken, sorter inventaret ditt i nærliggende kister/ovner, lad opp batteriene dine fra nærliggende akkumulatorer og mye mer.
softmods_production_hud_label=Prod. HUD
softmods_production_hud_text=Produksjons-HUD-en er et produksjonsstatistikkvindu som kan holdes på skjermen hele tiden. Legg til/fjern gjenstander fra den overvåkede listen, og sørg for at fabrikken alltid får nok forsyninger!
softmods_train_station_teleport_label=Teleporter
softmods_train_station_teleport_text=Togstasjonteleporteringen lar spillere teleportere øyeblikkelig mellom [entity=train-stop] over hele kartet. Alt du trenger å gjøre er å stå i nærheten av en [entity=train-stop], åpne en annen [entity=train-stop] fra kartvisningen og teleportere til den med teleporteringsknappen.
softmods_autofill_label=Autofyll
softmods_autofill_text=Slipper automatisk ut ammunisjon når du bygger tårn. Kan konfigureres til å filtrere ammunisjonstyper og mengde.
softmods_paint_brush_label=Malerkost
softmods_paint_brush_text=Fabrikken må vokse! ...med stil
whats_new_button=Nytt

