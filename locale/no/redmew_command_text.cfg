crash_site_barrage_count=Oppgrader skaden fra salve til nivå [font=var]__1__[/font]\n\nFor å bruke salve legger du eksplosive raketter i spawn-kisten og skriver deretter /barrage etterfulgt av en gps-posisjon\n\nSkadeoppgraderinger øker antallet raketter som avfyres.\n\n[color=255,230,192][font=default-bold]Gjeldende nivå:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Gjeldende antall raketter:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Gjeldende kostnad:[/font][/color] [font=var]__4__[/font]
crash_site_barrage_radius=Oppgrader radien for salve til nivå [font=var]__1__[/font]\n\nFor å bruke salve legger du eksplosive raketter i spawn-kisten og skriver deretter /barrage etterfulgt av en gps-posisjon\n\n[color=255,230,192][font=default-bold]Gjeldende nivå:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Gjeldende radius:[/font][/color] [font=var]__3__[/font]
crash_site_barrage_radius_name_label=[color=255,230,192][font=default-large-bold]Radius for rakettsalve __1__\n[/font][/color]
crash_site_barrage_count_name_label=[color=255,230,192][font=default-large-bold]Skade fra rakettsalve __1__\n[/font][/color]
crash_site_barrage_not_researched=Du har ikke forsket rakettsalven ennå. Besøk markedet ved spawn [gps=-3,-3,redmew]
crash_site_barrage_insufficient_currency_error=For å sende en rakettsalve må du laste __1__ flere eksplosive raketter i betalingskisten [gps=-4.5,-7.5,redmew]
crash_site_barrage_no_nests=Ingen reir funnet på disse koordinatene ([gps=__1__,__2__,__3__]), for en sløsing med raketter!
crash_site_barrage_damage_upgrade_success=__1__ har oppgradert skaden fra rakettsalven til nivå __2__
crash_site_barrage_radius_upgrade_success=__1__ har oppgradert radiusen til rakettsalven til nivå __2__
crash_site_rocket_tanks_name_label=[color=255,230,192][font=default-large-bold]Ildintervall for rakettstridsvogner __1__\n[/font][/color]
crash_site_rocket_tank_upgrade_success=__1__ har oppgradert intervallet til rakettstridsvognen til nivå __2__
crash_site_rocket_tanks_description=Oppgrader ildintervallet til rakettstridsvognen for å redusere tiden mellom rakettene.\n\nPlasser raketter i stridsvognens lager slik at de automatisk sikter på fiendtlige ormer og reir.
crash_site_spider_army_decon_label=[color=255,230,192][font=default-large-bold]Grupperingsplanlegger for spidertron-hær\n[/font][/color]
crash_site_spider_army_decon_description=Bruk denne rivningsplanleggeren til raskt å gruppere spidertroner til en hær. Bruk først gruppevalg til å markere et område som inneholder spidertronene dine. Klikk deretter én gang med venstre museknapp på en mål-spidertron som gruppen din skal følge.
max_level=(MAKS NIVÅ)
dataset_copy=Kopierer et datasett
dataset_move=Flytter et datasett
