# This file holds all the locale strings for command help and descriptions
# Ideally, string keys match command names (with - turned to _)

[command_description]
reward=Gir en belønning til en målspiller (fjerner hvis mengden er negativ)
diggy_clear_void=Rydder tomrommet i et gitt område, men utløser fortsatt alle hendelser Diggy ville ha gjort når du sletter tomrommet.
config_restart=Åpner vinduet for serveromstart fra serverkonfigurasjonene
restart=Starter kartet på nytt.
abort=Avbryter en omstart.
danger_ore_restart_condition_not_met=Det har ikke blitt skutt opp nok [item=satellite] til å starte kartet på nytt.
diggy_restart_condition_not_met=Grav hardere, dverg! Du må nå Gruvedriftsproduktivitet __1__ for å starte et nytt gruveeventyr!
crash_site_restart=Starter crashsite-scenarioet på nytt.
crash_site_restart_abort=Avbryter omstart av crashsite scenario.
crash_site_spy=Bruk mynter til å sende en fisk for å spionere på fienden en kort stund.
