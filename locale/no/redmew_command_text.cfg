crash_site_spy_success=__1__ brukte /spy-kommandoen og brukte __2__ mynter på å trene en fisk til å spionere på fienden [gps=__3__,__4__,redmew]
crash_site_airstrike_invalid=Ugyldige koordinater.
crash_site_airstrike=Avfyr et luftangrep mot fienden med giftkapsler.
crash_site_airstrike_count=Oppgrader skaden fra luftangrep til nivå [font=var]__1__[/font]\n\nFor å bruke luftangrep legger du giftkapsler i spawn-kisten og skriver deretter /strike etterfulgt av en gps-posisjon\n\nSkadeoppgraderinger øker antallet giftkapsler som avfyres ved luftangrep.\n\n[color=255,230,192][font=default-bold]Gjeldende nivå:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Gjeldende antall granater:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Gjeldende kostnad:[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=Oppgrader radien for luftangrep til nivå [font=var]__1__[/font]\n\nFor å bruke luftangrep legger du giftkapsler i spawn-kisten og skriver deretter /strike etterfulgt av en gps-posisjon\n\n[color=255,230,192][font=default-bold]Gjeldende nivå:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Gjeldende radius:[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]Radius for luftangrep __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]Skade fra luftangrep __1__\n[/font][/color]
crash_site_airstrike_not_researched=Du har ikke forsket på luftangrep ennå. Besøk markedet ved spawn [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=For å sende et luftangrep, last __1__ flere giftkapsler i betalingskisten [gps=2.5,-7.5,redmew]
crash_site_airstrike_friendly_fire_error=Det vil du ikke gjøre, ingen fiender funnet i målområdet.
crash_site_airstrike_damage_upgrade_success=__1__ har oppgradert skaden fra luftangrep til nivå __2__
crash_site_airstrike_radius_upgrade_success=__1__ har oppgradert radien for luftangrepet til nivå __2__
crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]Fjernkontroll for giftangrep\n[/font][/color]
crash_site_airstrike_planner_description=Bruk denne rivingsplanleggeren til enkelt å avfyre et giftangrep med ett klikk. Legg den i hurtiglinjen for enkel tilgang.
crash_site_airstrike_no_enemies=Ingen fiender funnet ved [gps=__1__,__2__,__3__]. For et sløseri med giftkapsler!
crash_site_barrage_planner_label=[color=255,230,192][font=default-large-bold]Fjernkontroll for salve\n[/font][/color]
