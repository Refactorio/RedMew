# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew Info[/color][/font]\n Fællesskab, regler, funktioner, kortinfo
welcome_header=Velkommen til Redmew!
welcome_text=Redmew er et fællesskab for alle spillere uanset niveau. Vores mål er at udfordre grænserne for Factorio Multiplayer gennem modificeringer og skøre designs.\n\nVi er en venlig flok mennesker, og vores ultimative mål er at have det så sjovt som muligt. Vi håber, at du også vil have det ligeså sjovt.
chatting_header=Deltag i Debatten
chatting_text=For at chatte med andre spillere, tryk på __CONTROL__toggle-console__-tasten på dit tastatur.\nStandardtasten på engelske tastaturer er accenttasten (`) og ligger under ESC-tasten.\nDette kan ændres i __1__ -> __2__ -> __3__.
free_coin_header=Gratis Mønter
free_coin_text=Du er blevet tildelt __1__ __2__ for at kigge på velkomstfanen.\nVed at læse hver fane belønnes du med __1__ __2__ mere.\n
free_coin_print=__1__ __2__ modtaget for at læse en fane i informationsvinduet.
links_header=Nyttige Links
links_discord=Tjek vores discord server ud for informationer omkring nye servere, eller for at komme med ris / ros.
links_patreon=Giv et bidrag gennem vores Patreon og få adgang til specielle frynsegoder, samt hjælpe med at holde serverne oppe.
links_saves=Hent spil i deres oprindelige eller endelige tilstand, fra vores hjemmeside.
links_factoriomaps=Se et kort over vores tidligere spil.
rules_header=Regler
rules_text=Hyg dig, og vær venlig. Husk, at alle er her for at have det sjovt, så lad os holde det sådan.\n\nHadefuldt indhold og personlige angreb tolereres ikke.\n\nHvis du mistænker nogen for at ødelægge spillet, skal du kontakte moderationsholdet ved at bruge /report eller ved at klikke på rapportknappen ved siden af spilleren i spillerlisten.
rules_text_danger_ore=Hvis en anden spillers bygværk skal ændres eller fjernes, kræves der en teamdiskussion eller afstemning, før ændringen eller fjernelsen gennemføres.\n\nEn teamdiskussion eller afstemning er ikke nødvendig, hvis spilleren, der byggede det, er online og accepterer ændringen eller fjernelsen.\n\nÆndring af moduler på tværs af kortet og opgradering af bånd skal stemmes om som team, før ændringen eller opgraderingen gennemføres.\n\nVed en teamafstemning vinder flertallet.\n\nKun 1 eller 2 spillere online er ikke nok til en teamdiskussion eller afstemning. Alligevel kan det være nødvendigt at ændre eller fjerne et bygværk for at holde basen kørende stabilt. Der bør efterlades en besked i spillets chat om, at man ændrer eller fjerner et bygværk, og hvorfor det er nødvendigt. Det er ikke nok blot at sige, at dit design eller bygværk er bedre eller ser pænere ud.
map_info_button=Spil info
map_info_header=Spil information
map_name_label=Spilnavn:
map_desc_label=Spil beskrivelse:
map_extra_info_label=Ekstra information:
softmods_button=Scenarie Mods
softmods_header=Modifikationer og servertilføjelser
softmods_rank_text=Vi har et grundlæggende rangsystem til at forhindre griefing. Du kan ikke bruge atombomber eller dekonstruktionsplanlæggeren, hvis du er gæst. Hvis du spiller i et par timer, vil en admin forfremme dig til regular. Du kan også bede en admin om en forfremmelse, hvis du arbejder på et projekt, der kræver det.\n
softmods_rank_is=Din rank er:
softmods_market_label=Marked
softmods_market_text=På de fleste kort finder du et marked nær spawn, hvor du kan bruge mønter til at foretage køb. Mønter optjenes ved at fælde træer, håndfremstille genstande og ødelægge biter-reder. De fleste varer i markedet er faste, men nogle er kortspecifikke (normalt landfill) og skifter ind og ud fra tid til anden.
softmods_saviour_label=Togfrelser
softmods_saviour_text=Tog er en Factorio-spillers værste fjende. Hvis du har mindst én spillerport i dit inventar og bliver dræbt af et tog, skånes dit liv, men du mister en spillerport. Du kan få spillerporte fra markedet.
softmods_plist_label=Spillerliste
softmods_plist_text=Viser alle spillere på serveren og viser nogle statistikker. Du kan sortere listen ved at klikke på kolonneoverskrifterne. Du kan også prikke til folk, hvilket smider et tilfældigt navneord i chatten.
softmods_polls_label=Afstemninger
softmods_polls_text=Afstemninger hjælper spillere med at opnå konsensus om store handlinger. Vil du forbedre et vigtigt bygværk? Lav en afstemning for at tjekke, at alle er okay med det. Du skal være regular for at lave nye afstemninger.
softmods_tags_label=Tags
softmods_tags_text=Du kan give dig selv en rolle med tags, så andre spillere kan se, hvad du laver. Eller brug bare tagget som dekoration. Regulars kan oprette nye brugerdefinerede tags, så vis endelig dit kreative værk.
softmods_tasks_label=Opgaver
softmods_tasks_text=Ikke sikker på, hvad du bør arbejde på? Hvorfor ikke kigge på opgaverne og se, hvad der skal gøres. Regulars kan tilføje nye opgaver.
softmods_bp_label=BP\nhjælper
softmods_bp_text=Blueprint helper™ lader dig spejle blåtryk vandret eller lodret og lader dig\nkonvertere de entiteter, der bruges i blåtrykket, f.eks. ændre gule bånd til røde bånd.
softmods_score_label=Point
softmods_score_text=Viser antal opsendte raketter, befriede bitere, byggede entiteter og meget mere!
softmods_shortcuts_label=Genveje
softmods_shortcuts_text=Spillergenveje er lettilgængelige knapper, der giver spilleren nyttige værktøjer. Ryd biterlig op fra jorden, sortér dit inventar i nærliggende kister/ovne, genoplad dine monterede batterier fra nærliggende akkumulatorer og meget mere.
softmods_production_hud_label=Prod. HUD
softmods_production_hud_text=Produktions-HUD'et er et vindue med produktionsstatistik, som kan beholdes på skærmen hele tiden. Tilføj/fjern genstande fra den overvågede liste, og sørg for, at fabrikken får mad nok!
softmods_train_station_teleport_label=Teleportør
softmods_train_station_teleport_text=Train Station Teleport gør det muligt for spilleren øjeblikkeligt at teleportere mellem [entity=train-stop] på tværs af kortet. Alt, du skal gøre, er at stå i nærheden af et [entity=train-stop] og fra kortvisningen åbne et andet [entity=train-stop] og teleportere til det med dets teleportknap.
softmods_autofill_label=Autoudfyld
softmods_autofill_text=Tilføjer automatisk ammunition ved bygning af kanontårne. Kan konfigureres til at filtrere ammunitionstyper og mængde.
softmods_paint_brush_label=Malerpensel
softmods_paint_brush_text=Fabrikken skal vokse! ...med stil
whats_new_button=Hvad er nyt

