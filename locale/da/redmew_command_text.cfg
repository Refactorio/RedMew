crash_site_airstrike=Igangsæt et luftangreb mod fjenden med giftkapsler.
crash_site_airstrike_count=Opgradér luftangrebets skade til niveau [font=var]__1__[/font]\n\nFor at bruge luftangreb skal du placere giftkapsler i spawn-kisten og derefter skrive /strike efterfulgt af en gps-position\n\nSkadeopgraderinger øger antallet af giftkapsler, som luftangrebet affyrer.\n\n[color=255,230,192][font=default-bold]Nuværende niveau:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Nuværende antal granater:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Nuværende pris:[/font][/color] [font=var]__4__[/font]
