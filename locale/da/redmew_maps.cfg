# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=Grotte kollapset!
cave_collapse_warning=Udgravning af ting som vægge, stenbelægning, beton\nog sten kan forårsage et hulekollaps, vær forsigtig, minearbejder!\n\nArbejdslederens råd: Placér en væg hver fjerde flise for at\nforhindre et hulekollaps. Brug stenbelægning og beton\nfor at forstærke det yderligere.

night_time_warning=Solpaneler placeret under jorden ser ikke ud til\nat have nogen effekt på kraftproduktionen!\nUndersøgelser viser, at det samme gælder for den bærbare version!\n\nArbejdslederens råd: Solpaneler er kun nyttige til at fremstille\nsatellitter

cracking_sound_1=L Ø B  F O R  L I V E T !
cracking_sound_2=K R A K

score_cave_collapses=Hulekollapser
score_mine_size=Størrelse af minen

auto_play_cutscene=Afspil automatisk Diggy-introduktionen
cutscene_case_line2=Velkommen til __1__
cutscene_case_line4=Dette er et brugerdefineret scenarie udviklet af __1__
cutscene_case_line5=Besøg os på __1__
cutscene_case_line6=Den følgende introduktion vil hjælpe dig i gang!
cutscene_case_line7=Hvis du oplever problemer under denne introduktion, så lad os det vide
cutscene_case0_line1=Dette er startområdet
cutscene_case0_line3=Det er farligt at udvide minen!
cutscene_case1_line1=Vægge bruges til at holde hulens tag fra at knuse os
cutscene_case2_line1=Markedet giver ekstra forsyninger i bytte for mønter
cutscene_case2_line3=Du låser nye genstande op, når du stiger i niveau
cutscene_case3_line1=Hulekollaps sker ofte, når du ikke tilføjer understøtninger
cutscene_case3_line3=Forskellige typer sten og beton kan forstærke vores bærende søjler!
cutscene_case4_line1=Denne verden indeholder skøre sten
cutscene_case4_line3=Vores værktøjer er for kraftfulde til at forhindre, at nogen ressourcer bliver ødelagt
cutscene_case5_line1=De fleste handlinger giver erfaring!
cutscene_case5_line3=Den svævende tekst viser mængden og årsagen til erfaringen
cutscene_case6_line1=Den indfødte befolkning lurer i mørket
cutscene_case6_line3=Vær på vagt, når du graver, medbring altid nogle forsvar
cutscene_case7_line1=Dette afslutter introduktionen
cutscene_case7_line3=Hav det sjovt, og fortsæt med at grave!
replay_cutscene=For at afspille introduktionen igen, brug kommandoen __1__

blueprint_tools_tooltip=Vis blueprint-værktøjer

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Afspil automatisk Crashsite-introduktionen
cutscene1_case_line2=Velkommen til __1__
cutscene1_case_line4=Dette er et brugerdefineret scenarie udviklet af __1__
cutscene1_case_line5=Besøg os på __1__
cutscene1_case_line6=Den følgende introduktion vil hjælpe dig i gang med at spille!
cutscene1_case0_line3=Dette er vores værktøjslinje!
cutscene1_case0_line4=Her finder du en lang række værktøjer og oplysninger om os!
cutscene1_case0_line5=Hold musen over dem for mere information
cutscene1_case0_line6=Du kan slå vores værktøjslinje til og fra med denne knap
cutscene1_case1_line1=Dette er startområdet. Det har et marked og en møntprægemaskine.
cutscene1_case1_line2=Møntprægemaskinen producerer mønter med begrænset hastighed, kan opgraderes på markedet.
cutscene1_case1_line3=Mønter kan også opnås ved at dræbe bitere, spyttere, orme og spawnerer.
cutscene1_case2_line1=Mønter bruges til at købe genstande på markedet.
cutscene1_case3_line1=Dette, sammen med malmforekomsterne og muren, er dit spawn. Nu til forposterne.

cutscene2_case_line1=Dette er en "Forpost". De kommer i mange former og størrelser, med alt fra jernplader til MK2-rustning.
cutscene2_case_line2=Du vil finde mange strukturer, der ligner denne, spredt rundt på kortet.
cutscene2_case0_line1=Forposter forsvares af fjendtlige kanoner og vægge. Kanonstyrken skalerer med belønningerne indeni.
cutscene2_case0_line2=For at "erobre" en forpost skal du ødelægge alle kanonerne.
cutscene2_case1_line1=Forposten indeholder et marked, byttekister og magiske fremstillere (samlefabrikker, kemiske fabrikker osv.).
cutscene2_case2_line1=Magiske fremstillere kræver hverken input eller elektricitet, de producerer genstande gratis. (Denne laver jernplader.)
cutscene2_case3_line1=Du kan opgradere produktionshastigheden på det (lokale) marked med mønter. Nogle markeder indeholder flere genstande.
cutscene2_case4_line1=Bitere udvikler sig hurtigt (og formerer sig nogle gange, når de dræbes!). Tip: hold forureningen på et minimum ved at udnytte de gratis genstande.
cutscene2_case5_line1=Målet med dette scenarie er at udrydde alle bitere og opsende en raket på det begrænsede kort.
cutscene2_case5_line2=Dette afslutter rundvisningen. Held og lykke, og hav det sjovt!
replay_cutscene=For at afspille introduktionen igen, brug kommandoen __1__. Du kan også trykke på informationsikonet for en tekstoversigt.

# locale linked to the quadrants scenario
[quadrants]
on=TIL
off=FRA

compi_spawn_welcome=Velkommen til Redmew - Kvadrater!\n\nBrug vinduet i spilvinduets øverste venstre hjørne for at spille!
compi_spawn_cute=Jeg er meget nuttet

compi_common_transfer_item=Hvordan overfører man ting?\nDu kan bruge underjordiske bånd for at nå den anden side\n\nDu kan også smide ting over ved at bruge ´Z´ tasten
compi_common_chat=Er du blevet stum?\nDu kan skrive beskeder ved at bruge tasten under ESC\n\nDu kan ændre dette i Settings (Indstillinger) -> Styring -> Slå Lua-konsol til/fra
compi_common_market=Har du en mønt i overskud?\nDu kan bruge dine hårdt tjente penge her på markedet
compi_common_switch=Du kan skifte område!\nAlt det kræver er at du har en tom rygsæk\n\nDu skal stå i nærheden af mig og bruge vinduet øverst til venstre for at skifte
compi_common_chests=Problemer med at fjerne nogle kister?\nSpillere som skifter område kan efterlade en kiste med deres ting i\n\nDu skal tømme den for at fjerne den

compi_quadrant1_welcome=Velkommen til forsknings- og forsvarsområdet!\n\nDette er kommando centralen for alt militær og forskning
compi_quadrant1_science=Dette område er det eneste, som kan forske\n\nDu bliver nødt til at importere nogle videnskabspakker fra andre områder
compi_quadrant1_military=Du kan kun fremstille militære ting i dette område\n\nAndre områder er afhængige af, at du sender militære ting til dem

compi_quadrant2_welcome=Velkommen til bearbejdnings- og minedriftsområdet!\n\nVi er de eneste producenter af stål og kredsløb!
compi_quadrant2_steel=Dette område er det eneste som kan fremstille stål\n\nAndre områder er afhængige af at du sender stål til dem
compi_quadrant2_circuits=Dette område er det eneste som kan fremstille kredsløb\n\nAndre områder er afhængige af at du sender kredsløb til dem!
compi_quadrant2_resources=Rygterne siger:\nDette område er ekstra rigt på ressourcer\n\nOmrådet er ideelt til minedrift

compi_quadrant3_welcome=Velkommen til oliebehandling- og teknologiområdet!\n\nHjemsted for al oliebehandling og produktion af teknologi
compi_quadrant3_oil=Dette område er det eneste som kan behandle råolie\n\nDu har måske brug for at få råolie fra andre områder
compi_quadrant3_tech=Dette område er det eneste som kan fremstille et større udvalg af teknologiske ting\n\nDu er måske tvunget til at få en masse bearbejdede materialer fra andre områder!
compi_quadrant3_rocket=Jeg har ladet mig fortælle, at:\nDette område er en perfekt kandidat til at sende en rumraket i vejret\n\nAndre områder kan give dig de dele, du har brug for

compi_quadrant4_welcome=Velkommen til logistik- og transportområdet!\n\nHjemsted for spaghetti og togbaner
compi_quadrant4_logistic=Dette område er det eneste som kan levere logistikløsninger\n\nHele regionen afhænger af dine evner til at fremstille og levere disse til andre!
compi_quadrant4_born=Vidste du?\nMine søskende og jeg er født her

popup_quadrant1_title=Forskning og kommando central
popup_quadrant2_title=Bearbejdede materialer og miner
popup_quadrant3_title=Oliebearbejdning og teknologi
popup_quadrant4_title=Logistiske løsninger
popup_quadrant1=Vores primære opgave er at forske til fordele for hele regionen\n\nSekundært er vi regionens kommando central\nVi leverer militært udstyr
popup_quadrant2=Vores primære opgave er at levere bearbejdet materiale til regionen\nVi specialiserer os i kredsløb af forskellig kompleksitet\nVi er også det område med certificeret stål!\nUndersøgelser viser at området har en forhøjet mængde ressourcer
popup_quadrant3=Vores primære opgave er at levere olie produkter til regionen\nSekundært specialiserer vi os i høj teknologisk udstyr\nNoget af vores udstyr er klassificeret som radioaktivt
popup_quadrant4=Vores primære opgave er at levere logistiske løsninger til regionen\nVi specialiserer os i bånd- og robotbaserede løsninger\nVi har også en stor afdeling inden for højhastighedstog!

