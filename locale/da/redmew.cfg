description=[font=default-bold]RedMew er et Factorio-community, der hoster brugerdefinerede servere, kort i alle mulige former og størrelser, scriptede scenarier og moddede servere.[/font]\nVores scenario tilbyder over 100 forskellige kort, og du kan vælge det, du ønsker, med følgende trin:\n\n[color=green]Simpel tilstand: besøg[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Ekspert-tilstand: rediger map_selection.lua i scenariemappen[/color]\nFor flere detaljer om, hvad hvert enkelt kort er, kan du se listen på [color=blue]redmew.com/maps[/color]\n\nNyttige links: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Tak fordi du valgte Redmew, et scenario fra Refactorio![/color]
