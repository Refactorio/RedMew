# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]Информация RedMew[/color][/font]\n Сообщество, правила, функции, информация о карте
welcome_header=Добро пожаловать в Redmew!
welcome_text=Redmew - это общество игроков разного уровня мастерства, стремящихся разрушить границы мультиплеерной игры в Factorio с помощью различных скриптов и безумных карт.\n\nМы дружелюбны, нашей целью является получение максимального удовольствия от игры. Надеемся, что и вам понравится!
chatting_header=Как общаться
chatting_text=Для общения с другими игроками нажмите клавишу __CONTROL__toggle-console__ на клавиатуре.\nПо умолчанию, на русской клавиатуре это клавиша Ё, прямо под клавишей ESC.\nЕе можно поменять в __1__ -> __2__ -> __3__.
free_coin_header=Бесплатные монеты
free_coin_text=Вы получите __1__ __2__ за просмотр вкладки приветствия.\nЗа просмотр других вкладок вы получите ещё __1__ __2__.\n
free_coin_print=__1__ __2__ получено за просмотр вкладки на информационном экране.
links_header=Полезные ссылки
links_discord=Посетите наш discord для получения информации о новых картах или предложите свои карты/идеи.
links_patreon=Присоединяйтесь к нам на Patreon, чтобы получить особые привилегии и помочь нам поддерживать наши сервера.
links_saves=Скачивайте наши карты и сохранения игр на нашем сайте.
links_factoriomaps=Просматривайте наши прошлые карты как Google Map.
rules_header=Правила
rules_text=Получайте удовольствие от игры и ведите себя прилично. Помните, что все мы здесь только для того, чтобы спокойно поиграть и расслабиться.\n\nВоздержитесь от ненависти и нападок на кого-либо.\n\nЕсли вы считаете кого-то вандалом (грифером), сообщите об этом администраторам через команду /report или используйте специальную кнопку рядом с именем игрока в списке игроков.
rules_text_danger_ore=Если постройку другого игрока нужно изменить или удалить, перед этим необходимо провести командное обсуждение или голосование.\n\nКомандное обсуждение или голосование не требуется, если построивший её игрок в сети и согласен на изменение или удаление.\n\nМассовая замена модулей и модернизация лент по всей карте должны быть утверждены командным голосованием до начала этих работ.\n\nПри командном голосовании побеждает большинство.\n\nОдного или двух игроков в сети недостаточно для командного обсуждения или голосования. Тем не менее, изменение или удаление постройки может понадобиться, чтобы база работала без перебоев. В этом случае следует оставить сообщение в игровом чате о том, что вы изменяете или удаляете постройку, и почему это необходимо. Недостаточно просто заявить, что ваш дизайн или постройка лучше или выглядит приятнее.
map_info_button=О карте
map_info_header=Информация о карте
map_name_label=Название карты:
map_desc_label=Описание карты:
map_extra_info_label=Доп. информация:
softmods_button=Моды в сценарии
softmods_header=Софт-моды и серверные плагины
softmods_rank_text=У нас существует система рангов для предотвращения вандализма (грифинга). Вы не сможете использовать атомную бомбу или план сноса, пока вы гость. После нескольких часов игры администратор может повысить вас до обычного ранга. Также вы можете попросить администратора о повышении, если вы работаете над проектом, который требует этого.\n
softmods_rank_is=Ваш ранг:
softmods_market_label=Рынок
softmods_market_text=На большинстве наших карт вы можете найти рынок, где можно потратить свои монеты на покупки. Монеты зарабатываются рубкой деревьев, ручным созданием предметов и уничтожением гнёзд кусак. Большинство товаров в магазине есть всегда, но некоторые особые товары (например, отсыпка) будут появляться и исчезать время от времени.
softmods_saviour_label=Анти-поезд
softmods_saviour_text=Поезда являются худшим врагом игроков в Факторио. Если у вас есть хотя бы один порт игрока в вашем инвентаре и вы были убиты поездом, ваша жизнь будет сохранена, но вы потеряете порт игрока. Вы можете получить порты игроков на рынке.
softmods_plist_label=Список игроков
softmods_plist_text=Показывает список всех игроков на сервере и некоторую статистику. Вы можете сортировать список, кликая заголовок столбца. А еще можно тыкать (Poke) игрока, и это будет отображено случайной фразой в чате.
softmods_polls_label=Голосования
softmods_polls_text=Голосования помогают игрокам принять общее решение по важным вопросам. Хотите построить или улучшить что-то важное? Создайте голосование и убедитесь, что все одобряют это. Необходимо иметь обычный ранг для создания голосования.
softmods_tags_label=Теги
softmods_tags_text=Вы можете обозначить себя тегом, чтобы другие игроки знали чем вы занимаетесь. Или используйте тег для украшения. С обычным рангом можно создавать свои теги, не стесняйтесь проявить свою креативность.
softmods_tasks_label=Задачи
softmods_tasks_text=Не знаете, над чем работать? Поищите задачи, требующие решения. С обычным рангом можно создавать свои задачи.
softmods_bp_label=Помощник\nпо чертежам
softmods_bp_text=Помощник по чертежам™ позволяет переворачивать ваши чертежи по вертикали или горизонтали\nи производить замены, например, можно поменять желтые конвейеры на красные и т.п.
softmods_score_label=Очки
softmods_score_text=Показывает количество запущенных ракет, освобождённых кусак, построенных объектов и многое другое!
softmods_shortcuts_label=Быстрые кнопки
softmods_shortcuts_text=Быстрые кнопки игрока — это легкодоступные кнопки с полезными инструментами. Очищайте землю от трупов кусачек, раскладывайте инвентарь по ближайшим сундукам/печам, подзаряжайте экипированные аккумуляторы от ближайших накопителей и не только.
softmods_production_hud_label=Произв. HUD
softmods_production_hud_text=HUD производства — это окно со статистикой производства, которое может постоянно отображаться на экране. Добавляйте и убирайте предметы из списка отслеживания и следите, чтобы фабрика всегда была снабжена!
softmods_train_station_teleport_label=Телепорт
softmods_train_station_teleport_text=Телепортация между станциями позволяет мгновенно перемещаться между [entity=train-stop] по всей карте. Всё, что нужно — встать рядом с [entity=train-stop], затем в режиме карты открыть другой [entity=train-stop] и телепортироваться к нему кнопкой телепортации.
softmods_autofill_label=Автозаполнение
softmods_autofill_text=Автоматически кладёт боеприпасы в турели при их постройке. Можно настроить фильтр типов и количества боеприпасов.
softmods_paint_brush_label=Кисть
softmods_paint_brush_text=Фабрика должна расти! ...и выглядеть стильно
whats_new_button=Что нового

