auto_stash_tooltip=[font=default-bold]Автосклад[/font] - Раскладывает ваш инвентарь по ближайшим сундукам.\n[color=yellow][font=default-bold]ЛКМ[/font][/color]: Всё, кроме предметов с панели быстрого доступа.\n[color=yellow][font=default-bold]ПКМ[/font][/color]: Только руду в ближайшие сундуки, кроме предметов с панели быстрого доступа.\n[color=yellow][font=default-bold]CTRL + ПКМ[/font][/color]: Заполняет ближайшие печи.\n[color=yellow][font=default-bold]SHIFT + ЛКМ[/font][/color]: Всё в отфильтрованные слоты вагона/сундуков.\n[color=yellow][font=default-bold]SHIFT + ПКМ[/font][/color]: Только руду в вагон.

