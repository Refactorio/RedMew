# This file holds all the locale strings for command help and descriptions
# Ideally, string keys match command names (with - turned to _)

[command_description]
reward=Выдаёт награду выбранному игроку (удаляет, если количество отрицательное)
diggy_clear_void=Убирает пустоту в данной области, но всё равно вызывает все события Diggy, которые должны при этом произойти.
config_restart=Открывает окно перезапуска сервера из конфигураций сервера
restart=Перезапускает карту.
abort=Отменяет перезапуск.
danger_ore_restart_condition_not_met=Недостаточно запущенных [item=satellite] для перезапуска карты.
diggy_restart_condition_not_met=Копай усерднее, гном! Нужно достичь производительности добычи __1__, чтобы начать новую шахтёрскую авантюру!
crash_site_restart=Перезапускает сценарий Crashsite.
crash_site_restart_abort=Отменяет перезапуск сценария Crashsite.
crash_site_spy=Тратьте монеты, чтобы отправить рыбу для шпионажа за противниками на небольшой промежуток времени.
crash_site_spy_invalid=Вам нужно добавить правильные координаты для отправки рыбы-шпиона, например /spy [gps=-110,-17,redmew]
crash_site_spy_funds=Тренировка этих рыб-шпионов не дешёвая! Вам нужно больше монет!
crash_site_spy_success=__1__ использовал команду /spy и потратил __2__ монет на тренировку рыбы, чтобы шпионить за врагом [gps=__3__,__4__,redmew]
crash_site_airstrike_invalid=Неверные координаты.
crash_site_airstrike=Запустить по противнику воздушный удар ядовитыми капсулами.
crash_site_airstrike_count=Улучшить урон воздушного удара до уровня [font=var]__1__[/font]\n\nЧтобы запустить воздушный удар, положите ядовитые капсулы в сундук появления и наберите /strike с координатами удара\n\nУлучшение урона увеличивает количество ядовитых капсул, запускаемых воздушным ударом.\n\n[color=255,230,192][font=default-bold]Текущий уровень:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Текущее количество зарядов:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Текущая стоимость:[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=Улучшить радиус воздушного удара до уровня [font=var]__1__[/font]\n\nЧтобы запустить воздушный удар, положите ядовитые капсулы в сундук появления и наберите /strike с координатами удара\n\n[color=255,230,192][font=default-bold]Текущий уровень:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Текущий радиус:[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]Радиус воздушного удара __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]Урон воздушного удара __1__\n[/font][/color]
crash_site_airstrike_not_researched=Вы ещё не исследовали воздушный удар. Посетите рынок на точке возрождения [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=Чтобы отправить авиаудар, загрузите ещё __1__ ядовитых капсул в платёжный сундук [gps=2.5,-7.5,redmew]
crash_site_airstrike_friendly_fire_error=Вам не надо это делать, не найдено врагов в целевой области.
crash_site_airstrike_damage_upgrade_success=__1__ улучшил урон воздушного удара до уровня __2__
crash_site_airstrike_radius_upgrade_success=__1__ улучшил радиус воздушного удара до уровня __2__
crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]Пульт наведения ядовитого удара\n[/font][/color]
crash_site_airstrike_planner_description=Используйте этот планировщик деконструкции, чтобы одним щелчком легко запустить ядовитый удар. Поместите его на панель быстрого доступа.
crash_site_airstrike_no_enemies=Враги не найдены в [gps=__1__,__2__,__3__]. Какая трата ядовитых капсул!
crash_site_barrage_planner_label=[color=255,230,192][font=default-large-bold]Пульт наведения залпового огня\n[/font][/color]
crash_site_barrage_planner_description=Используйте этот планировщик деконструкции, чтобы одним щелчком легко запустить артиллерийский залп. Поместите его на панель быстрого доступа.
crash_site_barrage_invalid=Неверные координаты.
crash_site_barrage=Запустить залп самонаводящихся ракет по врагу.
crash_site_barrage_count=Улучшить урон залпа до уровня [font=var]__1__[/font]\n\nЧтобы использовать залп, поместите взрывные ракеты в сундук возрождения, затем введите /barrage и укажите позицию gps\n\nУлучшения урона увеличивают количество запускаемых ракет.\n\n[color=255,230,192][font=default-bold]Текущий уровень:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Текущее количество ракет:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Текущая стоимость:[/font][/color] [font=var]__4__[/font]
crash_site_barrage_radius=Улучшить радиус залпа до уровня [font=var]__1__[/font]\n\nЧтобы использовать залп, поместите взрывные ракеты в сундук возрождения, затем введите /barrage и укажите позицию gps\n\n[color=255,230,192][font=default-bold]Текущий уровень:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Текущий радиус:[/font][/color] [font=var]__3__[/font]
crash_site_barrage_radius_name_label=[color=255,230,192][font=default-large-bold]Радиус ракетного залпа __1__\n[/font][/color]
crash_site_barrage_count_name_label=[color=255,230,192][font=default-large-bold]Урон ракетного залпа __1__\n[/font][/color]
crash_site_barrage_not_researched=Вы ещё не исследовали «Залп». Посетите рынок у точки возрождения [gps=-3,-3,redmew]
crash_site_barrage_insufficient_currency_error=Чтобы отправить ракетный залп, загрузите ещё __1__ взрывных ракет в платёжный сундук [gps=-4.5,-7.5,redmew]
crash_site_barrage_no_nests=По этим координатам ([gps=__1__,__2__,__3__]) не найдено гнёзд — какая трата ракет!
crash_site_barrage_damage_upgrade_success=__1__ улучшил урон ракетного залпа до уровня __2__
crash_site_barrage_radius_upgrade_success=__1__ улучшил радиус ракетного залпа до уровня __2__
crash_site_rocket_tanks_name_label=[color=255,230,192][font=default-large-bold]Интервал стрельбы ракетных танков __1__\n[/font][/color]
crash_site_rocket_tank_upgrade_success=__1__ улучшил интервал стрельбы Ракетных танков до уровня __2__
crash_site_rocket_tanks_description=Улучшите интервал стрельбы Ракетных танков, чтобы сократить время между выстрелами.\n\nПоложите ракеты в инвентарь танка, чтобы они были автоматически выпущены во вражеских червей и гнёзда.
crash_site_spider_army_decon_label=[color=255,230,192][font=default-large-bold]Планировщик группировки армии паукотронов\n[/font][/color]
crash_site_spider_army_decon_description=Используйте этот планировщик деконструкции, чтобы быстро объединить паукотронов в армию. Сначала выделите область, содержащую ваших паукотронов, рамкой выбора. Затем одним щелчком левой кнопки мыши укажите целевого паукотрона, за которым должна следовать группа.
max_level=(МАКС. УРОВЕНЬ)
dataset_copy=Скопировать данные
dataset_move=Переместить данные
dataset_delete=Удалить данные
dataset_transform=Преобразует набор данных и записывает его в целевой набор данных. Вызывает storage.transform_function и посылает таблицу записей, ожидая возврата.
dataset_transform_test=Показывает результирующий набор данных из операции трансформации. Смотрите /help dataset-transform для получения дополнительной информации.
report=Отправляет жалобу на пользователя админам
kill=Убивает вас.
afk=Отобразить, как долго игроки были AFK.
zoom=Задать масштаб.
find=Отобразить на карте, где находится игрок
show_rail_block=Переключает визуализацию ж/д блоков.
server_time=Выводит время сервера.
seeds=Выводит список сидов всех поверхностей
redmew_version=Выводит версию сценария Redmew
whois=Предоставляет информацию о данном игроке, админы могут видеть инвентарь игрока, добавив "yes" вторым аргументом
clear_corpses=Удаляет трупы рядом с игроком (Regular или выше). Используйте /clear_corpses surface или /clear_corpses s, чтобы удалить все трупы на поверхности (только для Admin).
meltdown_get=Получает статус расплавления.
meltdown_set=Устанавливает статус расплавления.
redmew_color="Установить" сохранит ваш текущий цвет для будущих карт. "Сброс" удалит сохранённый цвет. "Случайно" даст вам случайный цвет.
performance_scale_set=Устанавливает шкалу производительности от 0.05 до 1. Это изменит скорость игры, скорость ручной добычи, скорость ручного создания и скорость бега персонажа в зависимости от значения производительности.
performance_scale_get=Показывает текущее значение производительности.
permissions_reset=Используйте "/permissions-reset", чтобы сбросить права всех игроков к значениям по умолчанию
permissions_set_scenario=Используйте "/permissions-set-scenario", чтобы повторно применить права сценария, если они есть
market=Устанавливает рынок рядом с вами. Используйте /market removeall, чтобы удалить все рынки на карте.
lazy_bastard_bootstrap=Выкладывает минимальный набор предметов для начала игры
toast=Отправляет сообщение всем игрокам
toast_player=Отправляет сообщение определенному игроку
sent_all_toast=__1__ отправил тост всем игрокам
sent_player_toast=__1__ отправил тост игроку __2__
task=Новая задача.
tag=Задаёт тег игрока
popup=Показывает всплывающее окно всем подключённым игрокам
popup_update=Показывает всплывающее окно обновления всем подключённым игрокам
popup_player=Показывает всплывающее окно игроку.
poll=Создать опрос
poll_result=Выводит результат для выбранного номера опроса.
debug=Открывает отладчик
watch=Позволяет вам смотреть за другими игроками.
donator_welcome_message=Добавить, удалить или отобразить приветственные сообщения спонсорам.
donator_death_message=Добавить, удалить или отобразить сообщения при смерти спонсора.
reveal=Раскрывает радиус вокруг пользователя
particle_scale=Укажите число между 0 и 1 для уменьшения или увеличения (макс.) количества частиц. Оставьте пустым, чтобы просмотреть текущие значения.
apocalypse=Это реально уничтожает карту. Когда вы запустите её первый раз, игра будет сохранена. Когда запустите второй раз, начнется апокалипсис.
a=Администраторский чат. Сообщение всем другим администраторам.
dc=тихая команда
hax=Переключает ваш читерский режим (рецепты будут стоить ничего)
regular=Даёт игроку обычный ранг.
regular_remove=Понижает игрока с обычного ранга на ранг ниже
probation=Ставит игрока на испытательный срок. (Они не смогут использовать команды RedMew и никогда не заработают авто-доверенный ранг.)
probation_remove=Снимает игрока с испытательного срока.
showreports=Показать отчеты пользователей
jail=Поместить игрока в тюрьму
unjail=Освободить игрока из тюрьмы
pool=Создать бассейн воды
invoke=Телепортирует игрока к вам.
tp=Если не указано, телепорт к выбранному объекту. mode = переключение режима телепорта, так что вы можете выполнить телепорт к призраку. player = телепорт к игроку.
revive_ghosts=Оживляет призрачные строения в выбранном радиусе вокруг вас
destroy=Уничтожает объект под курсором, когда вы запускаете эту команду
quick_bar_save=Сохраняет ваши [color=yellow]панели быстрого доступа[/color] на сервере для будущих карт
quick_bar_load=Загружает ваши [color=yellow]панели быстрого доступа[/color] с сервера (перезаписывая существующие панели)
quick_bar_delete=Стирает ваши сохранённые [color=yellow]панели быстрого доступа[/color] с сервера
logistic_requests_save=Сохраняет ваши [color=blue]логистические запросы[/color] на сервере для будущих карт
logistic_requests_load=Загружает ваши [color=blue]логистические запросы[/color] с сервера (перезаписывая существующие панели)
logistic_requests_delete=Удаляет ваши сохранённые [color=blue]логистические запросы[/color] с сервера
set_pollution_multiplier=ЭКСПЕРИМЕНТАЛЬНО. Целое число, которое умножается на 0,01, чтобы дать количество выбросов магических крафтеров в точке крушения. По умолчанию 0.
get_pollution_multiplier=Текущий мультипликатор загрязнения для места крушения. По умолчанию 0.
perks=Перечисляет жертвователей Patreon, которые поддерживают текущие активные привилегии.
generate_desc=Генерирует имя сервера, описание и теги для вставки в интерфейс /config
radio=Открывает окно радио
rich_text=Открывает графический интерфейс форматированного текста
rpg_stats=Выводит статистику игрока
rpg_update=Обновляет RPG-статистику и графический интерфейс для указанного игрока
rpg_leaderboard=Выводит таблицу лидеров RPG
calculator_tech=Вычисляет стоимость исследования указанной технологии в научных пакетах
calculator_tech_player=Вычисляет стоимость исследования указанной технологии в научных пакетах для указанного игрока
af_reset=Сбрасывает все функции
af_debug=Выводит текущий уровень всех функций
af_max=Устанавливает все функции на соответствующий максимальный уровень
frontier_ping_silo=Отмечает позицию силоса на карте
frontier_toggle_debug_ai=Включает/выключает режим отладки ИИ
frontier_toggle_debug_shop=Включает/выключает режим отладки магазина
frontier_print_global=Выводит глобальную таблицу
frontier_log_global=Записывает глобальную таблицу в журнал
moderator=Выдаёт игроку ранг модератора
moderator_remove=Понижает игрока с ранга модератора до следующего низшего ранга
regular_all=Выдаёт всем игрокам в сети ранг regular, если они не на испытательном сроке
blueprint_tools=Открывает графический интерфейс менеджера инструментов чертежей
inventory=Показывает инвентарь указанного игрока. Если игрок не указан, показываются все инвентари.

[command_custom_help]
tp=<blank|mode|player> 3 разных варианта использования: "/tp" для телепортирования к выбранному объекту. "/tp mode" для переключения режима телепортации. "/tp Newcott" для телепортирования к игроку Newcott.
poll=<{question = "вопрос", answers = {"ответ 1", "ответ 2"}, duration = 300}>
module_only=Доступно только при включённом соответствующем модуле
