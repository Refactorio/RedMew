description=[font=default-bold]RedMew — сообщество Factorio, которое поддерживает кастомные серверы, карты разных форм и размеров, сценарные и модифицированные серверы.[/font]\nНаш сценарий предлагает более 100 разных карт, и вы можете выбрать любую из них, выполнив следующие шаги:\n\n[color=green]Простой режим: посетите[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Экспертный режим: отредактируйте map_selection.lua в папке сценария[/color]\nПодробнее о каждой карте можно узнать в списке на [color=blue]redmew.com/maps[/color]\n\nПолезные ссылки: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Спасибо, что выбрали Redmew — сценарий от Refactorio![/color]
