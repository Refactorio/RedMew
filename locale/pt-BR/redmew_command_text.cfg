# This file holds all the locale strings for command help and descriptions
# Ideally, string keys match command names (with - turned to _)

[command_description]
reward=Dá uma recompensa a um jogador alvo (remove se a quantidade for negativa)
diggy_clear_void=Limpa o vazio em uma determinada área, mas ainda dispara todos os eventos que o Diggy dispararia ao limpar o vazio.
config_restart=Abre a janela de reinício do servidor a partir das configurações do servidor
restart=Reinicia o mapa.
abort=Cancela um reinício.
danger_ore_restart_condition_not_met=Não foram lançados [item=satellite] suficientes para reiniciar o mapa.
diggy_restart_condition_not_met=Minere mais, anão! Você precisa alcançar Produtividade de Mineração __1__ para começar uma nova empreitada de mineração!
crash_site_restart=Reinicia o cenário crashsite.
crash_site_restart_abort=Aborta o reinício do cenário crashsite.
crash_site_spy=Gaste moedas para enviar um peixe para espionar o inimigo por um curto período.
crash_site_spy_invalid=Você precisa adicionar um local válido para enviar um peixe espião. ex.: /spy [gps=-110,-17,redmew]
crash_site_spy_funds=Treinar esses peixes espiões não é barato! Você precisa de mais moedas!
crash_site_spy_success=__1__ usou o comando /spy e gastou __2__ moedas para treinar um peixe para espionar o inimigo [gps=__3__,__4__,redmew]
crash_site_airstrike_invalid=Coordenadas inválidas.
crash_site_airstrike=Lança um ataque aéreo contra o inimigo com cápsulas de veneno.
crash_site_airstrike_count=Melhore o dano do ataque aéreo para o nível [font=var]__1__[/font]\n\nPara usar o ataque aéreo, coloque cápsulas de veneno no baú de spawn e digite /strike seguido de uma posição gps\n\nMelhorias de dano aumentam o número de cápsulas de veneno lançadas pelo ataque aéreo.\n\n[color=255,230,192][font=default-bold]Nível atual:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Contagem atual de cápsulas:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Custo atual:[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=Melhore o raio do ataque aéreo para o nível [font=var]__1__[/font]\n\nPara usar o ataque aéreo, coloque cápsulas de veneno no baú de spawn e digite /strike seguido de uma posição gps\n\n[color=255,230,192][font=default-bold]Nível atual:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Raio atual:[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]Raio do Ataque Aéreo __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]Dano do Ataque Aéreo __1__\n[/font][/color]
crash_site_airstrike_not_researched=Você ainda não pesquisou o ataque aéreo. Visite o mercado no spawn [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=Para enviar um ataque aéreo, carregue mais __1__ cápsulas de veneno no baú de pagamento [gps=2.5,-7.5,redmew]
crash_site_airstrike_friendly_fire_error=Você não vai querer fazer isso, nenhum inimigo foi encontrado na área de destino.
crash_site_airstrike_damage_upgrade_success=__1__ melhorou o Dano do Ataque Aéreo para o nível __2__
crash_site_airstrike_radius_upgrade_success=__1__ melhorou o Raio do Ataque Aéreo para o nível __2__
crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]Controle remoto de ataque de veneno\n[/font][/color]
crash_site_airstrike_planner_description=Use este planejador de desconstrução para lançar facilmente um ataque de veneno com um clique. Coloque-o na sua barra rápida para facilitar o acesso.
crash_site_airstrike_no_enemies=Nenhum inimigo encontrado em [gps=__1__,__2__,__3__]. Que desperdício de cápsulas de veneno!
crash_site_barrage_planner_label=[color=255,230,192][font=default-large-bold]Controle remoto de barragem\n[/font][/color]
crash_site_barrage_planner_description=Use este planejador de desconstrução para lançar facilmente uma barragem de artilharia com um clique. Coloque-o na sua barra rápida para facilitar o acesso.
crash_site_barrage_invalid=Coordenadas inválidas.
crash_site_barrage=Lança uma barragem de foguetes teleguiados contra o inimigo.
crash_site_barrage_count=Melhore o dano da barragem para o nível [font=var]__1__[/font]\n\nPara usar a barragem, coloque foguetes explosivos no baú de spawn e digite /barrage seguido de uma posição gps\n\nMelhorias de dano aumentam o número de foguetes lançados.\n\n[color=255,230,192][font=default-bold]Nível atual:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Contagem atual de foguetes:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Custo atual:[/font][/color] [font=var]__4__[/font]
crash_site_barrage_radius=Melhore o raio da barragem para o nível [font=var]__1__[/font]\n\nPara usar a barragem, coloque foguetes explosivos no baú de spawn e digite /barrage seguido de uma posição gps\n\n[color=255,230,192][font=default-bold]Nível atual:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Raio atual:[/font][/color] [font=var]__3__[/font]
crash_site_barrage_radius_name_label=[color=255,230,192][font=default-large-bold]Raio da Barragem de Foguetes __1__\n[/font][/color]
crash_site_barrage_count_name_label=[color=255,230,192][font=default-large-bold]Dano da Salva de Foguetes __1__\n[/font][/color]
crash_site_barrage_not_researched=Você ainda não pesquisou a Salva de Foguetes. Visite o mercado no ponto de surgimento [gps=-3,-3,redmew]
crash_site_barrage_insufficient_currency_error=Para enviar uma salva de foguetes, carregue mais __1__ foguetes explosivos no baú de pagamento [gps=-4.5,-7.5,redmew]
crash_site_barrage_no_nests=Nenhum ninho encontrado nessas coordenadas ([gps=__1__,__2__,__3__]), que desperdício de foguetes!
crash_site_barrage_damage_upgrade_success=__1__ melhorou o Dano da Salva de Foguetes para o nível __2__
crash_site_barrage_radius_upgrade_success=__1__ melhorou o Raio da Salva de Foguetes para o nível __2__
crash_site_rocket_tanks_name_label=[color=255,230,192][font=default-large-bold]Intervalo de Disparo dos Tanques de Foguetes __1__\n[/font][/color]
crash_site_rocket_tank_upgrade_success=__1__ melhorou o intervalo do tanque de foguetes para o nível __2__
crash_site_rocket_tanks_description=Melhore o intervalo de disparo do tanque de foguetes para reduzir o tempo entre os foguetes.\n\nColoque foguetes no inventário do tanque para que eles miram automaticamente nas minhocas e ninhos inimigos.
crash_site_spider_army_decon_label=[color=255,230,192][font=default-large-bold]Planejador de Agrupamento do Exército de Spidertrons\n[/font][/color]
crash_site_spider_army_decon_description=Use este planejador de desconstrução para agrupar rapidamente spidertrons em um exército. Primeiro, selecione em grupo uma área contendo seus spidertrons. Depois, clique uma vez com o botão esquerdo em um spidertron alvo para o seu grupo seguir.
max_level=(NÍVEL MÁXIMO)
dataset_copy=Copia um conjunto de dados
dataset_move=Move um conjunto de dados
dataset_delete=Excluir um conjunto de dados
dataset_transform=Transforma um conjunto de dados e o escreve no conjunto de dados de destino. Chama storage.transform_function e envia a tabela de entradas enquanto espera uma tabela como retorno.
dataset_transform_test=Mostra os dados resultantes de uma operação de transformação. Veja /help dataset-transform para mais informações.
report=Relatar um usuário para administradores
kill=Vai te matar.
afk=Mostra o tempo que os jogadores estão afk.
zoom=Define seu zoom.
find=Mostra um alerta no mapa onde o jogador está localizado
show_rail_block=Alterna a visualização de blocos ferroviários.
server_time=Imprime a hora do servidor.
seeds=Lista as seeds de todas as superfícies
redmew_version=Imprime a versão do cenário Redmew
whois=Fornece informações sobre um determinado jogador; administradores podem ver o inventário de um jogador adicionando "yes" como um segundo argumento
clear_corpses=Remove cadáveres próximos ao jogador (Regular ou superior). Use /clear_corpses surface ou /clear_corpses s para remover todos os cadáveres da superfície (somente Admin).
meltdown_get=Obtém o status do Derretimento Nuclear.
meltdown_set=Define o status do Derretimento Nuclear.
redmew_color=Set salvará sua cor atual para futuros mapas. Reset irá apagar sua cor salva. Random lhe dará uma cor aleatória.
performance_scale_set=Define a escala de desempenho entre 0,05 e 1. Irá alterar a velocidade do jogo, a velocidade de mineração manual, a velocidade de fabricação manual e a velocidade de corrida do personagem por força.
performance_scale_get=Mostra a escala de desempenho atual.
permissions_reset=Use "/permissions-reset" para redefinir as permissões de todos os jogadores para o padrão
permissions_set_scenario=Use "/permissions-set-scenario" para reaplicar as permissões do cenário, se houver
market=Coloca um mercado perto de você. Use /market removeall para remover todos os mercados em um mapa
lazy_bastard_bootstrap=Coloca o mínimo necessário para começar
toast=Envia um aviso a todos os jogadores
toast_player=Envia um aviso a um jogador específico
sent_all_toast=__1__ enviou um aviso a todos os jogadores
sent_player_toast=__1__ enviou um aviso a __2__
task=Crie uma nova tarefa.
tag=Define a tag de um jogador
popup=Mostra um popup para todos os jogadores conectados
popup_update=Mostra um popup de atualização para todos os jogadores conectados
popup_player=Mostra um popup para o jogador.
poll=Cria uma nova enquete
poll_result=Imprime o resultado para o número de enquete informado.
debug=Abre o depurador
watch=Permite que você assista outros jogadores.
donator_welcome_message=Adiciona, exclui ou lista mensagens de boas-vindas de doadores.
donator_death_message=Adiciona, exclui ou lista mensagens de morte de doadores.
reveal=Revela um raio ao redor do usuário
particle_scale=Forneça uma fração entre 0 e 1 para diminuir ou aumentar a quantidade de partículas (máxima). Deixe em branco para ver os valores atuais.
apocalypse=Isto realmente termina o mapa. Quando você o executar primeiro, o jogo irá salvar. Quando executar uma segunda vez, o apocalipse começará.
a=Chat de administrador. Envia mensagens a todos os outros administradores.
dc=comando silencioso
hax=Ativa a sua trapaça (faz as receitas não custarem nada)
regular=Concede a um jogador o rank de Regular.
regular_remove=Rebaixa um jogador do Rank Regular para o próximo Rank mais baixo
probation=Coloca o jogador em Provação. (Eles não serão capazes de usar comandos redmew e nunca ganharão o rank auto-confiável.)
probation_remove=Remover jogador da Provação.
showreports=Mostra relatórios de usuários
jail=Coloca um jogador na prisão
unjail=Remove um jogador da prisão
pool=Gera uma poça de água
invoke=Teleporta o jogador para você.
tp=Se estiver em branco, teletransportar para a entidade selecionada. mode = alternar o modo tp onde você pode teleportar para um fantasma colocado. player = teletransportar para o jogador.
revive_ghosts=Ressuscita os fantasmas dentro do raio fornecido ao seu redor
destroy=Destrói a entidade sob seu cursor quando você executar este comando
quick_bar_save=Salva suas [color=yellow]barras rápidas[/color] no servidor para futuros mapas
quick_bar_load=Carrega suas [color=yellow]barras rápidas[/color] do servidor (sobrescrevendo as barras existentes)
quick_bar_delete=Apaga suas [color=yellow]barras rápidas[/color] salvas do servidor
logistic_requests_save=Salva seus [color=blue]pedidos logísticos[/color] no servidor para mapas futuros
logistic_requests_load=Carrega seus [color=blue]pedidos logísticos[/color] do servidor (sobrescrevendo os pedidos existentes)
logistic_requests_delete=Apaga seus [color=blue]pedidos logísticos[/color] salvos do servidor
set_pollution_multiplier=EXPERIMENTAL. Um número inteiro que é multiplicado por 0,01 para dar a quantidade de poluição que os Fabricadores Mágicos do crash site emitem. O padrão é 0
get_pollution_multiplier=O multiplicador de poluição atual do crash site. O padrão é 0.
perks=Lista os doadores do Patreon que estão contribuindo para as vantagens atualmente ativas.
generate_desc=Gera nome do servidor, descrição e tags para colar na GUI do /config
radio=Abre a janela do rádio
rich_text=Abre a GUI de rich text
rpg_stats=Exibe as estatísticas do jogador
rpg_update=Atualiza as estatísticas de RPG e a GUI do jogador alvo
rpg_leaderboard=Exibe a classificação do RPG
calculator_tech=Calcula o custo em pacotes científicos para pesquisar a tecnologia alvo
calculator_tech_player=Calcula o custo em pacotes científicos para pesquisar a tecnologia alvo para o jogador alvo
af_reset=Redefinir todos os recursos
af_debug=Exibe o nível atual de todos os recursos
af_max=Define todos os recursos para seus respectivos níveis máximos
frontier_ping_silo=Marca a posição do silo no mapa
frontier_toggle_debug_ai=Ativa/desativa o modo de depuração da IA
frontier_toggle_debug_shop=Ativa/desativa o modo de depuração da loja
frontier_print_global=Exibe a tabela global
frontier_log_global=Registra a tabela global no log
moderator=Concede a um jogador o posto de moderador
moderator_remove=Rebaixa um jogador de moderador para o próximo posto mais baixo
regular_all=Concede a todos os jogadores online o posto de regular, se não estiverem em período de experiência
blueprint_tools=Abre a GUI de ferramentas de planta
inventory=Mostra o inventário do jogador alvo. Se nenhum jogador for fornecido, todos os inventários são exibidos.

[command_custom_help]
tp=<blank|mode|player> 3 usos diferentes: "/tp" teleporta para a entidade selecionada. "/tp mode" para alternar o modo de teleporte. "/tp Newcott" teleporta para Newcott.
poll=<{question = "pergunta", answers = {"resposta 1", "resposta 2"}, duration = 300}>
module_only=Disponível apenas com o módulo correspondente ativado
