description=[font=default-bold]RedMew é uma comunidade de Factorio que hospeda servidores personalizados, mapas dos mais variados formatos e tamanhos, cenários roteirizados e servidores moddados.[/font]\nNosso cenário oferece mais de 100 mapas diferentes, e você pode selecionar o de sua escolha seguindo os passos abaixo:\n\n[color=green]Modo simples: acesse[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Modo expert: edite o map_selection.lua na pasta do cenário[/color]\nPara mais detalhes sobre cada mapa, confira a lista em [color=blue]redmew.com/maps[/color]\n\nLinks úteis: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Obrigado por escolher o Redmew, um cenário da Refactorio![/color]
