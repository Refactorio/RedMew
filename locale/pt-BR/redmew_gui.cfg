# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]Informações do RedMew[/color][/font]\n Comunidade, regras, recursos, informações do mapa
welcome_header=Bem-vindo ao Redmew!
welcome_text=Redmew é uma comunidade para jogadores de todos os níveis de habilidades comprometidos a expandir os limites do Factorio Multiplayer através de scripts personalizados e designs de mapas loucos.\n\nNós somos um grupo amigável, nosso objetivo é ter o máximo de diversão possível e nós esperamos que você também tenha.
chatting_header=Como conversar
chatting_text=Para conversar com outros jogadores, pressione a tecla __CONTROL__toggle-console__ no seu teclado.\nA tecla padrão nos teclados em Português Brasileiro (PTB2 ou ABNT2) é a aspas (') e está abaixo da tecla ESC.\nIsto pode ser alterado em __1__ -> __2__ -> __3__.
free_coin_header=Moedas grátis
free_coin_text=Você recebeu __1__ __2__ por olhar para a guia de boas vindas.\nVer cada aba irá te recompensar mais __1__ __2__...\n
free_coin_print=__1__ __2__ recebido por ler uma aba na tela de informação.
links_header=Links Úteis
links_discord=Confira nosso Discord para obter informações sobre novos mapas e sugerir novos mapas / ideias.
links_patreon=Contribua para nosso Patreon para receber vantagens especiais e ajudar a manter nossos servidores.
links_saves=Baixe nossos mapas, com o estado inicial e final, em nosso site.
links_factoriomaps=Veja nossos mapas anteriores como um Google Map.
rules_header=Regras
rules_text=Divirta-se e jogue bem. Lembre-se de que estamos todos aqui apenas para nos divertir, então vamos manter assim.\n\nNada de conteúdo odioso ou ataques pessoais.\n\nSe você suspeitar que alguém está praticando griefing, avise a equipe de administradores usando /report ou clicando no botão de denúncia ao lado do jogador na lista de jogadores.
rules_text_danger_ore=Se a construção de outro jogador precisar ser modificada ou removida, é necessária uma discussão em equipe ou uma votação antes da modificação ou remoção.\n\nA discussão em equipe ou a votação não é necessária se o jogador que construiu estiver online e concordar com a modificação ou remoção.\n\nAlteração de módulos em todo o mapa e upgrade de esteiras devem ser votados em equipe antes da alteração ou do upgrade.\n\nNo caso de uma votação em equipe, vence a maioria.\n\nApenas 1 ou 2 jogadores online não são suficientes para uma discussão ou votação em equipe. Ainda assim, a modificação ou remoção de uma construção pode ser necessária para manter a base funcionando bem. Deixe uma mensagem no chat do jogo informando que você está modificando ou removendo uma construção e por que isso é necessário. Apenas dizer que seu design ou construção é melhor ou fica mais bonita não é suficiente.
map_info_button=Info. do mapa
map_info_header=Informação do mapa
map_name_label=Nome do mapa:
map_desc_label=Descrição do mapa:
map_extra_info_label=Informações adicionais:
softmods_button=Recursos
softmods_header=Recursos e plugins do servidor
softmods_rank_text=Nós temos um sistema de rank para prevenir griefing. Você não pode usar armas nucleares ou o planejador de desconstrução se você for visitante. Se você jogar por algumas horas, um administrador vai promovê-lo para regular. Você também pode pedir a um administrador uma promoção se estiver trabalhando em um projeto que a exija.\n
softmods_rank_is=Seu rank é:
softmods_market_label=Mercado
softmods_market_text=Na maioria dos mapas você encontrará um mercado perto do spawn, onde pode usar moedas para fazer compras. As moedas são obtidas cortando árvores, fabricando itens à mão e destruindo ninhos de biters. A maioria dos itens do mercado é constante, mas alguns são específicos do mapa (geralmente aterro) e entram e saem de tempos em tempos.
softmods_saviour_label=Salva-vidas de trem
softmods_saviour_text=Os trens são o pior inimigo de um jogador de Factorio. Se você tiver pelo menos uma porta de jogador no inventário e for morto por um trem, sua vida será poupada, mas você perderá uma porta de jogador. Você pode conseguir portas de jogador no mercado.
softmods_plist_label=Lista de jogadores
softmods_plist_text=Lista todos os jogadores no servidor e mostra algumas estatísticas. Você pode ordenar a lista clicando nos cabeçalhos das colunas. Você também pode cutucar as pessoas, o que joga um substantivo aleatório no chat.
softmods_polls_label=Enquetes
softmods_polls_text=As enquetes ajudam os jogadores a obter consenso para ações importantes. Quer melhorar uma construção importante? Crie uma enquete para verificar se todos concordam. Você precisa ser um regular para criar novas enquetes.
softmods_tags_label=Tags
softmods_tags_text=Você pode atribuir a si mesmo uma função com tags para que os outros jogadores saibam o que você está fazendo. Ou apenas use a tag como decoração. Regulares podem criar novas tags personalizadas, não deixe de mostrar sua criatividade.
softmods_tasks_label=Tarefas
softmods_tasks_text=Não sabe no que deveria trabalhar? Que tal olhar as tarefas e ver o que precisa ser feito? Regulares podem adicionar novas tarefas.
softmods_bp_label=Auxiliar de\nplantas
softmods_bp_text=O auxiliar de plantas™ permite espelhar plantas na horizontal ou na vertical e permite\nconverter as entidades usadas na planta, ex. transformar esteiras amarelas em esteiras vermelhas.
softmods_score_label=Pontuação
softmods_score_text=Mostra o número de foguetes lançados, inimigos libertados, entidades construídas e muito mais!
softmods_shortcuts_label=Atalhos
softmods_shortcuts_text=Os atalhos do jogador são botões de fácil acesso que fornecem ferramentas úteis. Limpe corpos de biters do chão, organize seu inventário em baús/fornalhas próximos, recarregue suas baterias equipadas a partir de acumuladores próximos e muito mais.
softmods_production_hud_label=HUD de produção
softmods_production_hud_text=O HUD de produção é uma janela de estatísticas de produção que pode ficar na tela o tempo todo. Adicione/remova itens da lista monitorada e garanta que a fábrica esteja bem alimentada!
softmods_train_station_teleport_label=Teletransportador
softmods_train_station_teleport_text=O Teleporte de Estação de Trem permite teletransportar instantaneamente entre [entity=train-stop] pelo mapa. Tudo que você precisa fazer é ficar perto de um [entity=train-stop] e, na visão do mapa, abrir outro [entity=train-stop] e teletransportar para ele com o botão de teleporte.
softmods_autofill_label=Preenchimento automático
softmods_autofill_text=Insere munição automaticamente ao construir torretas. Pode ser configurado para filtrar os tipos e a quantidade de munição.
softmods_paint_brush_label=Pincel
softmods_paint_brush_text=A fábrica deve crescer! ...com estilo
whats_new_button=Novidades

