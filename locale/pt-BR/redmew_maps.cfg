# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=A caverna desabou!
cave_collapse_warning=Minerar entidades como paredes, caminhos de pedra, concreto\ne rochas pode causar um desabamento, cuidado, minerador!\n\nConselho do capataz: coloque uma parede a cada 4 blocos para\nevitá-lo. Use caminhos de pedra e concreto\npara reforçar ainda mais.

night_time_warning=Colocar painéis solares no subsolo parece\nter efeito nenhum na produção de energia!\nEstudos mostram que o mesmo vale para a versão portátil!\n\nConselho do capataz: painéis solares só são úteis na fabricação\nde satélites

cracking_sound_1=C O R R A M ,  S E U S   T O L O S !
cracking_sound_2=E S T A L O

score_cave_collapses=Desabamentos de caverna
score_mine_size=Tamanho da mina

auto_play_cutscene=Reproduzir automaticamente a cutscene do Diggy
cutscene_case_line2=Bem-vindo a __1__
cutscene_case_line4=Este é um cenário personalizado desenvolvido por __1__
cutscene_case_line5=Junte-se a nós em __1__
cutscene_case_line6=A introdução a seguir vai ajudar você a começar!
cutscene_case_line7=Se você tiver problemas durante esta cutscene, avise-nos
cutscene_case0_line1=Esta é a área inicial
cutscene_case0_line3=Expandir a mina é perigoso!
cutscene_case1_line1=As paredes servem para evitar que o teto da caverna desabe
cutscene_case2_line1=O mercado fornece suprimentos extras em troca de moedas
cutscene_case2_line3=Você desbloqueia novos itens ao subir de nível
cutscene_case3_line1=Desabamentos de caverna acontecem com frequência quando você não adiciona suportes
cutscene_case3_line3=Diferentes tipos de tijolo e concreto podem reforçar nossos pilares de suporte!
cutscene_case4_line1=Este mundo contém rochas quebradiças
cutscene_case4_line3=Nossas ferramentas são poderosas demais para impedir que os recursos sejam destruídos
cutscene_case5_line1=A maioria das ações dá experiência!
cutscene_case5_line3=O texto flutuante indica a quantidade e a causa da experiência
cutscene_case6_line1=A população nativa espreita no escuro
cutscene_case6_line3=Fique atento ao cavar, sempre leve algumas defesas consigo
cutscene_case7_line1=Isto conclui a introdução
cutscene_case7_line3=Divirta-se e continue cavando!
replay_cutscene=Para rever a introdução, use o comando __1__

blueprint_tools_tooltip=Mostrar ferramentas de planta de projeto

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Reproduzir automaticamente a cutscene de Crashsite
cutscene1_case_line2=Bem-vindo a __1__
cutscene1_case_line4=Este é um cenário personalizado desenvolvido por __1__
cutscene1_case_line5=Junte-se a nós em __1__
cutscene1_case_line6=A introdução a seguir vai ajudar você a começar a jogar!
cutscene1_case0_line3=Esta é a nossa barra de ferramentas!
cutscene1_case0_line4=Aqui você encontrará uma grande variedade de ferramentas e informações sobre nós!
cutscene1_case0_line5=Passe o mouse sobre elas para mais informações
cutscene1_case0_line6=Você pode mostrar ou ocultar a nossa barra de ferramentas com este botão
cutscene1_case1_line1=Esta é a área inicial. Ela tem um mercado e uma casa da moeda.
cutscene1_case1_line2=A casa da moeda produz moedas a uma taxa limitada, que pode ser melhorada no mercado.
cutscene1_case1_line3=Moedas também podem ser obtidas matando biters, spitters, worms e spawners.
cutscene1_case2_line1=As moedas são usadas para comprar itens no mercado.
cutscene1_case3_line1=Isto, junto com os depósitos de minério e a muralha, é o seu ponto de nascimento. Agora, os postos avançados.

cutscene2_case_line1=Este é um "posto avançado". Eles vêm em muitos formatos e tamanhos, com tudo, de Placas de Ferro a Armadura MK2.
cutscene2_case_line2=Você encontrará muitas estruturas semelhantes a esta espalhadas pelo mapa.
cutscene2_case0_line1=Os postos avançados são defendidos por torres e muralhas inimigas. A força das torres escala com as recompensas dentro.
cutscene2_case0_line2=Para "capturar" um posto avançado, você deve destruir todas as torres.
cutscene2_case1_line1=O posto avançado contém um Mercado, Baús de Loot e Fabricantes Mágicos.
cutscene2_case2_line1=Os Fabricadores Mágicos não exigem insumos nem eletricidade; eles produzem itens de graça. (Este aqui produz Placas de Ferro.)
cutscene2_case3_line1=Você pode melhorar a velocidade de fabricação no mercado (local) com moedas. Alguns mercados contêm itens adicionais.
cutscene2_case4_line1=Os biters evoluem rápido (e às vezes se multiplicam quando mortos!). Dica: mantenha a poluição no mínimo utilizando os itens grátis.
cutscene2_case5_line1=O objetivo deste cenário é eliminar todos os biters e lançar um foguete no mapa de tamanho limitado.
cutscene2_case5_line2=Isto conclui o tour. Boa sorte e divirta-se!
replay_cutscene=Para rever a introdução, use o comando __1__. Você também pode pressionar o ícone de informação para um resumo em texto.

# locale linked to the quadrants scenario
[quadrants]
on=Ligado
off=Desligado

compi_spawn_welcome=Bem-vindo ao Redmew - Quadrants!\n\nUse a GUI no canto superior esquerdo para jogar!
compi_spawn_cute=Eu sou muito Fofinho

compi_common_transfer_item=Como transferir itens?\nVocê pode usar correias subterrâneas para chegar ao outro lado\n\nVocê também pode soltar itens através, basta usar a tecla 'Z'
compi_common_chat=Foi silenciado?\nVocê pode conversar usando a tecla abaixo de ESC\n\nVocê pode mudar isso em Opções -> Controles -> Alternar console Lua
compi_common_market=Sobrou algum trocado?\nGaste suas moedas conquistadas com tanto esforço aqui no mercado
compi_common_switch=Você pode trocar de área!\nBasta que você tenha o inventário vazio\n\nFique perto de mim e use a GUI no canto superior esquerdo para trocar
compi_common_chests=Não consegue remover alguns baús?\nJogadores que trocam de área podem deixar um baú para trás\n\nVocê pode esvaziá-lo para removê-lo

compi_quadrant1_welcome=Bem-vindo a Ciência e Militar!\n\nCentro de comando do avanço militar e científico
compi_quadrant1_science=Esta área é a única que pode pesquisar\n\nVocê terá que importar alguns pacotes de ciência de outras áreas
compi_quadrant1_military=Você só pode fabricar itens militares nesta área\n\nOutras áreas dependem de você enviar itens militares para elas

compi_quadrant2_welcome=Bem-vindo a Intermediários e Mineração!\n\nO único produtor de aço e circuitos eletrônicos!
compi_quadrant2_steel=Esta área é a única que pode produzir aço\n\nOutras áreas dependem de você enviar aço para elas
compi_quadrant2_circuits=Esta área é a única que pode produzir circuitos\n\nVocê precisa exportá-los para outras áreas!
compi_quadrant2_resources=Dizem os rumores:\nEsta área é extremamente rica em recursos\n\nÉ ideal para operações de mineração

compi_quadrant3_welcome=Bem-vindo a Petróleo e Alta Tecnologia!\n\nLar do processamento de petróleo e da tecnologia
compi_quadrant3_oil=Esta área é a única que pode processar petróleo bruto\n\nVocê pode precisar importar petróleo bruto de outras áreas
compi_quadrant3_tech=Esta área é a única que pode produzir vários itens de alta tecnologia\n\nVocê pode precisar importar muitos produtos intermediários!
compi_quadrant3_rocket=Fiquei sabendo:\nEsta área é o lugar perfeito para lançar um foguete\n\nOutras áreas podem fornecer as peças de que você precisa

compi_quadrant4_welcome=Bem-vindo a Logística e Transporte\n\nLar do espaguete e dos pátios de trem
compi_quadrant4_logistic=Esta área é a única que pode entregar soluções logísticas\n\nO sucesso da região depende de você exportá-las!
compi_quadrant4_born=Você sabia?\nEu e meus irmãos nascemos aqui

popup_quadrant1_title=Centro de pesquisa e comando
popup_quadrant2_title=Produção de intermediários e mineração
popup_quadrant3_title=Produção de petróleo e alta tecnologia
popup_quadrant4_title=Produção logística
popup_quadrant1=Nosso objetivo principal é fornecer à região novas descobertas científicas\n\nSecundariamente, somos o hub central de comando\nFornecemos à região equipamento militar
popup_quadrant2=Nosso objetivo principal é fornecer à região produtos intermediários\nFornecemos principalmente circuitos eletrônicos em várias densidades\nTambém somos a área com o aço da mais alta qualidade!\nPesquisa inicial mostra uma quantidade maior de recursos nesta área
popup_quadrant3=Nosso objetivo principal é fornecer à região produtos à base de petróleo\nSecundariamente, somos o líder tecnológico da região\nFornecemos à região vários produtos de alta tecnologia (e radioativos)
popup_quadrant4=Nosso objetivo principal é fornecer à região soluções logísticas\nFornecemos principalmente soluções baseadas em correias e robôs logísticos\nTambém somos especializados em redes de trem de alto desempenho!

