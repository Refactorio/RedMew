description=[font=default-bold]RedMew 是一個 Factorio 社群，提供自訂伺服器、各種形狀與大小的地圖、腳本化劇情場景以及模組化伺服器。[/font]\n我們的場景提供超過 100 張不同的地圖，你可以透過以下步驟選擇你想要的地圖：\n\n[color=green]簡單模式：造訪[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]進階模式：編輯場景資料夾中的 map_selection.lua[/color]\n想進一步了解每張地圖，請查看 [color=blue]redmew.com/maps[/color] 的清單\n\n實用連結：Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]感謝你選擇 Redmew，一個由 Refactorio 打造的場景！[/color]
