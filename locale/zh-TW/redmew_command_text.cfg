# This file holds all the locale strings for command help and descriptions
# Ideally, string keys match command names (with - turned to _)

[command_description]
reward=給予目標玩家獎勵(數量為負數時則移除)
diggy_clear_void=清除指定區域內的虛空,但仍會觸發 Diggy 清除虛空時的所有事件。
config_restart=開啟伺服器設定中的伺服器重啟視窗
restart=重新啟動地圖。
abort=中止重啟作業。
danger_ore_restart_condition_not_met=發射的 [item=satellite] 數量不足,無法重新啟動地圖。
diggy_restart_condition_not_met=更認真挖礦吧,矮人!你必須達到採礦生產力 __1__ 才能開始新的採礦冒險!
crash_site_restart=重新啟動墜機現場劇本。
crash_site_restart_abort=中止墜機現場劇本的重啟作業。
crash_site_spy=花費金幣派出一條魚,短時間內偵察敵情。
crash_site_spy_invalid=你需要輸入有效位置才能派出間諜魚,例如 /spy [gps=-110,-17,redmew]
crash_site_spy_funds=訓練這些間諜魚可不便宜!你需要更多金幣!
crash_site_spy_success=__1__ 使用了 /spy 指令,花費 __2__ 枚金幣訓練一條魚來偵察敵方 [gps=__3__,__4__,redmew]
crash_site_airstrike_invalid=座標無效。
crash_site_airstrike=以毒氣膠囊對敵人發動空襲。
crash_site_airstrike_count=將空襲傷害升級至等級 [font=var]__1__[/font]\n\n使用空襲時，請將毒氣膠囊放入出生點的儲物箱，然後輸入 /strike 並接續一個 gps 座標\n\n傷害升級會增加空襲發射的毒氣膠囊數量。\n\n[color=255,230,192][font=default-bold]目前等級：[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]目前彈藥數量：[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]目前費用：[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=將空襲半徑升級至等級 [font=var]__1__[/font]\n\n使用空襲時，請將毒氣膠囊放入出生點的儲物箱，然後輸入 /strike 並接續一個 gps 座標\n\n[color=255,230,192][font=default-bold]目前等級：[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]目前半徑：[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]空襲半徑 __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]空襲傷害 __1__\n[/font][/color]
crash_site_airstrike_not_researched=你尚未研究空襲技術。請到出生點的市場看看 [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=發動空襲需再將 __1__ 枚毒氣膠囊放入付款箱 [gps=2.5,-7.5,redmew]
crash_site_airstrike_friendly_fire_error=你不想這麼做的,目標區域內沒有發現敵人。
crash_site_airstrike_damage_upgrade_success=__1__ 已將空襲傷害升級至等級 __2__
crash_site_airstrike_radius_upgrade_success=__1__ 已將空襲半徑升級至等級 __2__
crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]毒氣攻擊瞄準遙控器\n[/font][/color]
crash_site_airstrike_planner_description=使用這個拆除規劃器，一鍵即可輕鬆發動毒氣攻擊。把它放到快捷列上方便隨時取用。
crash_site_airstrike_no_enemies=在 [gps=__1__,__2__,__3__] 沒有發現敵人。這些毒氣膠囊真是浪費了!
crash_site_barrage_planner_label=[color=255,230,192][font=default-large-bold]彈幕瞄準遙控器\n[/font][/color]
crash_site_barrage_planner_description=使用這個拆除規劃器，一鍵即可輕鬆發動火炮彈幕。把它放到快捷列上方便隨時取用。
crash_site_barrage_invalid=座標無效。
crash_site_barrage=向敵人發射一輪熱追蹤飛彈彈幕。
crash_site_barrage_count=將彈幕傷害升級至等級 [font=var]__1__[/font]\n\n使用彈幕時，請將爆裂飛彈放入出生點的儲物箱，然後輸入 /barrage 並接續一個 gps 座標\n\n傷害升級可增加發射的飛彈數量。\n\n[color=255,230,192][font=default-bold]目前等級：[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]目前飛彈數量：[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]目前費用：[/font][/color] [font=var]__4__[/font]
crash_site_barrage_radius=將彈幕半徑升級至等級 [font=var]__1__[/font]\n\n使用彈幕時，請將爆裂飛彈放入出生點的儲物箱，然後輸入 /barrage 並接續一個 gps 座標\n\n[color=255,230,192][font=default-bold]目前等級：[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]目前半徑：[/font][/color] [font=var]__3__[/font]
crash_site_barrage_radius_name_label=[color=255,230,192][font=default-large-bold]飛彈彈幕半徑 __1__\n[/font][/color]
crash_site_barrage_count_name_label=[color=255,230,192][font=default-large-bold]飛彈彈幕傷害 __1__\n[/font][/color]
crash_site_barrage_not_researched=你尚未研究彈幕。請前往出生點的市場 [gps=-3,-3,redmew]
crash_site_barrage_insufficient_currency_error=若要發射飛彈彈幕，請再將 __1__ 枚爆裂飛彈裝入付款箱 [gps=-4.5,-7.5,redmew]
crash_site_barrage_no_nests=在這些座標 ([gps=__1__,__2__,__3__]) 找不到巢穴，真是浪費飛彈！
crash_site_barrage_damage_upgrade_success=__1__ 已將飛彈彈幕傷害升級至等級 __2__
crash_site_barrage_radius_upgrade_success=__1__ 已將飛彈彈幕半徑升級至等級 __2__
crash_site_rocket_tanks_name_label=[color=255,230,192][font=default-large-bold]飛彈坦克射擊間隔 __1__\n[/font][/color]
crash_site_rocket_tank_upgrade_success=__1__ 已將飛彈坦克的射擊間隔升級至等級 __2__
crash_site_rocket_tanks_description=升級飛彈坦克的射擊間隔，以縮短飛彈之間的發射時間。\n\n將飛彈放入坦克的物品欄，即可自動瞄準敵方的蠕蟲與巢穴。
crash_site_spider_army_decon_label=[color=255,230,192][font=default-large-bold]蜘蛛戰車軍團編組規劃器\n[/font][/color]
crash_site_spider_army_decon_description=使用這個拆除規劃器可快速將蜘蛛戰車編成一個軍團。首先，框選一個包含你蜘蛛戰車的區域。接著，對目標蜘蛛戰車按一下滑鼠左鍵，讓你的軍團跟隨它。
max_level=(最高等級)
dataset_copy=複製資料集
dataset_move=移動資料集
dataset_delete=刪除資料集
dataset_transform=轉換資料集並寫入目標資料集。呼叫 storage.transform_function 並傳送條目資料表，同時預期會回傳一個資料表。
dataset_transform_test=顯示轉換作業所產生的資料集。如需詳細資訊，請參閱 /help dataset-transform。
report=向管理員舉報使用者
kill=會把你殺死。
afk=顯示玩家已閒置多久。
zoom=設定你的縮放等級。
find=在地圖上顯示玩家所在位置的警示
show_rail_block=切換鐵路區塊的視覺化顯示。
server_time=顯示伺服器時間。
seeds=列出所有地表的種子碼
redmew_version=顯示 Redmew 劇本的版本
whois=提供指定玩家的相關資訊，管理員可將「yes」作為第二個參數來查看玩家的物品欄
clear_corpses=清除玩家附近的屍體（Regular 及以上等級）。使用 /clear_corpses surface 或 /clear_corpses s 可清除地表上的所有屍體（僅限管理員）。
meltdown_get=取得熔毀狀態。
meltdown_set=設定熔毀狀態。
redmew_color=「Set」會將你目前的顏色儲存起來，供之後的地圖使用。「Reset」會清除你儲存的顏色。「Random」會給你一個隨機的顏色。
performance_scale_set=將效能縮放設定在 0.05 到 1 之間。將依陣營改變遊戲速度、手動採礦速度、手動合成速度與角色跑步速度。
performance_scale_get=顯示目前的效能縮放。
permissions_reset=使用「/permissions-reset」將所有玩家的權限重設為預設值
permissions_set_scenario=使用「/permissions-set-scenario」重新套用場景的權限（如果有的話）
market=在你附近放置一座市場。使用 /market removeall 可移除地圖上的所有市場
lazy_bastard_bootstrap=放置起頭所需的最基本物資
toast=傳送通知訊息給所有玩家
toast_player=傳送通知訊息給特定玩家
sent_all_toast=__1__ 傳送了通知訊息給所有玩家
sent_player_toast=__1__ 傳送了通知訊息給 __2__
task=建立新任務。
tag=設定玩家的標籤
popup=向所有已連線的玩家顯示彈出視窗
popup_update=向所有已連線的玩家顯示更新彈出視窗
popup_player=對該玩家顯示彈出視窗。
poll=建立新投票
poll_result=顯示指定投票編號的結果。
debug=開啟除錯器
watch=讓你可以觀察其他玩家。
donator_welcome_message=新增、刪除或列出贊助者的歡迎訊息。
donator_death_message=新增、刪除或列出贊助者的死亡訊息。
reveal=顯示使用者周圍半徑內的區域
particle_scale=輸入 0 到 1 之間的比例數值，以降低或提高（最大）粒子數量。留空可檢視目前的數值。
apocalypse=這會真正結束這張地圖。第一次執行時，遊戲會進行儲存。第二次執行時，末日將會開始。
a=管理員聊天頻道。傳送訊息給所有其他管理員。
dc=silent-command
hax=切換你的 hax(使所有配方免費)
regular=給予玩家常客階級。
regular_remove=將玩家從常客降級至下一個較低的階級
probation=將玩家列入觀察名單。(他們將無法使用 redmew 指令,且永遠不會獲得自動信任階級。)
probation_remove=將玩家移出觀察名單。
showreports=顯示使用者檢舉紀錄
jail=將玩家關進監獄
unjail=將玩家釋放出監獄
pool=生成一池水
invoke=將該玩家傳送到你身邊。
tp=若留空，則傳送到目前選取的實體。mode = 切換傳送模式，可傳送到已放置的幽靈。player = 傳送到該玩家。
revive_ghosts=復活你周圍指定半徑內的幽靈
destroy=執行此指令時,摧毀游標下的實體
quick_bar_save=將你的[color=yellow]快捷列[/color]儲存在伺服器端,供之後的地圖使用
quick_bar_load=從伺服器載入你的[color=yellow]快捷列[/color](會覆蓋現有的快捷列)
quick_bar_delete=從伺服器刪除你儲存的[color=yellow]快捷列[/color]
logistic_requests_save=將你的[color=blue]物流需求[/color]儲存在伺服器端,供之後的地圖使用
logistic_requests_load=從伺服器載入你的[color=blue]物流需求[/color](會覆蓋現有的需求)
logistic_requests_delete=從伺服器刪除你儲存的[color=blue]物流需求[/color]
set_pollution_multiplier=實驗性功能。此整數乘以 0.01 後，即為墜機現場魔法製造機所排放的污染量。預設為 0
get_pollution_multiplier=墜機現場目前的污染倍率。預設為 0。
perks=列出目前贊助中、為現行福利出資的 Patreon 贊助者。
generate_desc=產生可貼入 /config 介面的伺服器名稱、描述與標籤
radio=開啟收音機視窗
rich_text=開啟豐富文字（Rich Text）介面
rpg_stats=顯示玩家數據
rpg_update=更新目標玩家的 RPG 數據與介面
rpg_leaderboard=顯示 RPG 排行榜
calculator_tech=計算研究目標科技所需的科技包成本
calculator_tech_player=計算為目標玩家研究目標科技所需的科技包成本
af_reset=重設所有功能
af_debug=顯示所有功能目前的等級
af_max=將所有功能設為各自的最大等級
frontier_ping_silo=在地圖上標記火箭發射井的位置
frontier_toggle_debug_ai=切換 AI 偵錯模式的開/關
frontier_toggle_debug_shop=切換商店偵錯模式的開/關
frontier_print_global=顯示 global 表格的內容
frontier_log_global=記錄 global 表格的內容
moderator=給予玩家審核員階級
moderator_remove=將玩家從審核員降級至次低的階級
regular_all=給予所有線上玩家常客階級（觀察期內者除外）
blueprint_tools=開啟藍圖工具管理介面
inventory=顯示目標玩家的物品欄。若未指定玩家，則顯示所有玩家的物品欄。

[command_custom_help]
tp=<blank|mode|player> 共 3 種用法："/tp" 傳送至所選實體。"/tp mode" 切換傳送模式。"/tp Newcott" 傳送至 Newcott。
poll=<{question = "問題", answers = {"答案 1", "答案 2"}, duration = 300}>
module_only=僅在啟用相關模組時可用
