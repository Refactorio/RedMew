# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=洞穴坍塌了！
cave_collapse_warning=採礦實體，例如牆壁、石板路、混凝土\n和岩石，都可能引發洞穴坍塌，礦工請小心！\n\n工頭的建議：每隔 4 格放置一面牆\n以防止洞穴坍塌。使用石板路和混凝土\n可以進一步加固。

night_time_warning=把太陽能板放在地下似乎\n不會影響發電量！\n研究顯示，攜帶型版本也一樣！\n\n工頭的建議：太陽能板只有在製作\n衛星時才有用

cracking_sound_1=快  跑  ，  你  們  這  些  傻  瓜  ！
cracking_sound_2=喀  啦

score_cave_collapses=洞穴坍塌次數
score_mine_size=礦坑規模

auto_play_cutscene=自動播放 Diggy 過場動畫
cutscene_case_line2=歡迎來到 __1__
cutscene_case_line4=這是由 __1__ 開發的自訂劇本
cutscene_case_line5=來 __1__ 加入我們
cutscene_case_line6=以下的介紹會幫助你上手！
cutscene_case_line7=如果在這段過場動畫中遇到問題，請告訴我們
cutscene_case0_line1=這裡是起始區域
cutscene_case0_line3=擴建礦坑很危險！
cutscene_case1_line1=牆壁的作用是防止洞穴頂部壓垮我們
cutscene_case2_line1=市場可以用硬幣換取額外物資
cutscene_case2_line3=升級時會解鎖新物品
cutscene_case3_line1=不加固的話，洞穴坍塌會經常發生
cutscene_case3_line3=不同種類的磚塊和混凝土可以強化我們的支撐柱！
cutscene_case4_line1=這個世界存在脆弱的岩石
cutscene_case4_line3=我們的工具威力太強，無法避免破壞任何資源
cutscene_case5_line1=大多數行動都能獲得經驗值！
cutscene_case5_line3=浮動文字會顯示經驗值的數量與來源
cutscene_case6_line1=原住民潛伏在黑暗之中
cutscene_case6_line3=挖掘時要小心，務必攜帶一些防禦設施
cutscene_case7_line1=介紹到此結束
cutscene_case7_line3=祝玩得愉快，繼續挖掘吧！
replay_cutscene=若要重播介紹，請使用 __1__ 指令

blueprint_tools_tooltip=顯示藍圖工具

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=自動播放 Crashsite 開場動畫
cutscene1_case_line2=歡迎來到 __1__
cutscene1_case_line4=這是由 __1__ 開發的自訂劇本
cutscene1_case_line5=來 __1__ 加入我們
cutscene1_case_line6=以下的介紹將幫助你開始遊玩！
cutscene1_case0_line3=這是我們的工具列！
cutscene1_case0_line4=在這裡你可以找到各種工具以及關於我們的資訊！
cutscene1_case0_line5=將滑鼠游標移到上面以查看更多資訊
cutscene1_case0_line6=你可以用這個按鈕開關我們的工具列
cutscene1_case1_line1=這是起始區域。這裡有一座市場和一部鑄幣機。
cutscene1_case1_line2=鑄幣機會以有限的速率生產硬幣，可以在市場升級。
cutscene1_case1_line3=殺死咬人蟲、噴吐蟲、蠕蟲和蟲巢也能獲得硬幣。
cutscene1_case2_line1=硬幣可以在市場購買物品。
cutscene1_case3_line1=這裡連同礦脈和城牆就是你的出生點。接著來看看前哨站。

cutscene2_case_line1=這是一座「前哨站」。它們有各種形狀和大小，內容物從鐵板到 MK2 護甲應有盡有。
cutscene2_case_line2=你會在地圖各處發現許多類似的建築。
cutscene2_case0_line1=前哨站由敵方砲塔和城牆防守。砲塔強度會隨著內部的獎勵而提升。
cutscene2_case0_line2=要「佔領」前哨站，你必須摧毀所有砲塔。
cutscene2_case1_line1=前哨站內有市場、戰利品箱和魔法製造機（組裝機、化工廠等）。
cutscene2_case2_line1=魔法製造機不需要原料或電力，就會免費生產物品。（這一台生產鐵板。）
cutscene2_case3_line1=你可以用硬幣在（當地的）市場升級製作速度。有些市場還販售額外的物品。
cutscene2_case4_line1=咬人蟲演化得很快（有時被殺死還會分裂！）。提示：善用免費物品，將污染降到最低。
cutscene2_case5_line1=這個劇本的目標是在有限大小的地圖上消滅所有咬人蟲並發射火箭。
cutscene2_case5_line2=導覽到此結束。祝你好運，玩得愉快！
replay_cutscene=要重播介紹，請使用 __1__ 指令。你也可以按資訊圖示查看文字摘要。

# locale linked to the quadrants scenario
[quadrants]
on=開
off=關

compi_spawn_welcome=歡迎來到 Redmew - Quadrants！\n\n使用你左上角的 GUI 來遊玩！
compi_spawn_cute=我真的很可愛

compi_common_transfer_item=如何傳送物品？\n你可以使用地下輸送帶到達另一側\n\n也可以直接把物品丟過去，只要按 ´Z´ 鍵
compi_common_chat=你被禁言了嗎？\n你可以使用 ESC 下方的按鍵來聊天\n\n你可以在 設定 -> 控制 -> 切換 Lua 主控台 中更改此設定
compi_common_market=手頭有閒錢嗎？\n來市場把你辛苦賺來的金幣花掉吧
compi_common_switch=你可以切換區域！\n唯一條件是你的物品欄必須是空的\n\n只要站在我附近，使用左上角的介面即可切換
compi_common_chests=有箱子移除不掉嗎？\n切換區域的玩家可能會遺留箱子\n\n你可以清空它來移除它

compi_quadrant1_welcome=歡迎來到科學與軍事區！\n\n軍事與科學進步的指揮中心
compi_quadrant1_science=這個區域是唯一能進行研究的區域\n\n你必須從其他區域進口一些科學包
compi_quadrant1_military=這個區域只能製造軍事物品\n\n其他區域需要你把軍事物品送過去

compi_quadrant2_welcome=歡迎來到中間產品與礦業區！\n\n鋼鐵與電子電路的唯一產地！
compi_quadrant2_steel=這個區域是唯一能生產鋼鐵的區域\n\n其他區域需要你把鋼鐵送過去
compi_quadrant2_circuits=這個區域是唯一能生產電路的區域\n\n你需要把它們出口到其他區域！
compi_quadrant2_resources=傳聞：\n這個區域的資源格外豐富\n\n非常適合進行採礦作業

compi_quadrant3_welcome=歡迎來到石油與高科技區！\n\n石油加工與科技的發源地
compi_quadrant3_oil=這個區域是唯一能加工原油的區域\n\n你可能需要從其他區域進口原油
compi_quadrant3_tech=這個區域是唯一能生產各種高科技產品的區域\n\n你可能需要進口大量中間產品！
compi_quadrant3_rocket=我聽說：\n這個區域是發射火箭的絕佳地點\n\n其他區域可以提供你所需的零件

compi_quadrant4_welcome=歡迎來到物流與運輸區\n\n義大利麵式管線與調車場的發源地
compi_quadrant4_logistic=這個區域是唯一能提供物流方案的區域\n\n本地區的成敗取決於你把這些出口出去！
compi_quadrant4_born=你知道嗎？\n我和我的兄弟姊妹都是在這裡誕生的

popup_quadrant1_title=研究與指揮中心
popup_quadrant2_title=中間產品生產與礦業
popup_quadrant3_title=石油與高科技生產
popup_quadrant4_title=物流生產
popup_quadrant1=我們的主要目標是為本地區提供新的科學發現\n\n其次我們是中央指揮樞紐\n我們為本地區提供軍事裝備
popup_quadrant2=我們的主要目標是為本地區提供中間產品\n我們主要供應各種密度的電子電路\n我們也是鋼鐵品質最高的區域！\n初步勘察顯示此區域的資源更加豐富
popup_quadrant3=我們的主要目標是為本地區提供石油製品\n其次我們是本地區的科技先驅\n我們為本地區提供各種高科技（以及放射性）產品
popup_quadrant4=我們的主要目標是為本地區提供物流方案\n我們主要供應以輸送帶和機器人為基礎的方案\n我們也專精於高效能的鐵路網路！

