# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew 資訊[/color][/font]\n 社群、規則、功能與地圖資訊
welcome_header=歡迎來到 RedMew！
welcome_text=RedMew 是一個歡迎各種程度玩家的社群，致力於透過自訂腳本與瘋狂的地圖設計來突破 Factorio 多人遊戲的極限。\n\n我們是一群友善的人，目標就是盡情玩樂，也希望你能樂在其中。
chatting_header=如何聊天
chatting_text=要與其他玩家聊天，請按下鍵盤上的 __CONTROL__toggle-console__ 鍵。\n英文鍵盤的預設按鍵是反引號（`），位於 ESC 鍵下方。\n可以在 __1__ -> __2__ -> __3__ 中更改此設定。
free_coin_header=免費硬幣
free_coin_text=查看歡迎分頁後，你獲得了 __1__ 個 __2__。\n檢視每個分頁都會再獎勵你 __1__ 個 __2__。\n
free_coin_print=因閱讀資訊畫面上的分頁而獲得 __1__ 個 __2__。
links_header=實用連結
links_discord=到我們的 Discord 查看新地圖資訊，並建議新地圖／新點子。
links_patreon=贊助我們的 Patreon 以獲得特殊福利，並協助維護我們的伺服器。
links_saves=從我們的網站下載地圖（包含開局與結束時的存檔狀態）。
links_factoriomaps=以 Google 地圖的形式瀏覽我們過往的地圖。
rules_header=規則
rules_text=玩得開心，保持風度。請記得大家來這裡都是為了玩樂，就讓我們維持這份氛圍。\n\n不得有仇恨內容或人身攻擊。\n\n如果你懷疑有人在惡意破壞，請使用 /report 通知管理員團隊，或點擊玩家名單中該玩家旁的檢舉按鈕。
rules_text_danger_ore=若需要修改或移除其他玩家的建築，必須先進行團隊討論或投票。\n\n若建造該建築的玩家線上並同意修改或移除，則無需團隊討論或投票。\n\n全地圖更換模組與升級輸送帶之前，必須先經團隊投票。\n\n若進行團隊投票，以多數決為準。\n\n僅 1 或 2 名玩家在線時，不足以構成團隊討論或投票。然而，為了讓基地順利運作，可能仍有必要修改或移除建築。此時應在遊戲聊天中留言說明正在修改或移除建築，以及為什麼需要這麼做。僅說明自己的設計或建築更好、更美觀是不夠的。
map_info_button=地圖資訊
map_info_header=地圖資訊
map_name_label=地圖名稱：
map_desc_label=地圖描述：
map_extra_info_label=額外資訊：
softmods_button=功能
softmods_header=功能與伺服器插件
softmods_rank_text=我們有基本的階級系統以防止惡意破壞。訪客無法使用核彈或拆除規劃器。遊玩數小時後，管理員會將你晉升為常客。如果你正在進行的專案需要更高權限，也可以向管理員申請晉升。\n
softmods_rank_is=你的階級是：
softmods_market_label=市場
softmods_market_text=在大多數地圖上，你會在出生點附近找到一間市場，可以用硬幣購買物品。硬幣可透過砍樹、手工合成物品與摧毀咬人蟲巢穴來取得。市場中大部分物品是固定的，但有些是地圖專屬（通常是填土），會不定期輪替上架與下架。
softmods_saviour_label=列車救星
softmods_saviour_text=列車是 Factorio 玩家最大的敵人。如果你的物品欄中至少有一個 player port，被列車撞死時將保住性命，但會失去一個 player port。你可以從市場取得 player port。
softmods_plist_label=玩家名單
softmods_plist_text=列出伺服器上的所有玩家並顯示一些統計資料。點擊欄位標題即可排序清單。你也可以戳一下別人，這會在聊天中隨機丟出一個名詞。
softmods_polls_label=投票
softmods_polls_text=投票幫助玩家就重大行動達成共識。想改建某個重要建築嗎？發起投票確認大家都同意吧。你必須是常客才能發起新投票。
softmods_tags_label=標籤
softmods_tags_text=你可以用標籤為自己指派角色，讓其他玩家知道你在做什麼。或者純粹把標籤當裝飾。常客可以建立新的自訂標籤，記得炫耀一下你的創意。
softmods_tasks_label=任務
softmods_tasks_text=不確定該做什麼嗎？不妨看看任務清單，了解有哪些事需要完成。常客可以新增任務。
softmods_bp_label=藍圖\n助手
softmods_bp_text=藍圖助手™讓你可以水平或垂直翻轉藍圖,還能\n轉換藍圖中使用的實體,例如把黃色輸送帶換成紅色輸送帶。
softmods_score_label=分數
softmods_score_text=顯示發射的火箭數、被解放的咬人蟲數、已建造的實體數等更多資訊！
softmods_shortcuts_label=快捷功能
softmods_shortcuts_text=玩家快捷功能是容易取用的按鈕，為玩家提供實用的工具。清除地上的咬人蟲屍體、把物品欄整理到附近的箱子/熔爐、從附近的蓄電池為裝備中的電池充電，還有更多功能。
softmods_production_hud_label=生產 HUD
softmods_production_hud_text=生產 HUD 是一個可以常駐畫面的生產統計視窗。從追蹤清單中新增/移除物品,確保工廠不缺料!
softmods_train_station_teleport_label=傳送器
softmods_train_station_teleport_text=車站傳送讓玩家可以在地圖上各個 [entity=train-stop] 之間瞬間傳送。你只需站在某個 [entity=train-stop] 附近,然後在地圖檢視中開啟另一個 [entity=train-stop],用它的傳送按鈕傳送過去。
softmods_autofill_label=自動補給
softmods_autofill_text=建造砲塔時自動放置彈藥。可設定篩選彈藥類型與數量。
softmods_paint_brush_label=畫筆
softmods_paint_brush_text=工廠必須成長!……而且要有型
whats_new_button=新功能

