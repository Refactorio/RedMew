description=[font=default-bold]RedMew는 사용자 지정 서버, 다양한 형태와 크기의 맵, 스크립트 시나리오, 모드 적용 서버를 운영하는 Factorio 커뮤니티입니다.[/font]\n저희 시나리오는 100개 이상의 다양한 맵을 제공하며, 다음 단계에 따라 원하는 맵을 선택할 수 있습니다:\n\n[color=green]간단 모드: 방문[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]고급 모드: 시나리오 폴더의 map_selection.lua 편집[/color]\n각 맵에 대한 자세한 내용은 [color=blue]redmew.com/maps[/color]의 목록을 확인하세요\n\n유용한 링크: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Refactorio의 시나리오, Redmew를 선택해 주셔서 감사합니다![/color]
