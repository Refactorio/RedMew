trust_all=접속 중인 모든 플레이어에게 정식 등급을 부여합니다 \n([img=utility/custom_tag_icon])
invoke_player=누군가를 내 위치로 순간이동시킵니다 \n([img=utility/custom_tag_icon])
goto_player=누군가의 위치로 이동합니다 \n([img=utility/custom_tag_icon])
spank_player=플레이어를 찌르는 메시지와 함께 살짝 피해를 입힙니다 \n([img=utility/custom_tag_icon])
kick_player=누군가를 현재 게임에서 추방합니다 \n([img=utility/custom_tag_icon])
