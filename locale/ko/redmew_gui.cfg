# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew 정보[/color][/font]\n 커뮤니티, 규칙, 기능, 맵 정보
welcome_header=RedMew에 오신 것을 환영합니다!
welcome_text=RedMew은 커스텀 스크립트와 별난 맵 디자인을 통해 팩토리오 멀티플레이어의 한계에 도전하는, 모든 실력대의 플레이어가 모인 커뮤니티입니다.\n\n저희는 친근한 무리로, 최대한 즐거운 시간을 보내는 것이 목표입니다. 여러분도 함께 즐기시길 바랍니다.
chatting_header=채팅을 하는 방법
chatting_text=다른 플레이어와 채팅하려면 키보드의 __CONTROL__toggle-console__ 키를 누르세요.\n영어 키보드 기준 기본 키는 grave(`)이며 ESC 키 아래에 있습니다.\n이 키는 __1__ -> __2__ -> __3__에서 변경할 수 있습니다.
free_coin_header=무료 코인
free_coin_text=환영 탭을 확인해 주셔서 __1__ __2__개를 드렸습니다.\n각 탭을 확인할 때마다 __1__ __2__를 추가로 받을 수 있습니다.\n
free_coin_print=정보 화면의 탭을 살펴봐 주셔서 __2__ __1__개가 지급되었습니다.
links_header=유용한 링크
links_discord=새 맵 소식과 새 맵/아이디어 제안은 저희 Discord를 확인해 주세요.
links_patreon=Patreon에 후원하시면 특별한 혜택을 받을 수 있으며 서버 유지에도 도움이 됩니다.
links_saves=저희 웹사이트에서 맵과 시작/완료 상태를 다운로드하세요.
links_factoriomaps=지난 맵들을 Google Map으로 확인해 보세요.
rules_header=규칙
rules_text=즐겁고 매너 있게 플레이해 주세요. 모두 즐기기 위해 모인 곳이라는 점을 기억하고 그 분위기를 지켜 주세요.\n\n혐오 콘텐츠나 인신공격은 금지입니다.\n\n누군가가 그리핑을 한다고 의심되면 /report를 사용하거나 플레이어 목록에서 해당 플레이어 옆의 신고 버튼을 클릭해 관리자 팀에게 알려 주세요.
rules_text_danger_ore=다른 플레이어의 건설물을 수정하거나 제거해야 할 경우, 수정 또는 제거 전에 팀 토의나 투표가 필요합니다.\n\n건설자가 접속 중이고 수정 또는 제거에 동의한다면 팀 토의나 투표는 필요하지 않습니다.\n\n맵 전체의 모듈 교체와 벨트 업그레이드는 작업 전에 팀 투표로 결정해야 합니다.\n\n팀 투표에서는 다수결이 원칙입니다.\n\n접속 중인 플레이어가 1~2명뿐이라면 팀 토의나 투표로 인정되지 않습니다. 하지만 기지가 원활하게 돌아가도록 건설물을 수정하거나 제거해야 할 수도 있습니다. 이 경우 게임 내 채팅에 어떤 건설물을 수정 또는 제거하는지, 왜 필요한지 메시지를 남겨야 합니다. 단순히 자기 설계나 건설이 더 낫거나 더 보기 좋다고 말하는 것으로는 충분하지 않습니다.
map_info_button=맵 정보
map_info_header=맵 정보
map_name_label=맵 이름:
map_desc_label=맵 설명:
map_extra_info_label=추가 정보:
softmods_button=기능
softmods_header=소프트 모드 및 서버 플러그인
softmods_rank_text=그리핑을 방지하기 위해 기본적인 등급 시스템을 운영하고 있습니다. 게스트 등급에서는 핵무기나 해체 계획법을 사용할 수 없습니다. 몇 시간 플레이하면 관리자가 정규 멤버로 승급시켜 줍니다. 승급이 필요한 프로젝트를 진행 중이라면 관리자에게 승급을 요청할 수도 있습니다.\n
softmods_rank_is=당신의 등급:
softmods_market_label=시장
softmods_market_text=대부분의 맵에는 스폰 지점 근처에 마켓이 있으며, 코인을 사용해 물건을 구매할 수 있습니다. 코인은 나무를 베거나 손으로 아이템을 제작하거나 바이터 둥지를 파괴하면 얻을 수 있습니다. 마켓의 대부분의 아이템은 고정되어 있지만 일부는 맵 전용(보통 매립지)이며 때때로 들어왔다 나갔다 합니다.
softmods_saviour_label=열차 구조 장치
softmods_saviour_text=기차는 팩토리오 플레이어를 가장 괴롭히는 존재입니다. 인벤토리에 플레이어 포트가 하나 이상 있는 상태에서 기차에 치어 사망하면 목숨은 구원되지만 플레이어 포트 하나를 잃게 됩니다. 플레이어 포트는 마켓에서 구할 수 있습니다.
softmods_plist_label=플레이어 목록
softmods_plist_text=서버의 모든 플레이어 목록과 몇 가지 통계를 표시합니다. 열 머리글을 클릭하면 목록을 정렬할 수 있습니다. 또한 다른 플레이어를 찌르기(poke)하면 채팅에 무작위 명사가 출력됩니다.
softmods_polls_label=투표
softmods_polls_text=투표는 중요한 작업에 대한 동의를 얻는 데 도움이 됩니다. 중요한 건설물을 개선하고 싶으신가요? 투표를 만들어 모두가 동의하는지 확인하세요. 새 투표를 만들려면 정규 멤버여야 합니다.
softmods_tags_label=태그
softmods_tags_text=태그로 자신의 역할을 지정하면 다른 플레이어에게 지금 무엇을 하고 있는지 알릴 수 있습니다. 아니면 그냥 장식으로 사용해도 됩니다. 정규 멤버는 새 커스텀 태그를 만들 수 있으니 창의성을 마음껏 뽐내 보세요.
softmods_tasks_label=과업
softmods_tasks_text=무엇을 해야 할지 모르겠다면 작업 목록을 살펴보고 필요한 일을 찾아보세요. 정규 멤버는 새 작업을 추가할 수 있습니다.
softmods_bp_label=청사진\n도우미
softmods_bp_text=청사진 도우미™를 사용하면 청사진을 가로 또는 세로로 뒤집을 수 있고\n청사진에 사용된 엔티티를 교체할 수 있습니다. 예: 노란 벨트를 빨간 벨트로 교체.
softmods_score_label=점수
softmods_score_text=발사된 로켓 수, 처치한 바이터 수, 건설한 엔티티 수 등 다양한 통계를 표시합니다!
softmods_shortcuts_label=단축 버튼
softmods_shortcuts_text=플레이어 단축 버튼은 유용한 도구를 손쉽게 쓸 수 있게 해 주는 버튼입니다. 땅에 있는 바이터 시체를 치우고, 인벤토리를 근처의 창고/화로에 정리하고, 근처의 축전지로 장착한 배터리를 충전하는 등 다양한 기능을 제공합니다.
softmods_production_hud_label=생산 HUD
softmods_production_hud_text=생산 HUD는 항상 화면에 띄워 둘 수 있는 생산 통계 창입니다. 추적 목록에 아이템을 추가/제거하여 공장에 자재가 원활히 공급되는지 확인하세요!
softmods_train_station_teleport_label=순간이동기
softmods_train_station_teleport_text=기차역 순간이동을 사용하면 맵 곳곳의 [entity=train-stop] 사이를 즉시 이동할 수 있습니다. [entity=train-stop] 근처에 선 채로 맵 보기에서 다른 [entity=train-stop]을 열어 순간이동 버튼을 누르기만 하면 됩니다.
softmods_autofill_label=자동 채우기
softmods_autofill_text=포탑을 건설할 때 탄약을 자동으로 넣어 줍니다. 탄약 종류와 수량을 필터링하도록 설정할 수 있습니다.
softmods_paint_brush_label=페인트 브러시
softmods_paint_brush_text=공장은 커져야 합니다! ...스타일 있게
whats_new_button=새로운 소식

