crash_site_rocket_tanks_description=로켓 탱크의 발사 간격을 업그레이드하면 로켓 발사 사이의 시간이 줄어듭니다.\n\n탱크의 아이템 칸에 로켓을 넣어두면 적 벌레와 둥지를 자동으로 조준합니다.
crash_site_spider_army_decon_label=[color=255,230,192][font=default-large-bold]스파이더트론 부대 편성 플래너\n[/font][/color]
crash_site_spider_army_decon_description=이 해체 설계도를 사용하면 스파이더트론을 빠르게 하나의 부대로 묶을 수 있습니다. 먼저, 스파이더트론이 있는 영역을 그룹 선택하세요. 다음, 부대가 따라갈 대상 스파이더트론을 왼쪽 클릭 한 번으로 지정하세요.
