# This file holds all the locale strings for command help and descriptions
# Ideally, string keys match command names (with - turned to _)

[command_description]
reward=타겟 플레이어에게 보상을 줍니다.(음수라면 제거합니다.)
diggy_clear_void=주어진 구획에서 공허를 제거하지만 Diggy가 공허를 제거할 때 발생하는 모든 이벤트를 발생시킵니다.
config_restart=서버 설정에서 서버 재시작 창을 엽니다
restart=맵을 재시작합니다.
abort=재시작을 중단합니다.
danger_ore_restart_condition_not_met=맵을 재시작하려면 [item=satellite] 발사 횟수가 부족합니다.
diggy_restart_condition_not_met=더 세게 채굴하라, 드워프여! 새로운 채굴 사업을 시작하려면 채굴 생산성 __1__에 도달해야 합니다!
crash_site_restart=충돌 지점 시나리오를 재시작합니다.
crash_site_restart_abort=크래시사이트 시나리오의 재시작을 중단합니다.
crash_site_spy=코인을 소비하여 잠시 동안 적을 정찰할 물고기를 보냅니다.
crash_site_spy_invalid=정찰 물고기를 보내려면 유효한 위치를 추가해야 합니다. 예: /spy [gps=-110,-17,redmew]
crash_site_spy_funds=이런 정찰 물고기를 훈련시키는 데는 비용이 많이 듭니다! 코인이 더 필요합니다!
crash_site_spy_success=__1__님이 /spy 명령어를 사용하여 __2__코인을 소비해 물고기를 훈련시키고 적을 정찰했습니다 [gps=__3__,__4__,redmew]
crash_site_airstrike_invalid=잘못된 좌표입니다.
crash_site_airstrike=독가스 캡슐을 이용해 적에게 공습을 가합니다.
crash_site_airstrike_count=공습 피해를 레벨 [font=var]__1__[/font](으)로 업그레이드합니다\n\n공습을 사용하려면 스폰 상자에 독가스 캡슐을 넣은 후 /strike를 입력하고 그 뒤에 gps 좌표를 붙이세요\n\n피해 업그레이드는 공습으로 발사되는 독가스 캡슐의 수를 증가시킵니다\n\n[color=255,230,192][font=default-bold]현재 레벨:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]현재 탄환 수:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]현재 비용:[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=공습 반경을 레벨 [font=var]__1__[/font](으)로 업그레이드합니다\n\n공습을 사용하려면 스폰 상자에 독가스 캡슐을 넣은 후 /strike를 입력하고 그 뒤에 gps 좌표를 붙이세요\n\n[color=255,230,192][font=default-bold]현재 레벨:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]현재 반경:[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]공습 반경 __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]공습 피해 __1__\n[/font][/color]
crash_site_airstrike_not_researched=아직 공습을 연구하지 않았습니다. 스폰 지점의 마켓을 방문하세요 [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=공습을 보내려면 지불 상자에 독가스 캡슐을 __1__개 더 넣으세요 [gps=2.5,-7.5,redmew]
crash_site_airstrike_friendly_fire_error=그건 하지 않는 것이 좋겠습니다. 대상 지역에서 적을 발견하지 못했습니다.
crash_site_airstrike_damage_upgrade_success=__1__님이 공습 피해를 레벨 __2__(으)로 업그레이드했습니다
crash_site_airstrike_radius_upgrade_success=__1__님이 공습 반경을 레벨 __2__(으)로 업그레이드했습니다
crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]독가스 공격 조준 리모컨\n[/font][/color]
crash_site_airstrike_planner_description=이 해체 계획기를 사용하면 클릭 한 번으로 독가스 공격을 손쉽게 시작할 수 있습니다. 쉽게 꺼내 쓸 수 있도록 핫바에 넣어두세요.
crash_site_airstrike_no_enemies=[gps=__1__,__2__,__3__]에서 적을 발견하지 못했습니다. 독가스 캡슐이 아깝네요!
