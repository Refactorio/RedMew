compi_spawn_welcome=Redmew - Quadrants에 오신 것을 환영합니다!\n\n왼쪽 상단 모서리의 GUI를 사용해 플레이하세요!
compi_spawn_cute=나는 진짜 귀여워

compi_common_transfer_item=아이템은 어떻게 전달하나요?\n지하 벨트를 사용하면 반대편에 도달할 수 있습니다\n\n아이템을 건너편에 떨어뜨릴 수도 있는데, ´Z´ 키를 사용하세요
compi_common_chat=채팅이 막혔나요?\nESC 아래의 키를 사용해 채팅할 수 있습니다\n\n설정 -> 조작 -> Lua 콘솔 전환에서 이를 변경할 수 있습니다
compi_common_market=남는 잔돈 있으신가요?\n열심히 모은 코인을 여기 마켓에서 사용해 보세요
compi_common_switch=지역을 이동할 수 있습니다!\n인벤토리만 비워 두면 됩니다\n\n제 근처에 서서 왼쪽 상단 모서리의 gui를 사용해 이동하세요
compi_common_chests=일부 상자를 제거할 수 없나요?\n구역을 이동한 플레이어가 상자를 남기고 갈 수 있습니다\n\n비운 뒤에 제거할 수 있습니다

compi_quadrant1_welcome=과학과 군사에 오신 것을 환영합니다!\n\n군사 및 과학 발전의 중앙 사령부입니다
compi_quadrant1_science=이 구역만이 연구를 할 수 있습니다\n\n다른 구역에서 과학 팩을 수입해야 합니다
compi_quadrant1_military=이 구역에서는 군사 아이템만 제작할 수 있습니다\n\n다른 구역들은 여러분이 군사 아이템을 보내주는 데 의존하고 있습니다

compi_quadrant2_welcome=중간 제품과 채굴에 오신 것을 환영합니다!\n\n강철과 전자 회로의 유일한 생산지입니다!
compi_quadrant2_steel=이 구역만이 강철을 생산할 수 있습니다\n\n다른 구역들은 여러분이 강철을 보내주는 데 의존하고 있습니다
compi_quadrant2_circuits=이 구역만이 회로를 생산할 수 있습니다\n\n다른 구역으로 수출해야 합니다!
compi_quadrant2_resources=소문에 따르면:\n이 구역은 자원이 특히 풍부합니다\n\n채굴 작업에 이상적인 곳입니다

compi_quadrant3_welcome=석유와 첨단 기술에 오신 것을 환영합니다!\n\n석유 정제와 기술의 본거지입니다
compi_quadrant3_oil=이 구역만이 원유를 정제할 수 있습니다\n\n다른 구역에서 원유를 수입해야 할 수도 있습니다
compi_quadrant3_tech=이 구역만이 다양한 첨단 기술 아이템을 생산할 수 있습니다\n\n많은 중간 제품을 수입해야 할 수도 있습니다!
compi_quadrant3_rocket=들어본 바로는:\n이 구역은 로켓 발사에 완벽한 장소입니다\n\n다른 구역에서 필요한 부품을 공급받을 수 있습니다

compi_quadrant4_welcome=물류와 운송에 오신 것을 환영합니다\n\n스파게티와 기차역의 본거지입니다
compi_quadrant4_logistic=이 구역만이 물류 솔루션을 제공할 수 있습니다\n\n이 지역의 성공은 여러분의 수출에 달려 있습니다!
compi_quadrant4_born=알고 계셨나요?\n제 형제들과 저는 여기서 태어났습니다

