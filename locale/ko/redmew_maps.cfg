# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=동굴이 무너졌습니다!
cave_collapse_warning=벽, 돌길, 콘크리트, 바위 같은 엔티티를 채굴하면\n동굴이 무너질 수 있으니 조심하세요, 광부 여러분!\n\n현장 감독의 조언: 4번째 타일마다 벽을 설치하면\n동굴 붕괴를 막을 수 있습니다. 돌길과 콘크리트로\n더욱 튼튼하게 보강하세요.

night_time_warning=지하에 태양광 패널을 설치해도\n전력 생산에는 효과가 없는 것 같습니다!\n연구에 따르면 휴대용 버전도 마찬가지라고 합니다!\n\n현장 감독의 조언: 태양광 패널은 위성 제작에만\n유용합니다

cracking_sound_1=도 망 쳐,  너 희   이 바 보 들 !
cracking_sound_2=뚜 두 득

score_cave_collapses=동굴 붕괴
score_mine_size=광산 크기

auto_play_cutscene=Diggy 컷신 자동 재생
cutscene_case_line2=__1__에 오신 것을 환영합니다
cutscene_case_line4=이것은 __1__이(가) 개발한 커스텀 시나리오입니다
cutscene_case_line5=__1__에서 우리와 함께하세요
cutscene_case_line6=다음 소개가 시작하는 데 도움이 될 것입니다!
cutscene_case_line7=이 컷신을 보는 중에 문제가 발생하면 알려주세요
cutscene_case0_line1=여기는 시작 지역입니다
cutscene_case0_line3=광산을 확장하는 것은 위험합니다!
cutscene_case1_line1=벽은 동굴 천장이 우리를 깔아뭉개지 못하게 막는 용도로 사용됩니다
cutscene_case2_line1=시장에서는 코인을 받고 추가 물자를 제공합니다
cutscene_case2_line3=레벨업하면 새로운 아이템이 해금됩니다
cutscene_case3_line1=지지대를 설치하지 않으면 동굴이 자주 무너집니다
cutscene_case3_line3=다양한 종류의 벽돌과 콘크리트로 지지 기둥을 보강할 수 있습니다!
cutscene_case4_line1=이 세계에는 부서지기 쉬운 바위가 있습니다
cutscene_case4_line3=우리의 도구는 너무 강력해서 자원을 파괴로부터 지켜낼 수 없습니다
cutscene_case5_line1=대부분의 행동은 경험치를 줍니다!
cutscene_case5_line3=떠다니는 텍스트는 경험치의 양과 원인을 나타냅니다
cutscene_case6_line1=원주민들이 어둠 속에 잠복해 있습니다
cutscene_case6_line3=채굴할 때는 조심하고, 항상 방어 수단을 챙기세요
cutscene_case7_line1=소개는 여기까지입니다
cutscene_case7_line3=즐거운 채굴 되세요, 계속 파내려 가세요!
replay_cutscene=소개를 다시 보려면 __1__ 명령어를 사용하세요

blueprint_tools_tooltip=청사진 도구 표시

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Crashsite 컷신 자동 재생
cutscene1_case_line2=__1__에 오신 것을 환영합니다
cutscene1_case_line4=__1__이(가) 개발한 커스텀 시나리오입니다
cutscene1_case_line5=__1__에서 저희와 함께하세요
cutscene1_case_line6=다음 소개가 여러분의 게임 시작에 도움이 될 것입니다!
cutscene1_case0_line3=이것이 저희 툴바입니다!
cutscene1_case0_line4=여기에서 다양한 도구와 저희에 대한 정보를 찾을 수 있습니다!
cutscene1_case0_line5=마우스를 올리면 자세한 정보를 볼 수 있습니다
cutscene1_case0_line6=이 버튼으로 저희 툴바를 켜고 끌 수 있습니다
cutscene1_case1_line1=여기는 시작 지역입니다. 마켓과 코인 조폐 시설이 있습니다.
cutscene1_case1_line2=코인 조폐 시설은 제한된 속도로 코인을 생산하며, 마켓에서 업그레이드할 수 있습니다.
cutscene1_case1_line3=비터, 스피터, 웜, 스포너를 처치해도 코인을 얻을 수 있습니다.
cutscene1_case2_line1=코인은 마켓에서 아이템을 구매하는 데 사용됩니다.
cutscene1_case3_line1=광맥과 벽을 포함한 이곳이 여러분의 스폰입니다. 이제 전초 기지로 가 보죠.

cutscene2_case_line1=이것은 "전초 기지"입니다. 철판부터 MK2 장갑까지 다양한 모양과 크기로 존재합니다.
cutscene2_case_line2=이와 비슷한 구조물들이 지도 곳곳에 흩어져 있는 것을 보게 될 것입니다.
cutscene2_case0_line1=전초 기지는 적 포탑과 벽으로 방어되어 있습니다. 포탑의 강도는 내부의 보상에 비례합니다.
cutscene2_case0_line2=전초 기지를 "점령"하려면 모든 포탑을 파괴해야 합니다.
cutscene2_case1_line1=전초 기지에는 마켓, 전리품 상자, 매직 크래프터(조립기, 화학 공장 등)가 있습니다.
cutscene2_case2_line1=매직 크래프터는 재료나 전기가 필요 없으며 무료로 아이템을 생산합니다. (이것은 철판을 만듭니다.)
cutscene2_case3_line1=코인으로 (현지) 마켓에서 제작 속도를 업그레이드할 수 있습니다. 일부 마켓에는 추가 아이템이 있습니다.
cutscene2_case4_line1=비터는 빠르게 진화합니다 (그리고 때로는 죽었을 때 오히려 늘어나기도 합니다!). 팁: 무료 아이템을 활용해 오염을 최소한으로 유지하세요.
cutscene2_case5_line1=이 시나리오의 목표는 제한된 크기의 지도에서 모든 비터를 제거하고 로켓을 발사하는 것입니다.
cutscene2_case5_line2=안내를 마치겠습니다. 즐거운 게임 되세요!
replay_cutscene=인트로를 다시 보려면 __1__ 명령어를 사용하세요. 정보 아이콘을 눌러 텍스트 요약을 볼 수도 있습니다.

