popup_quadrant4_title=물류 생산
popup_quadrant1=우리의 주요 목표는 이 지역에 새로운 과학적 발견을 제공하는 것입니다\n\n그다음으로 우리는 중앙 사령 허브입니다\n우리는 이 지역에 군사 장비를 공급합니다
popup_quadrant2=우리의 주요 목표는 이 지역에 중간 제품을 공급하는 것입니다\n우리는 주로 다양한 밀도의 전자 회로를 공급합니다\n또한 최고 품질의 강철을 생산하는 구역이기도 합니다!\n초기 조사에 따르면 이 구역에는 자원이 더 많은 것으로 나타났습니다
popup_quadrant3=우리의 주요 목표는 이 지역에 석유 기반 제품을 공급하는 것입니다\n그다음으로 우리는 이 지역의 기술 선도자입니다\n우리는 이 지역에 다양한 첨단 기술(그리고 방사성) 제품을 공급합니다
popup_quadrant4=우리의 주요 목표는 이 지역에 물류 솔루션을 제공하는 것입니다\n우리는 주로 벨트와 로봇 기반 솔루션을 공급합니다\n또한 고성능 열차 네트워크를 전문으로 합니다!

