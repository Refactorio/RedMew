crash_site_spider_army_decon_description=Använd den här rivningsplaneraren för att snabbt gruppera spindelvagnar till en armé. Först markerar du ett område med dina spindelvagnar som gruppval. Klicka sedan vänster en gång på en målspindelvagn som din grupp ska följa.
