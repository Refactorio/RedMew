crash_site_barrage_radius_name_label=[color=255,230,192][font=default-large-bold]Raketsalvans radie __1__\n[/font][/color]
crash_site_barrage_count_name_label=[color=255,230,192][font=default-large-bold]Raketsalvans skada __1__\n[/font][/color]
crash_site_barrage_not_researched=Du har ännu inte forskat om Salva. Besök marknaden vid spawnen [gps=-3,-3,redmew]
crash_site_barrage_insufficient_currency_error=För att avfyra en raketsalva, ladda __1__ fler explosiva raketer i betalkistan [gps=-4.5,-7.5,redmew]
crash_site_barrage_no_nests=Inga bon hittades vid dessa koordinater ([gps=__1__,__2__,__3__]), vilket slöseri med raketer!
crash_site_barrage_damage_upgrade_success=__1__ har uppgraderat raketsalvans skada till nivå __2__
crash_site_barrage_radius_upgrade_success=__1__ har uppgraderat raketsalvans radie till nivå __2__
crash_site_rocket_tanks_name_label=[color=255,230,192][font=default-large-bold]Raketstridsvagnarnas eldintervall __1__\n[/font][/color]
