# This file holds all the locale strings for command help and descriptions
# Ideally, string keys match command names (with - turned to _)

[command_description]
reward=Ger en belöning till en målspelare (tas bort om kvantiteten är negativ)
diggy_clear_void=Rensar tomrummet i ett givet område men utlöser fortfarande alla händelser som Diggy skulle göra vid rensning av tomrum.
config_restart=Öppnar fönstret för serverns omstart från serverkonfigurationerna
restart=Startar om kartan.
abort=Avbryter en omstart.
danger_ore_restart_condition_not_met=För få [item=satellite] har skickats upp för att starta om kartan.
