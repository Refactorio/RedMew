crash_site_airstrike_invalid=Ogiltiga koordinater.
crash_site_airstrike=Starta ett luftanfall mot fienden med giftkapslar.
crash_site_airstrike_count=Uppgradera luftanfallsskadan till nivå [font=var]__1__[/font]\n\nFör att använda luftanfall, lägg giftkapslar i spawnkistan och skriv sedan /strike följt av en gps-position\n\nSkadeuppgraderingar ökar antalet giftkapslar som skickas upp vid luftanfall.\n\n[color=255,230,192][font=default-bold]Aktuell nivå:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Aktuellt antal granater:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Aktuell kostnad:[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=Uppgradera luftanfallsradien till nivå [font=var]__1__[/font]\n\nFör att använda luftanfall, lägg giftkapslar i spawnkistan och skriv sedan /strike följt av en gps-position\n\n[color=255,230,192][font=default-bold]Aktuell nivå:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Aktuell radie:[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]Luftanfallsradie __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]Luftanfallsskada __1__\n[/font][/color]
crash_site_airstrike_not_researched=Du har inte forskat luftanfall ännu. Besök marknaden vid spawnen [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=För att skicka ett luftanfall, ladda __1__ fler giftkapslar i betalkistan [gps=2.5,-7.5,redmew]
crash_site_airstrike_friendly_fire_error=Du vill inte göra det, inga fiender hittades i målområdet.
crash_site_airstrike_damage_upgrade_success=__1__ har uppgraderat Luftanfallsskada till nivå __2__
crash_site_airstrike_radius_upgrade_success=__1__ har uppgraderat Luftanfallsradie till nivå __2__
crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]Giftanfallsmålsfjärrkontroll\n[/font][/color]
