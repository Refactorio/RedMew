crash_site_barrage_count=Uppgradera salvans skada till nivå [font=var]__1__[/font]\n\nFör att använda salvan, placera explosiva raketer i spawnkistan och skriv sedan /barrage följt av en gps-position\n\nSkadeuppgraderingar ökar antalet raketer som avfyras.\n\n[color=255,230,192][font=default-bold]Aktuell nivå:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Aktuellt antal raketer:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Aktuell kostnad:[/font][/color] [font=var]__4__[/font]
