# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=Grottan har rasat!
cave_collapse_warning=Att bryta sig genom murar, stenbeläggningar, betong\noch stenar kan orsaka ett ras, var försiktig gruvarbetare!\n\nArbetsledarens råd: Placera en mur var 4:e ruta för\natt förhindra ett ras. Använd stenbeläggningar och betong\nför att förstärka det ytterligare.

night_time_warning=Att placera solpaneler under jorden verkar inte\nha någon effekt på kraftproduktionen!\nStudier visar att samma sak gäller den portabla versionen!\n\nArbetsledarens råd: Solpaneler är bara användbara vid tillverkning\nav satelliter

cracking_sound_1=S P R I N G,  N I   D Å R A R !
cracking_sound_2=S P R Ä C K

score_cave_collapses=Grottras
score_mine_size=Gruvstorlek

auto_play_cutscene=Spela upp Diggy-filmsekvensen automatiskt
cutscene_case_line2=Välkommen till __1__
cutscene_case_line4=Det här är ett eget scenario utvecklat av __1__
cutscene_case_line5=Häng med oss på __1__
cutscene_case_line6=Följande introduktion hjälper dig att komma igång!
cutscene_case_line7=Om du får problem under den här filmsekvensen så hör av dig
cutscene_case0_line1=Det här är startområdet
cutscene_case0_line3=Att utöka gruvan är farligt!
cutscene_case1_line1=Murar används för att hålla grottaket från att krossa oss
cutscene_case2_line1=Marknaden ger extra förnödenheter i utbyte mot mynt
cutscene_case2_line3=Du låser upp nya föremål när du går upp i nivå
cutscene_case3_line1=Ras i grottor sker ofta när du inte bygger stöttor
cutscene_case3_line3=Olika typer av tegel och betong kan förstärka våra stödpelare!
cutscene_case4_line1=Den här världen innehåller sköra stenar
cutscene_case4_line3=Våra verktyg är för kraftfulla för att kunna bevara några resurser från att förstöras
cutscene_case5_line1=De flesta handlingar ger erfarenhet!
cutscene_case5_line3=Den svävande texten visar mängden och orsaken till erfarenheten
cutscene_case6_line1=Den inhemska befolkningen lurar i mörkret
cutscene_case6_line3=Var försiktig när du gräver, ta alltid med lite försvar
cutscene_case7_line1=Härmed är introduktionen slut
cutscene_case7_line3=Ha det roligt och fortsätt gräva!
replay_cutscene=För att spela upp introduktionen igen, använd kommandot __1__

blueprint_tools_tooltip=Visa ritningsverktyg

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Spela upp Crashsite-filmsekvensen automatiskt
cutscene1_case_line2=Välkommen till __1__
cutscene1_case_line4=Detta är ett eget scenario utvecklat av __1__
cutscene1_case_line5=Häng med oss på __1__
cutscene1_case_line6=Följande introduktion hjälper dig att komma igång med att spela!
cutscene1_case0_line3=Detta är vårt verktygsfält!
cutscene1_case0_line4=Här hittar du ett stort urval av verktyg och information om oss!
cutscene1_case0_line5=Håll muspekaren över dem för mer information
cutscene1_case0_line6=Du kan visa eller dölja vårt verktygsfält med den här knappen
cutscene1_case1_line1=Detta är startområdet. Det har en marknad och ett myntverk.
cutscene1_case1_line2=Myntverket producerar mynt i begränsad takt, och kan uppgraderas på marknaden.
cutscene1_case1_line3=Mynt kan också fås genom att döda biters, spitters, worms och spawners.
cutscene1_case2_line1=Mynt används för att köpa föremål på marknaden.
cutscene1_case3_line1=Detta, tillsammans med malmfälten och muren, är din spawnpunkt. Nu vidare till utposterna.

cutscene2_case_line1=Detta är en "utpost". De kommer i många former och storlekar, med allt från järnplattor till MK2-rustningar.
cutscene2_case_line2=Du kommer att hitta många liknande byggnader utspridda över kartan.
cutscene2_case0_line1=Utposter försvaras av fientliga torn och murar. Tornens styrka skalar med belöningarna inuti.
cutscene2_case0_line2=För att "erövra" en utpost måste du förstöra alla torn.
cutscene2_case1_line1=Utposten innehåller en marknad, bytekistor och magiska tillverkare (monteringsmaskiner, kemianläggningar etc).
cutscene2_case2_line1=Magiska tillverkare kräver varken inmatning eller el, de producerar föremål gratis. (Den här gör järnplattor.)
cutscene2_case3_line1=Du kan uppgradera tillverkningshastigheten på den (lokala) marknaden med mynt. Vissa marknader innehåller ytterligare föremål.
cutscene2_case4_line1=Biters utvecklas snabbt (och förökar sig ibland när de dödas!). Tips: håll föroreningarna på miniminivå genom att använda de gratis föremålen.
cutscene2_case5_line1=Målet med det här scenariot är att utplåna alla biters och skjuta upp en raket på den storleksbegränsade kartan.
cutscene2_case5_line2=Därmed är rundvandran slut. Lycka till och ha det roligt!
replay_cutscene=För att spela upp introduktionen igen, använd kommandot __1__. Du kan också trycka på informationsikonen för en textsammanfattning.

# locale linked to the quadrants scenario
[quadrants]
on=PÅ
off=AV

compi_spawn_welcome=Välkommen till Redmew - Kvadranter!\n\n Använd gränssnittet i övre vänstra hörnet för att spela!
compi_spawn_cute=Jag är rätt gullig

compi_common_transfer_item=Hur flyttar man föremål?\nDu kan använda underjordsband för att nå andra sidan\n\nDu kan också släppa över föremål, tryck bara på 'Z'-tangenten
compi_common_chat=Har du blivit avstängd från chatten?\nDu kan chatta med tangenten under ESC\n\nDu kan ändra detta under Inställningar -> Kontroller -> Växla Lua-konsol
compi_common_market=Har du några mynt över?\nGå och spendera dina hårt intjänade mynt här på marknaden
compi_common_switch=Du kan byta område!\nAllt som krävs är att du har ett tomt lager\n\nStäll dig bara nära mig och använd gränssnittet i övre vänstra hörnet för att byta
compi_common_chests=Kan du inte ta bort några kistor?\nSpelare som byter område kan lämna efter sig en kista\n\nDu kan tömma den för att ta bort den

compi_quadrant1_welcome=Välkommen till Vetenskap och Militär!\n\nKommandocentrum för militär och vetenskaplig utveckling
compi_quadrant1_science=Detta område är det enda som kan forska\n\nDu måste importera några vetenskapspaket från andra områden
compi_quadrant1_military=Du kan bara tillverka militärföremål i detta område\n\nAndra områden är beroende av att du skickar militärföremål till dem

compi_quadrant2_welcome=Välkommen till Mellanprodukter och Gruvdrift!\n\nDen enda producenten av stål och elektroniska kretsar!
compi_quadrant2_steel=Detta område är det enda som kan producera stål\n\nAndra områden är beroende av att du skickar stål till dem
compi_quadrant2_circuits=Detta område är det enda som kan producera kretsar\n\nDu måste exportera dem till andra områden!
compi_quadrant2_resources=Rykten säger:\nDetta område är extra rikt på resurser\n\nDet är idealiskt för gruvdrift

compi_quadrant3_welcome=Välkommen till Olja och Högteknologi!\n\nHemvist för oljeprocessering och teknik
compi_quadrant3_oil=Detta område är det enda som kan processera råolja\n\nDu kan behöva importera råolja från andra områden
compi_quadrant3_tech=Detta område är det enda som kan producera olika högteknologiska föremål\n\nDu kan behöva importera en massa mellanprodukter!
compi_quadrant3_rocket=Jag har hört:\nDetta område är en perfekt plats att skjuta upp en raket från\n\nAndra områden kan förse dig med de delar du behöver

compi_quadrant4_welcome=Välkommen till Logistik och Transport\n\nHemvist för spaghetti och bangårdar
compi_quadrant4_logistic=Detta område är det enda som kan leverera logistiska lösningar\n\nRegionens framgång beror på att du exporterar dessa!
compi_quadrant4_born=Visste du?\nJag och mina syskon föddes här

popup_quadrant1_title=Forsknings- och kommandocentrum
popup_quadrant2_title=Mellanproduktion och gruvdrift
popup_quadrant3_title=Olje- och högteknologiproduktion
popup_quadrant4_title=Logistisk produktion
popup_quadrant1=Vårt huvudmål är att förse regionen med nya vetenskapliga upptäckter\n\nSekundärt är vi det centrala kommandocentrumet\nVi förser regionen med militär utrustning
popup_quadrant2=Vårt huvudmål är att förse regionen med mellanprodukter\nVi levererar främst elektroniska kretsar i olika tätheter\nVi är också området med stål i högsta kvalitet!\nEn första undersökning visar ökade resurser i detta område
popup_quadrant3=Vårt huvudmål är att förse regionen med oljebaserade produkter\nSekundärt är vi regionens teknologiska ledare\nVi förser regionen med olika högteknologiska (och radioaktiva) produkter
popup_quadrant4=Vårt huvudmål är att förse regionen med logistiska lösningar\nVi levererar främst band- och robotbaserade lösningar\nVi är också specialiserade på högeffektiva tågnätverk!

