# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew Info[/color][/font]\n Community, regler, funktioner, kartinfo
welcome_header=Välkommen till RedMew!
welcome_text=RedMew är en gemenskap för spelare på alla nivåer som arbetar med att överskrida gränserna för Factorio-flerspelarläget genom egna skript och galna kartdesigner.\n\nVi är ett trevligt gäng, vårt mål är att ha så roligt som möjligt och vi hoppas att du också vill vara med.
chatting_header=Så här chattar du
chatting_text=För att chatta med andra spelare trycker du på tangenten __CONTROL__toggle-console__ på ditt tangentbord.\nStandardtangenten på engelska tangentbord är grav accent (`) och ligger under ESC-tangenten.\nDetta kan ändras i __1__ -> __2__ -> __3__.
free_coin_header=Gratis mynt
free_coin_text=Du har fått __1__ __2__ för att du tittade på välkomstfliken.\nOm du kollar varje flik får du __1__ __2__ till.\n
free_coin_print=__1__ __2__ utdelade för att du läste en flik på infoskärmen.
links_header=Användbara länkar
links_discord=Kolla in vår discord för info om nya kartor och för att föreslå nya kartor / idéer.
links_patreon=Bidra till vår Patreon för att få speciella förmåner och hjälpa till att underhålla våra servrar.
links_saves=Ladda ner våra kartor, med start- och slutläge, från vår webbplats.
links_factoriomaps=Se våra tidigare kartor som en Google-karta.
rules_header=Regler
rules_text=Ha det roligt och spela snällt. Kom ihåg att vi alla bara är här för att ha roligt, så låt oss hålla det så.\n\nInget hatiskt innehåll eller personliga angrepp.\n\nOm du misstänker att någon saboterar (griefing), meddela adminteamet via /report eller genom att klicka på anmälningsknappen bredvid spelaren i spellistan.
rules_text_danger_ore=Om en annan spelares bygge behöver ändras eller tas bort krävs en lagdiskussion eller röstning/omröstning innan ändringen eller borttagningen.\n\nEn lagdiskussion eller röstning/omröstning är inte nödvändig om spelaren som byggde det är online och samtycker till ändringen eller borttagningen.\n\nKartomfattande modulbyten och banduppgraderingar måste röstas igenom som ett lag innan ändringen eller uppgraderingen.\n\nVid en lagröstning/omröstning vinner majoriteten.\n\nEndast 1 eller 2 spelare online räcker inte för en lagdiskussion eller röstning/omröstning. Ändå kan det bli nödvändigt att ändra eller ta bort ett bygge för att basen ska fungera smidigt. Ett meddelande ska lämnas i spelchatten med information om att ett bygge ändras eller tas bort, och varför det behöver göras. Att bara säga att din design eller ditt bygge är bättre eller ser finare ut räcker inte.
map_info_button=Kartinfo
map_info_header=Kartinformation
map_name_label=Kartnamn:
map_desc_label=Kartbeskrivning:
map_extra_info_label=Extra info:
softmods_button=Funktioner
softmods_header=Funktioner & servertillägg
softmods_rank_text=Vi har ett grundläggande rankssystem för att förhindra sabotage. Du kan inte använda kärnvapen eller rivningsplaneraren om du är gäst. Om du spelar i ett par timmar kommer en admin att befordra dig till ordinarie. Du kan också be en admin om befordran om du arbetar med ett projekt som kräver det.\n
softmods_rank_is=Din rank är:
softmods_market_label=Marknad
softmods_market_text=På de flesta kartor hittar du en marknad nära spawn där du kan använda mynt för att handla. Mynt får man genom att fälla träd, tillverka föremål för hand och förstöra biternest. De flesta föremål på marknaden är fasta, men några är kartspecifika (vanligtvis utfyllnad) och roteras in och ut från tid till annan.
softmods_saviour_label=Tågräddaren
softmods_saviour_text=Tåg är en factoriospelares värsta fiende. Om du har minst en spelarport i ditt förråd och blir påkörd av ett tåg skonas ditt liv, men du förlorar en spelarport. Du kan få spelarportar från marknaden.
softmods_plist_label=Spellista
softmods_plist_text=Listar alla spelare på servern och visar lite statistik. Du kan sortera listan genom att klicka på kolumnrubrikerna. Du kan även puffa på folk, vilket kastar fram ett slumpmässigt substantiv i chatten.
softmods_polls_label=Omröstningar
softmods_polls_text=Omröstningar hjälper spelare att nå konsensus om större åtgärder. Vill du förbättra en viktig byggnad? Skapa en omröstning för att kontrollera att alla är ok med det. Du måste vara ordinarie för att skapa nya omröstningar.
softmods_tags_label=Etiketter
softmods_tags_text=Du kan tilldela dig själv en roll med etiketter för att låta andra spelare veta vad du gör. Eller använd bara etiketten som dekoration. Ordinarie medlemmar kan skapa nya egna etiketter, se till att visa upp din kreativitet.
softmods_tasks_label=Uppgifter
softmods_tasks_text=Osäker på vad du borde jobba med, varför inte titta på uppgifterna och se vad som behöver göras. Ordinarie medlemmar kan lägga till nya uppgifter.
softmods_bp_label=BP\nhjälp
softmods_bp_text=Ritningshjälparen™ låter dig vända ritningar horisontellt eller vertikalt och låter dig\nkonvertera de entiteter som används i ritningen, t.ex. byta ut gula band mot röda band.
softmods_score_label=Poäng
softmods_score_text=Visar antalet uppsända raketer, befriade bitare, byggda entiteter och mycket mer!
softmods_shortcuts_label=Genvägar
softmods_shortcuts_text=Spelargenvägar är lättillgängliga knappar som ger spelaren användbara verktyg. Rensa bitarkroppar från marken, sortera ditt lager i närliggande kistor/ugnar, ladda dina utrustade batterier från närliggande ackumulatorer och mycket mer.
softmods_production_hud_label=Prod. HUD
softmods_production_hud_text=Produktions-HUD:en är ett fönster med produktionsstatistik som kan hållas på skärmen hela tiden. Lägg till/ta bort föremål från den bevakade listan och se till att fabriken får gott om mat!
softmods_train_station_teleport_label=Teleportör
softmods_train_station_teleport_text=Tågstationsteleporteringen låter spelaren omedelbart teleportera mellan [entity=train-stop] över hela kartan. Allt du behöver göra är att stå nära en [entity=train-stop] och öppna en annan [entity=train-stop] från kartvyn och teleportera till den med dess teleportknapp.
softmods_autofill_label=Autofyll
softmods_autofill_text=Fyller automatiskt på ammunition när torn byggs. Kan konfigureras för att filtrera ammunitionstyper och mängd.
softmods_paint_brush_label=Pensel
softmods_paint_brush_text=Fabriken måste växa! ...med stil
whats_new_button=Vad är nytt

