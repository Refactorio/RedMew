description=[font=default-bold]RedMew är en Factorio-community som är värd för skräddarsydda servrar, kartor i alla former och storlekar, skriptade scenarier och moddade servrar.[/font]\nVårt scenario erbjuder över 100 olika kartor, och du kan välja den du vill spela med följande steg:\n\n[color=green]Enkelt läge: besök[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Expertläge: redigera map_selection.lua i scenariomappen[/color]\nFör mer information om vad varje karta innehåller, se listan på [color=blue]redmew.com/maps[/color]\n\nAnvändbara länkar: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Tack för att du valde Redmew, ett scenario av Refactorio![/color]
