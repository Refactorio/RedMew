# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=La grotte s'est effondrée !
cave_collapse_warning=Miner des entités telles que des murs, des chemins de pierre, du béton\nou des rochers peut provoquer un éboulement, attention mineur !\n\nConseil du contremaître : placez un mur toutes les 4 cases pour\néviter un éboulement. Utilisez des chemins de pierre et du béton\npour le renforcer davantage.

night_time_warning=Placer des panneaux solaires sous terre ne semble pas\navoir d'effet sur la production d'énergie !\nDes études montrent qu'il en va de même pour la version portable !\n\nConseil du contremaître : les panneaux solaires ne servent qu'à fabriquer\ndes satellites

cracking_sound_1=C O U R E Z,  P A U V R E S   F O U S !
cracking_sound_2=C R A C

score_cave_collapses=Éboulements
score_mine_size=Taille de la mine

auto_play_cutscene=Lecture automatique de la cinématique de Diggy
cutscene_case_line2=Bienvenue sur __1__
cutscene_case_line4=Ceci est un scénario personnalisé développé par __1__
cutscene_case_line5=Rejoignez-nous sur __1__
cutscene_case_line6=L'introduction suivante vous aidera à démarrer !
cutscene_case_line7=Si vous rencontrez des problèmes pendant cette cinématique, faites-le nous savoir
cutscene_case0_line1=Voici la zone de départ
cutscene_case0_line3=Étendre la mine est dangereux !
cutscene_case1_line1=Les murs servent à empêcher le plafond de la grotte de nous écraser
cutscene_case2_line1=Le marché fournit des ravitaillements supplémentaires en échange de pièces
cutscene_case2_line3=Vous débloquez de nouveaux objets lorsque vous passez au niveau supérieur
cutscene_case3_line1=Les grottes s’effondrent fréquemment si vous ne placez pas de supports
cutscene_case3_line3=Différents types de briques et de béton peuvent renforcer nos piliers de soutien!
cutscene_case4_line1=Ce monde contient des rochers cassants
cutscene_case4_line3=Nos outils sont trop puissants, impossible de préserver les ressources de leur destruction
cutscene_case5_line1=La plupart des actions donnent de l'expérience !
cutscene_case5_line3=Le texte flottant indique la quantité et la cause de l'expérience
cutscene_case6_line1=La population locale rôde dans l'obscurité
cutscene_case6_line3=Soyez prudent quand vous creusez, apportez toujours quelques défenses
cutscene_case7_line1=Ceci conclut l'introduction
cutscene_case7_line3=Amusez-vous bien et continuez à creuser !
replay_cutscene=Pour rejouer l'introduction, utilisez la commande __1__

blueprint_tools_tooltip=Afficher les outils de plan

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Lecture automatique de la cinématique de Crashsite
cutscene1_case_line2=Bienvenue sur __1__
cutscene1_case_line4=Ceci est un scénario personnalisé développé par __1__
cutscene1_case_line5=Rejoignez-nous à __1__
cutscene1_case_line6=L'introduction suivante vous aidera à commencer à jouer !
cutscene1_case0_line3=C'est notre barre d'outils!
cutscene1_case0_line4=Vous trouverez ici un large éventail d'outils et d'informations à propos de nous !
cutscene1_case0_line5=Survolez-les avec votre souris pour plus d'informations
cutscene1_case0_line6=Vous pouvez afficher ou masquer notre barre d'outils avec ce bouton
cutscene1_case1_line1=Voici la zone de départ. Elle abrite un marché et un atelier de frappe de pièces.
cutscene1_case1_line2=La fabrique de pièces produit des pièces à un rythme limité, améliorable au marché.
cutscene1_case1_line3=Vous pouvez aussi obtenir des pièces en tuant des biters, des cracheurs, des vers et des nids.
cutscene1_case2_line1=Les pièces sont utilisées pour acheter des objets dans le marché.
cutscene1_case3_line1=Ceci, avec les gisements de minerai et le mur, constitue votre point d'apparition. Direction les avant-postes.

cutscene2_case_line1=Ceci est un « Avant-poste ». Ils sont disponibles en plusieurs formes et tailles, avec tout allant des plaques de fer aux armures MK2.
cutscene2_case_line2=Vous trouverez de nombreuses structures semblables à celle-ci dispersées sur la carte.
cutscene2_case0_line1=Les avant-postes sont défendus par des tourelles et des murs ennemis. La puissance des tourelles augmente avec les récompenses qu'elles contiennent.
cutscene2_case0_line2=Pour « capturer » un avant-poste, vous devez détruire toutes les tourelles.
cutscene2_case1_line1=L'avant-poste contient un marché, des coffres de butin et des fabriques magiques (assembleuses, usines chimiques, etc.).
cutscene2_case2_line1=Les fabriques magiques ne nécessitent ni ingrédients ni électricité : elles produisent des objets gratuitement. (Celle-ci fabrique des plaques de fer.)
cutscene2_case3_line1=Vous pouvez améliorer la vitesse de fabrication au marché (local) avec des pièces. Certains marchés contiennent des objets supplémentaires.
cutscene2_case4_line1=Les biters évoluent vite (et se multiplient parfois quand on les tue !). Astuce : réduisez au minimum la pollution en utilisant les objets gratuits.
cutscene2_case5_line1=Le but de ce scénario est d'éliminer tous les biters et de lancer une fusée sur la carte de taille limitée.
cutscene2_case5_line2=Ceci conclut la visite. Bonne chance et amusez-vous bien !
replay_cutscene=Pour rejouer l'introduction, utilisez la commande __1__. Vous pouvez aussi cliquer sur l'icône d'information pour obtenir un résumé textuel.

# locale linked to the quadrants scenario
[quadrants]
on=Allumé
off=Éteint

compi_spawn_welcome=Bienvenue sur RedMew - Quadrants !\n\nUtilisez l'interface graphique dans le coin supérieur gauche pour jouer !
compi_spawn_cute=Je suis très mignon

compi_common_transfer_item=Comment transférer des objets ?\nVous pouvez utiliser des tapis souterrains pour atteindre l'autre côté\n\nVous pouvez aussi déposer des objets de l'autre côté, utilisez simplement la touche ´Z´
compi_common_chat=Votre console a-t-elle été désactivée ?\nVous pouvez discuter en utilisant la touche sous ÉCHAP\n\nVous pouvez changer cela dans Paramètres -> Contrôles -> Activer/désactiver la console Lua
compi_common_market=Un peu de monnaie ?\nAllez dépenser vos pièces durement gagnées ici, au marché
compi_common_switch=Vous pouvez changer de zone !\nIl vous suffit d'avoir un inventaire vide\n\nTenez-vous simplement près de moi et utilisez l'interface en haut à gauche pour changer
compi_common_chests=Impossible de retirer certains coffres ?\nLes joueurs qui changent de zone peuvent y laisser un coffre\n\nVous pouvez le vider pour le retirer

compi_quadrant1_welcome=Bienvenue dans Science et Militaire !\n\nCentre de commandement militaire et de l'avancement scientifique
compi_quadrant1_science=Cette zone est la seule à pouvoir faire de la recherche\n\nVous devrez importer des packs de science depuis les autres zones
compi_quadrant1_military=Vous ne pouvez fabriquer que des objets militaires dans cette zone\n\nLes autres zones dépendent de vous pour leur envoyer des objets militaires

compi_quadrant2_welcome=Bienvenue dans Intermédiaire et Minier !\n\nLe seul producteur d'acier et de circuits électroniques !
compi_quadrant2_steel=Cette zone est la seule à pouvoir produire de l'acier\n\nLes autres zones dépendent de vous pour leur envoyer de l'acier
compi_quadrant2_circuits=Cette zone est la seule à pouvoir produire des circuits\n\nVous devez les exporter vers les autres zones !
compi_quadrant2_resources=La rumeur dit :\nCette zone est particulièrement riche en ressources\n\nC'est idéal pour les opérations minières

compi_quadrant3_welcome=Bienvenue dans Pétrole et Haute Technologie !\n\nBerceau du raffinage du pétrole et de la technologie
compi_quadrant3_oil=Cette zone est la seule à pouvoir traiter le pétrole brut\n\nVous devrez peut-être importer du pétrole brut depuis les autres zones
compi_quadrant3_tech=Cette zone est la seule à pouvoir produire divers objets de haute technologie\n\nVous devrez peut-être importer beaucoup de produits intermédiaires !
compi_quadrant3_rocket=J'ai entendu dire :\nCette zone est un endroit parfait pour lancer une fusée\n\nLes autres zones peuvent vous fournir les pièces dont vous avez besoin

compi_quadrant4_welcome=Bienvenue dans Logistique et Transport\n\nBerceau du spaghetti et des gares de triage
compi_quadrant4_logistic=Cette zone est la seule à pouvoir fournir des solutions logistiques\n\nLe succès de la région dépend de l'exportation de celles-ci !
compi_quadrant4_born=Le saviez-vous ?\nMes frères et sœurs et moi sommes nés ici

popup_quadrant1_title=Centre de recherche et de commandement
popup_quadrant2_title=Production intermédiaire et minage
popup_quadrant3_title=Production pétrolière et haute technologie
popup_quadrant4_title=Production logistique
popup_quadrant1=Notre objectif principal est de fournir à la région de nouvelles découvertes scientifiques\n\nSecondairement, nous sommes le centre de commandement central\nNous fournissons à la région du matériel militaire
popup_quadrant2=Notre objectif principal est de fournir à la région des produits intermédiaires\nNous fournissons principalement des circuits électroniques de diverses densités\nNous sommes également la zone avec l'acier de la meilleure qualité !\nUne première prospection montre des ressources accrues dans cette zone
popup_quadrant3=Notre objectif principal est de fournir à la région des produits à base de pétrole\nSecondairement, nous sommes le leader technologique de la région\nNous fournissons à la région divers produits de haute technologie (et radioactifs)
popup_quadrant4=Notre objectif principal est d'offrir à la région des solutions logistiques\nNous fournissons principalement des solutions à base de tapis roulants et de robots\nNous sommes également spécialisés dans les réseaux ferroviaires haute performance !

