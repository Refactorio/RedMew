# This file holds all the locale strings for command help and descriptions
# Ideally, string keys match command names (with - turned to _)

[command_description]
reward=Donne une récompense à un joueur ciblé (supprime si la quantité est négative)
diggy_clear_void=Efface le vide dans une région donnée, mais continue de déclencher tous les événements associés à Diggy durant cet effacement.
config_restart=Ouvre la fenêtre de redémarrage du serveur depuis les configurations du serveur
restart=Redémarre la carte.
abort=Annule un redémarrage.
danger_ore_restart_condition_not_met=Il n'y a pas eu assez de [item=satellite] lancés pour redémarrer la carte.
diggy_restart_condition_not_met=Mine plus fort, nain ! Tu dois atteindre une Productivité minière de __1__ pour commencer une nouvelle aventure minière !
crash_site_restart=Redémarre le scénario crashsite.
crash_site_restart_abort=Abandonne le redémarrage du scénario crashsite.
crash_site_spy=Dépensez des pièces pour envoyer un poisson espionner l'ennemi pendant une courte durée.
crash_site_spy_invalid=Vous devez ajouter un emplacement valide pour envoyer un poisson espion. Ex. /spy [gps=-110,-17,redmew]
crash_site_spy_funds=Entraîner ces poissons espions, ce n'est pas donné ! Il vous faut plus de pièces !
crash_site_spy_success=__1__ a utilisé la commande /spy et a dépensé __2__ pièces pour entraîner un poisson à espionner l'ennemi [gps=__3__,__4__,redmew]
crash_site_airstrike_invalid=Coordonnées invalides.
crash_site_airstrike=Lance une frappe aérienne contre l'ennemi avec des capsules de poison.
crash_site_airstrike_count=Améliore les dégâts de la frappe aérienne au niveau [font=var]__1__[/font]\n\nPour utiliser la frappe aérienne, placez des capsules de poison dans le coffre d'apparition puis tapez /strike suivi d'une position gps\n\nLes améliorations de dégâts augmentent le nombre de capsules de poison lancées par la frappe aérienne.\n\n[color=255,230,192][font=default-bold]Niveau actuel :[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Nombre actuel d'obus :[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Coût actuel :[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=Améliore le rayon de la frappe aérienne au niveau [font=var]__1__[/font]\n\nPour utiliser la frappe aérienne, placez des capsules de poison dans le coffre d'apparition puis tapez /strike suivi d'une position gps\n\n[color=255,230,192][font=default-bold]Niveau actuel :[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Rayon actuel :[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]Rayon de frappe aérienne __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]Dégâts de frappe aérienne __1__\n[/font][/color]
crash_site_airstrike_not_researched=Vous n'avez pas encore recherché la frappe aérienne. Visitez le marché au point d'apparition [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=Pour envoyer une frappe aérienne, chargez __1__ capsules de poison supplémentaires dans le coffre de paiement [gps=2.5,-7.5,redmew]
crash_site_airstrike_friendly_fire_error=Vous ne voulez pas faire ça, aucun ennemi trouvé dans la zone cible.
crash_site_airstrike_damage_upgrade_success=__1__ a amélioré les dégâts de frappe aérienne au niveau __2__
crash_site_airstrike_radius_upgrade_success=__1__ a amélioré le rayon de frappe aérienne au niveau __2__
crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]Télécommande de frappe au poison\n[/font][/color]
crash_site_airstrike_planner_description=Utilisez ce plan de déconstruction pour lancer facilement une frappe au poison d'un simple clic. Mettez-le dans votre barre d'action pour un accès rapide.
crash_site_airstrike_no_enemies=Aucun ennemi trouvé à [gps=__1__,__2__,__3__]. Quel gâchis de capsules de poison !
crash_site_barrage_planner_label=[color=255,230,192][font=default-large-bold]Télécommande de ciblage de barrage\n[/font][/color]
crash_site_barrage_planner_description=Utilisez ce plan de déconstruction pour lancer facilement un barrage d'artillerie d'un simple clic. Mettez-le dans votre barre d'action pour un accès rapide.
crash_site_barrage_invalid=Coordonnées invalides.
crash_site_barrage=Lance un barrage de roquettes à tête chercheuse contre l'ennemi.
crash_site_barrage_count=Améliore les dégâts du barrage au niveau [font=var]__1__[/font]\n\nPour utiliser le barrage, placez des roquettes explosives dans le coffre d'apparition puis tapez /barrage suivi d'une position gps\n\nLes améliorations de dégâts augmentent le nombre de roquettes lancées.\n\n[color=255,230,192][font=default-bold]Niveau actuel :[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Nombre actuel de roquettes :[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Coût actuel :[/font][/color] [font=var]__4__[/font]
crash_site_barrage_radius=Améliore le rayon du barrage au niveau [font=var]__1__[/font]\n\nPour utiliser le barrage, placez des roquettes explosives dans le coffre d'apparition puis tapez /barrage suivi d'une position gps\n\n[color=255,230,192][font=default-bold]Niveau actuel :[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Rayon actuel :[/font][/color] [font=var]__3__[/font]
crash_site_barrage_radius_name_label=[color=255,230,192][font=default-large-bold]Rayon du barrage de roquettes __1__\n[/font][/color]
crash_site_barrage_count_name_label=[color=255,230,192][font=default-large-bold]Dégâts de la salve de roquettes __1__\n[/font][/color]
crash_site_barrage_not_researched=Vous n'avez pas encore recherché Barrage. Visitez le marché au point d'apparition [gps=-3,-3,redmew]
crash_site_barrage_insufficient_currency_error=Pour envoyer une salve de roquettes, chargez __1__ roquettes explosives supplémentaires dans le coffre de paiement [gps=-4.5,-7.5,redmew]
crash_site_barrage_no_nests=Aucun nid trouvé à ces coordonnées ([gps=__1__,__2__,__3__]), quel gâchis de roquettes !
crash_site_barrage_damage_upgrade_success=__1__ a amélioré les dégâts de la salve de roquettes au niveau __2__
crash_site_barrage_radius_upgrade_success=__1__ a amélioré le rayon de la salve de roquettes au niveau __2__
crash_site_rocket_tanks_name_label=[color=255,230,192][font=default-large-bold]Intervalle de tir des réservoirs de roquettes __1__\n[/font][/color]
crash_site_rocket_tank_upgrade_success=__1__ a amélioré l'intervalle de tir des réservoirs de roquettes au niveau __2__
crash_site_rocket_tanks_description=Améliorez l'intervalle de tir des réservoirs de roquettes pour réduire le temps entre deux roquettes.\n\nPlacez des roquettes dans l'inventaire du réservoir pour qu'elles ciblent automatiquement les vers et les nids ennemis.
crash_site_spider_army_decon_label=[color=255,230,192][font=default-large-bold]Planificateur de groupement d'armée de spidertrons\n[/font][/color]
crash_site_spider_army_decon_description=Utilisez ce planificateur de déconstruction pour regrouper rapidement des spidertrons en une armée. D'abord, sélectionnez en mode groupe une zone contenant vos spidertrons. Ensuite, cliquez une seule fois avec le bouton gauche sur le spidertron cible que votre groupe devra suivre.
max_level=(NIVEAU MAX)
dataset_copy=Copie un jeu de données
dataset_move=Déplace un jeu de données
dataset_delete=Efface un jeu de données
dataset_transform=Transforme un jeu de données et l'écrit vers le jeu de données cible. Appelle storage.transform_function et envoie la table des entrées pour obtenir une table en retour.
dataset_transform_test=Affiche le jeu de données résultant d'une opération de transformation. Voir /help dataset-transform pour plus d'informations.
report=Signale un utilisateur aux administrateurs
kill=Vous tuera.
afk=Montre combien de temps les joueurs ont été inactifs.
zoom=Définit votre zoom.
find=Affiche une alerte sur la carte où le joueur est localisé
show_rail_block=Basculer la visualisation des tronçons ferroviaires.
server_time=Affiche l'heure du serveur.
seeds=Liste des seeds de toutes les surfaces
redmew_version=Affiche la version du scénario Redmew
whois=Fournit des informations sur un joueur donné, les administrateurs peuvent voir l'inventaire d'un joueur en ajoutant "yes" comme second argument
clear_corpses=Nettoie les cadavres autour du joueur (Regular ou supérieur). Utilisez /clear_corpses surface ou /clear_corpses s pour effacer tous les cadavres de la surface (Admin uniquement).
meltdown_get=Récupère le statut de la fusion.
meltdown_set=Définit l'état de la fusion.
redmew_color=Initialiser enregistrera votre couleur actuelle pour les futures cartes. Réinitialiser effacera la couleur enregistrée. Générer aléatoirement vous donnera une couleur aléatoire.
performance_scale_set=Définit l'échelle de performance entre 0,05 et 1. Cela modifiera la vitesse du jeu, la vitesse de minage manuel, la vitesse de fabrication manuelle et la vitesse de course du personnage par force.
performance_scale_get=Affiche l'échelle de performance actuelle.
permissions_reset=Utilisez "/permissions-reset" pour rétablir les permissions par défaut de tous les joueurs
permissions_set_scenario=Utilisez "/permissions-set-scenario" pour réappliquer les permissions du scénario, s'il y en a
market=Place un marché proche de vous. Utiliser /market removeall pour supprimer tous les marchés sur une carte
lazy_bastard_bootstrap=Place les éléments minimum requis pour démarrer
toast=Envoie un toast à tous les joueurs
toast_player=Envoie un toast à un joueur spécifique
sent_all_toast=__1__ a envoyé un toast à tous les joueurs
sent_player_toast=__1__ a envoyé un toast à __2__
task=Crée une nouvelle tâche.
tag=Affecte l'étiquette d'un joueur
popup=Affiche une notification à tous les joueurs connectés
popup_update=Affiche une notification mise à jour pour tous les joueurs connectés
popup_player=Affiche une notification à ce joueur.
poll=Crée un nouveau sondage
poll_result=Affiche le résultat pour le numéro de sondage donné.
debug=Ouvre le débogueur
watch=Vous permet de regarder d'autres joueurs.
donator_welcome_message=Ajoute, supprime ou liste les messages de bienvenue des donateurs.
donator_death_message=Ajoute, supprime ou liste les messages de mort des donateurs.
reveal=Révèle le rayon autour de l'utilisateur
particle_scale=Fournir une fraction entre 0 et 1 pour diminuer ou augmenter la quantité de particules (max). Laisser vide pour voir les valeurs courantes.
apocalypse=Cela termine la carte. Quand vous le lancez la première fois, le jeu se sauvegardera. Quand vous l'exécutez une seconde fois, l'apocalypse commencera.
a=Chat administrateur. Envoie un message à tous les autres administrateurs.
dc=commande silencieuse
hax=Bascule votre hax (les recettes ne coûtent rien)
regular=Donne à un joueur le rang régulier.
regular_remove=Rétrograde un joueur de rang régulier au rang inférieur suivant
probation=Mettre un joueur en probation. (Il ne sera pas en mesure d'utiliser des commandes redmew et ne gagnera jamais un rang de confiance automatique.)
probation_remove=Retirer le joueur de la probation.
showreports=Affiche les rapports des utilisateurs
jail=Envoie un joueur en prison
unjail=Retire un joueur de prison
pool=Génère une réserve d'eau
invoke=Téléporte le joueur vers vous.
tp=Si vide, se téléporte vers l'entité sélectionnée. mode = bascule le mode tp, dans lequel vous pouvez vous téléporter vers un fantôme placé. player = se téléporte vers le joueur.
revive_ghosts=Ranime les fantômes à l'intérieur du rayon défini autour de vous
destroy=Détruit l'entité sous votre curseur lorsque vous exécutez cette commande
quick_bar_save=Sauvegarde vos [color=yellow]barres de raccourcis[/color] côté serveur pour les futures cartes
quick_bar_load=Charge vos [color=yellow]barres de raccourcis[/color] depuis le serveur (en écrasant les barres existantes)
quick_bar_delete=Efface du serveur vos [color=yellow]barres de raccourcis[/color] enregistrées
logistic_requests_save=Sauvegarde vos [color=blue]requêtes logistiques[/color] côté serveur pour les prochaines cartes
logistic_requests_load=Charge vos [color=blue]requêtes logistiques[/color] depuis le serveur (en écrasant les barres existantes)
logistic_requests_delete=Efface vos [color=blue]requêtes logistiques[/color] sauvegardées du serveur
set_pollution_multiplier=EXPÉRIMENTAL. Un nombre entier qui est multiplié par 0.01 pour donner la quantité de pollution émise par les fabriques magiques du crash site. La valeur par défaut est 0
get_pollution_multiplier=Le multiplicateur de pollution actuel du crash site. La valeur par défaut est 0.
perks=Liste les donateurs Patreon qui contribuent aux avantages actuellement actifs.
generate_desc=Génère le nom du serveur, la description et les tags à coller dans l'interface /config
radio=Ouvre la fenêtre de la radio
rich_text=Ouvre l'interface de texte enrichi
rpg_stats=Affiche les statistiques du joueur
rpg_update=Met à jour les statistiques RPG et l'interface du joueur ciblé
rpg_leaderboard=Affiche le classement RPG
calculator_tech=Calcule le coût en packs scientifiques pour rechercher la technologie ciblée
calculator_tech_player=Calcule le coût en packs scientifiques pour rechercher la technologie ciblée pour le joueur ciblé
af_reset=Réinitialise toutes les fonctionnalités
af_debug=Affiche le niveau actuel de toutes les fonctionnalités
af_max=Définit toutes les fonctionnalités à leur niveau maximal respectif
frontier_ping_silo=Signale la position du silo sur la carte
frontier_toggle_debug_ai=Active/désactive le mode débogage de l'IA
frontier_toggle_debug_shop=Active/désactive le mode débogage de la boutique
frontier_print_global=Affiche la table global
frontier_log_global=Journalise la table global
moderator=Donne à un joueur le rang de modérateur
moderator_remove=Rétrograde un joueur du rang de modérateur au rang inférieur suivant
regular_all=Donne à tous les joueurs connectés le rang régulier, sauf ceux en probation
blueprint_tools=Ouvre l'interface de gestion des outils de plan
inventory=Affiche l'inventaire du joueur ciblé. Si aucun joueur n'est fourni, tous les inventaires sont affichés.

[command_custom_help]
tp=<blank|mode|player> 3 utilisations différentes: "/tp" pour se téléporter vers l'entité sélectionnée, "/tp mode" pour basculer le mode tp, "/tp Newcott" pour se téléporter à Newcott.
poll=<{question = "question", answers = {"réponse 1", "réponse 2"}, duration = 300}>
module_only=Disponible uniquement avec le module correspondant activé
