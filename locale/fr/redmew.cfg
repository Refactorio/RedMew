description=[font=default-bold]RedMew est une communauté Factorio qui héberge des serveurs personnalisés, des cartes de formes et de tailles variées, des scénarios scriptés et des serveurs moddés.[/font]\nNotre scénario propose plus de 100 cartes différentes, et vous pouvez sélectionner celle de votre choix en suivant les étapes ci-dessous :\n\n[color=green]Mode simple : visitez[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Mode expert : modifiez map_selection.lua dans le dossier du scénario[/color]\nPour plus de détails sur chaque carte, consultez la liste sur [color=blue]redmew.com/maps[/color]\n\nLiens utiles : Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Merci d'avoir choisi Redmew, un scénario par Refactorio ![/color]
