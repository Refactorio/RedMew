# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew Info[/color][/font]\n Communauté, règles, fonctionnalités et infos de la carte
welcome_header=Bienvenue sur RedMew !
welcome_text=Redmew est une communauté pour les joueurs de tous les niveaux de compétences engagés à pousser les limites de Factorio Multiplayer à travers des scénarios personnalisés et des mondes de jeux géniaux.\n\nNous sommes un groupe amical, notre objectif est de nous amuser autant que possible et nous espérons que vous le ferez aussi.
chatting_header=Comment discuter
chatting_text=Pour discuter avec les autres joueurs, appuyez sur la touche __CONTROL__toggle-console__ de votre clavier.\nLa touche par défaut sur les claviers anglais est l'accent grave (`) et se trouve sous la touche ESC.\nCela peut être modifié dans __1__ -> __2__ -> __3__.
free_coin_header=Pièces Gratuites
free_coin_text=Vous avez reçu __1__ __2__ pour avoir consulté l'onglet d'accueil.\nConsulter chaque onglet vous rapportera __1__ __2__ supplémentaires.\n
free_coin_print=__1__ __2__ accordés pour la lecture d'un onglet sur l'écran d'information.
links_header=Liens utiles
links_discord=Consultez notre Discord pour les informations sur les nouvelles cartes et pour suggérer de nouvelles cartes / idées.
links_patreon=Contribuez à notre Patreon pour recevoir des avantages spéciaux et aider à maintenir nos serveurs.
links_saves=Téléchargez nos cartes, leur état de début et de fin de partie, depuis notre site web.
links_factoriomaps=Visualisez nos cartes passées sous forme de Google Map.
rules_header=Règles
rules_text=Amusez-vous et jouez gentiment. N'oubliez pas que nous sommes tous là pour nous amuser, alors gardons les choses ainsi.\n\nAucun contenu haineux ni attaque personnelle.\n\nSi vous suspectez quelqu'un de griefing, avertissez l'équipe d'administration en utilisant /report ou en cliquant sur le bouton de signalement à côté du joueur dans la liste des joueurs.
rules_text_danger_ore=Si la construction d'un autre joueur doit être modifiée ou retirée, une discussion d'équipe ou un vote/sondage est nécessaire avant la modification ou le retrait.\n\nUne discussion d'équipe ou un vote/sondage n'est pas nécessaire si le joueur qui l'a construite est en ligne et accepte la modification ou le retrait.\n\nLe changement des modules à l'échelle de la carte et l'amélioration des tapis roulants doivent être soumis au vote de l'équipe avant toute modification ou amélioration.\n\nEn cas de vote/sondage d'équipe, la majorité l'emporte.\n\nSeuls 1 ou 2 joueurs en ligne ne suffisent pas pour une discussion d'équipe ou un vote/sondage. Pourtant, la modification ou le retrait d'une construction peut s'avérer nécessaire pour que la base fonctionne bien. Un message doit alors être laissé sur le chat en jeu indiquant que vous modifiez ou retirez une construction, et pourquoi cela doit être fait. Le simple fait de dire que votre conception ou construction est meilleure ou plus jolie ne suffit pas.
map_info_button=Infos sur la carte
map_info_header=Informations de la carte
map_name_label=Nom de la carte :
map_desc_label=Description de la carte :
map_extra_info_label=Informations supplémentaires :
softmods_button=Fonctionnalités
softmods_header=Fonctionnalités et plugins du serveur
softmods_rank_text=Nous avons un système de rangs basique pour prévenir le griefing. Vous ne pouvez pas utiliser de bombes nucléaires ni le plan de déconstruction si vous êtes invité. Si vous jouez pendant quelques heures, un administrateur vous promouvra au rang de régulier. Vous pouvez aussi demander une promotion à un administrateur si vous travaillez sur un projet qui l'exige.\n
softmods_rank_is=Votre rang est :
softmods_market_label=Marché
softmods_market_text=Sur la plupart des cartes, vous trouverez un marché près du point d'apparition où vous pouvez faire des achats avec des pièces. Les pièces s'obtiennent en abattant des arbres, en fabriquant des objets à la main et en détruisant les nids de biters. La plupart des articles du marché sont constants, mais certains dépendent de la carte (généralement le remblai) et changent de temps en temps.
softmods_saviour_label=Sauveur de trains
softmods_saviour_text=Les trains sont le pire ennemi des joueurs de Factorio. Si vous avez au moins un portail de joueur dans votre inventaire et que vous êtes tué par un train, votre vie sera épargnée mais vous perdrez un portail de joueur. Vous pouvez obtenir des portails de joueur au marché.
softmods_plist_label=Liste des joueurs
softmods_plist_text=Liste tous les joueurs présents sur le serveur et affiche quelques statistiques. Vous pouvez trier la liste en cliquant sur les en-têtes de colonnes. Vous pouvez aussi faire un poke aux gens, ce qui lance un nom aléatoire dans le chat.
softmods_polls_label=Sondages
softmods_polls_text=Les sondages aident les joueurs à obtenir un consensus pour les actions importantes. Vous voulez améliorer une construction importante ? Faites un sondage pour vérifier que tout le monde est d'accord. Vous devez être régulier pour créer de nouveaux sondages.
softmods_tags_label=Étiquettes
softmods_tags_text=Vous pouvez vous attribuer un rôle avec des étiquettes pour indiquer aux autres joueurs ce que vous faites. Ou utilisez simplement l'étiquette comme décoration. Les réguliers peuvent créer de nouvelles étiquettes personnalisées, n'hésitez pas à montrer votre créativité.
softmods_tasks_label=Tâches
softmods_tasks_text=Vous ne savez pas sur quoi travailler ? Pourquoi ne pas regarder les tâches et voir ce qui doit être fait. Les réguliers peuvent ajouter de nouvelles tâches.
softmods_bp_label=Assistant\nBP
softmods_bp_text=L'assistant de plans de construction™ vous permet de retourner les plans horizontalement ou verticalement et de\nconvertir les entités utilisées dans le plan, p. ex. transformer des tapis jaunes en tapis rouges.
softmods_score_label=Score
softmods_score_text=Affiche le nombre de fusées lancées, de biters libérés, d'entités construites et bien plus !
softmods_shortcuts_label=Raccourcis
softmods_shortcuts_text=Les raccourcis du joueur sont des boutons faciles d'accès qui fournissent des outils utiles. Nettoyez les cadavres de biters du sol, rangez votre inventaire dans les coffres/fours à proximité, rechargez vos batteries équipées depuis les accumulateurs voisins et bien plus encore.
softmods_production_hud_label=HUD Prod.
softmods_production_hud_text=Le HUB de production est une fenêtre de statistiques de production qui peut rester affichée en permanence à l'écran. Ajoutez/retirez des objets de la liste suivie et assurez-vous que l'usine est bien alimentée !
softmods_train_station_teleport_label=Téléporteur
softmods_train_station_teleport_text=Le Train Station Teleport permet aux joueurs de se téléporter instantanément entre les [entity=train-stop] de la carte. Il vous suffit de vous tenir à proximité d'un [entity=train-stop], puis, depuis la vue de la carte, d'ouvrir un autre [entity=train-stop] et de vous y téléporter grâce à son bouton de téléportation.
softmods_autofill_label=Remplissage auto
softmods_autofill_text=Dépose automatiquement des munitions lors de la construction de tourettes. Peut être configuré pour filtrer les types et la quantité de munitions.
softmods_paint_brush_label=Pinceau
softmods_paint_brush_text=L'usine doit s'étendre ! ...avec style
whats_new_button=Nouveautés

