player_management=Набір модераційних дій, спрямованих на одного чи всіх гравців. \nВикористовуйте підвищення та пониження за потреби, щоб розряджати найскладніші ситуації. \nВикористовуйте mute, purge, spank, invoke, щоб вирішувати проблеми безпосередньо із залученими гравцями.
player_kick_and_ban=Допоміжне вікно для кіку/бану гравців із зазначенням причини та посилання на звернення на нашому головному порталі. \nВиберіть причини або додайте власну в текстовому полі, щоб скласти звіт.
map_manager=Набір інструментів для зміни навколишнього середовища навколо вас
map_game_speed=Використовуйте швидкість продуктивності, щоб зменшити швидкість гри, не послаблюючи статистику гравців. \nУповільнення/прискорення діє безпосередньо на швидкість сервера
map_pollution=Редагування налаштувань забруднення карти
map_evolution=Редагування налаштувань еволюції карти
map_expansion=Набір допоміжних методів для розвідки, очищення та контролю карти навколо вас
