# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=Печера обвалилася!
cave_collapse_warning=Здобувати такі споруди, як стіни, кам'яні стежки, бетон\nі каміння, може спричинити обвал, будьте обережні, шахтар!\n\nПорада десятника: Ставте стіну на кожному 4-му тайлі, щоб\nзапобігти обвалу. Використовуйте кам'яні стежки та бетон,\nщоб ще більше зміцнити її.

night_time_warning=Розміщення сонячних панелей під землею, здається,\nне впливає на виробництво енергії!\nДослідження показують, що те саме стосується і портативної версії!\n\nПорада десятника: Сонячні панелі корисні лише для виготовлення\nсупутників

cracking_sound_1=Б І Ж І Т Ь,  В И   Д У Р Н І !
cracking_sound_2=Т Р І С К

score_cave_collapses=Обвали печер
score_mine_size=Розмір шахти

auto_play_cutscene=Автоматичне відтворення вступного ролика Diggy
cutscene_case_line2=Ласкаво просимо до __1__
cutscene_case_line4=Це власний сценарій, розроблений __1__
cutscene_case_line5=Приєднуйтесь до нас на __1__
cutscene_case_line6=Наступний вступ допоможе вам розпочати!
cutscene_case_line7=Якщо під час цього вступного ролика виникнуть проблеми, повідомте нам
cutscene_case0_line1=Це початкова зона
cutscene_case0_line3=Розширювати шахту небезпечно!
cutscene_case1_line1=Стіни використовуються, щоб дах печери нас не роздавив
cutscene_case2_line1=Ринок надає додаткові припаси в обмін на монети
cutscene_case2_line3=Ви розблоковуєте нові предмети, коли підвищуєте рівень
cutscene_case3_line1=Обвали печер трапляються часто, якщо не встановлювати підпори
cutscene_case3_line3=Різні типи цегли та бетону можуть зміцнити наші опорні стовпи!
cutscene_case4_line1=Цей світ містить крихкі породи
cutscene_case4_line3=Наші інструменти занадто потужні, щоб вберегти якісь ресурси від знищення
cutscene_case5_line1=Більшість дій дають досвід!
cutscene_case5_line3=Текст, що спливає, вказує кількість і причину отримання досвіду
cutscene_case6_line1=Тубільці підстерігають у темряві
cutscene_case6_line3=Будьте обережні під час копання, завжди беріть із собою захист
cutscene_case7_line1=На цьому вступ завершується
cutscene_case7_line3=Розважайтеся та копайте далі!
replay_cutscene=Щоб повторно переглянути вступ, використайте команду __1__

blueprint_tools_tooltip=Показати інструменти креслень

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Автоматичне відтворення вступного ролика Crashsite
cutscene1_case_line2=Ласкаво просимо до __1__
cutscene1_case_line4=Це власний сценарій, розроблений __1__
cutscene1_case_line5=Приєднуйтесь до нас на __1__
cutscene1_case_line6=Наступний вступ допоможе вам розпочати гру!
cutscene1_case0_line3=Це наша панель інструментів!
cutscene1_case0_line4=Тут ви знайдете широкий вибір інструментів та інформацію про нас!
cutscene1_case0_line5=Наведіть мишку на них, щоб дізнатися більше
cutscene1_case0_line6=Цією кнопкою ви можете ввімкнути або вимкнути нашу панель інструментів
cutscene1_case1_line1=Це стартова зона. Тут є ринок і монетний двір.
cutscene1_case1_line2=Монетний двір виробляє монети з обмеженою швидкістю, яку можна підвищити на ринку.
cutscene1_case1_line3=Монети також можна отримати, вбиваючи кусюків, плювачів, хробаків і гнізда.
cutscene1_case2_line1=За монети можна купувати предмети на ринку.
cutscene1_case3_line1=Разом із родовищами руди та стіною це ваша точка появи. А тепер — до аванпостів.

cutscene2_case_line1=Це "Аванпост". Вони бувають різних форм і розмірів, з усім — від залізних пластин до броні MK2.
cutscene2_case_line2=На карті ви знайдете багато схожих на цю споруд.
cutscene2_case0_line1=Аванпости захищені ворожими турелями та стінами. Сила турелей зростає разом із винагородою всередині.
cutscene2_case0_line2=Щоб "захопити" аванпост, потрібно знищити всі турелі.
cutscene2_case1_line1=Аванпост містить ринок, скрині з трофеями та чарівні верстати (збирачі, хімічні заводи тощо).
cutscene2_case2_line1=Чарівні верстати не потребують ні сировини, ні електрики — вони виробляють предмети безкоштовно. (Цей робить залізні пластини.)
cutscene2_case3_line1=Швидкість виготовлення можна підвищити за монети на (локальному) ринку. Деякі ринки містять додаткові предмети.
cutscene2_case4_line1=Кусюки швидко еволюціонують (а іноді й розмножуються, коли їх убиваєш!). Порада: тримайте забруднення на мінімумі, користуючись безкоштовними предметами.
cutscene2_case5_line1=Мета цього сценарію — знищити всіх кусюків і запустити ракету на карті обмеженого розміру.
cutscene2_case5_line2=На цьому огляд завершено. Успіхів і приємної гри!
replay_cutscene=Щоб повторно переглянути вступ, скористайтеся командою __1__. Також можна натиснути на піктограму інформації, щоб побачити текстовий підсумок.

# locale linked to the quadrants scenario
[quadrants]
on=Увімкнено
off=Вимкнено

compi_spawn_welcome=Вітаємо у Redmew - Quadrants!\n\nГрайте за допомогою GUI у верхньому лівому куті!
compi_spawn_cute=Я дуже милий

compi_common_transfer_item=Як передати предмети?\nВи можете використати підземні конвеєри, щоб дістатися до іншого боку\n\nТакож можна перекинути предмети через межу — просто натисніть клавішу ´Z´
compi_common_chat=Вас позбавили слова?\nВи можете спілкуватися в чаті за допомогою клавіші під ESC\n\nЦе можна змінити в Налаштування -> Керування -> Toggle Lua console
compi_common_market=Є зайва дрібничка?\nВитрачайте свої важко зароблені монети тут, на ринку
compi_common_switch=Ви можете перейти в іншу зону!\nДля цього потрібно лише порожній інвентар\n\nПросто станьте поруч зі мною та скористайтеся GUI у верхньому лівому куті, щоб перейти
compi_common_chests=Не вдається прибрати якісь скрині?\nГравці, які переходять в іншу зону, можуть залишити після себе скриню\n\nВи можете спорожнити її, щоб прибрати

compi_quadrant1_welcome=Вітаємо у зоні Науки та Військової справи!\n\nКомандний центр військового та наукового розвитку
compi_quadrant1_science=Лише ця зона може проводити дослідження\n\nДоведеться імпортувати наукові пакети з інших зон
compi_quadrant1_military=У цій зоні можна виготовляти лише військові предмети\n\nІнші зони залежать від того, що ви надсилатимете їм військові предмети

compi_quadrant2_welcome=Вітаємо у зоні Проміжних матеріалів і Видобутку!\n\nЄдиний виробник сталі та електронних схем!
compi_quadrant2_steel=Лише ця зона може виробляти сталь\n\nІнші зони залежать від того, що ви надсилатимете їм сталь
compi_quadrant2_circuits=Лише ця зона може виробляти схеми\n\nПотрібно експортувати їх в інші зони!
compi_quadrant2_resources=Чутки кажуть:\nЦя місцевість особливо багата на ресурси\n\nВона ідеально підходить для видобувних робіт

compi_quadrant3_welcome=Ласкаво просимо до Нафти та Високих Технологій!\n\nТут займаються переробкою нафти та розробкою технологій
compi_quadrant3_oil=Це єдина зона, яка може переробляти сиру нафту\n\nМожливо, вам доведеться імпортувати сиру нафту з інших зон
compi_quadrant3_tech=Це єдина зона, яка може виробляти різноманітні високотехнологічні вироби\n\nМожливо, вам доведеться імпортувати багато проміжних продуктів!
compi_quadrant3_rocket=Я чув:\nЦе ідеальне місце для запуску ракети\n\nІнші зони нададуть вам потрібні деталі

compi_quadrant4_welcome=Ласкаво просимо до Логістики та Транспорту\n\nБатьківщина спагеті та залізничних вузлів
compi_quadrant4_logistic=Це єдина зона, яка може надавати логістичні рішення\n\nУспіх регіону залежить від того, чи будете ви їх експортувати!
compi_quadrant4_born=А ви знали?\nМи з моїми братами й сестрами народилися тут

popup_quadrant1_title=Дослідницько-командний центр
popup_quadrant2_title=Виробництво проміжних продуктів і видобуток
popup_quadrant3_title=Виробництво нафти та високих технологій
popup_quadrant4_title=Логістичне виробництво
popup_quadrant1=Наше головне завдання — постачати регіону нові наукові відкриття\n\nКрім того, ми є центральним командним вузлом\nМи постачаємо регіону військову техніку
popup_quadrant2=Наше головне завдання — постачати регіону проміжні продукти\nНасамперед ми забезпечуємо електронними схемами різної щільності\nУ нас також найякісніша сталь!\nПочаткове обстеження показало збільшені поклади ресурсів у цій зоні
popup_quadrant3=Наше головне завдання — постачати регіону продукти з нафти\nКрім того, ми — технологічний лідер регіону\nМи постачаємо регіону різноманітні високотехнологічні (та радіоактивні) продукти
popup_quadrant4=Наше головне завдання — постачати регіону логістичні рішення\nНасамперед ми забезпечуємо рішеннями на основі конвеєрів та роботів\nМи також спеціалізуємося на високопродуктивних залізничних мережах!

switch_notice1=## - Ви заважкі для телепортації! Спорожніть інвентар перед переходом до іншого квадранта!
