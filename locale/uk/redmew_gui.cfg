# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]Інформація RedMew[/color][/font]\n Спільнота, правила, функції, інформація про мапу
welcome_header=Ласкаво просимо до Redmew!
welcome_text=Redmew - це товариство гравців різного рівня майстерності, які намагаються розширити межі багатокористувацької гри в Factorio за допомогою різних скриптів та божевільних мап.\n\nМи дружні, нашою метою є отримання максимального задоволення від гри. Сподіваємось що й вам сподобається.
chatting_header=Як спілкуватися
chatting_text=Для спілкування з іншими гравцями натисніть клавішу __CONTROL__toggle-console__ на клавіатурі.\nЗа замовчуванням на англійських клавіатурах це клавіша зворотного апострофа (`), розташована під клавішею ESC.\nЇї можна змінити в __1__ -> __2__ -> __3__.
free_coin_header=Безкоштовні монети
free_coin_text=Ви отримали __1__ __2__ за перегляд вкладки вітання.\nПеревірка кожної вкладки принесе вам ще __1__ __2__.\n
free_coin_print=__1__ __2__ нагороджено за прочитання вкладки на інформаційному екрані.
links_header=Корисні посилання
links_discord=Відвідайте наш discord для отримання інформації про нові мапи або запропонуйте свої мапи/ідеї.
links_patreon=Приєднуйтеся до нашого Patreon, щоб отримувати особливі переваги та допомагати підтримувати наші сервери.
links_saves=Завантажуйте наші мапи у початковому та фінальному стані з нашого сайту.
links_factoriomaps=Перегляньте наші минулі карти через Google Map.
rules_header=Правила
rules_text=Отримуйте задоволення від гри та поводьтеся пристойно. Пам'ятайте, ми всі тут лише щоб розважатися, тож давайте зберігати цю атмосферу.\n\nЖодного ненависницького контенту чи особистих нападок.\n\nЯкщо ви підозрюєте когось у гриферстві, повідомте про це адміністраторів командою /report або натисніть кнопку звіту поруч із гравцем у списку гравців.
rules_text_danger_ore=Якщо потрібно змінити або видалити чиюсь побудову, перед зміною чи видаленням потрібне командне обговорення або голосування.\n\nКомандне обговорення чи голосування не потрібні, якщо гравець, який це збудував, онлайн і погоджується на зміну чи видалення.\n\nМасова заміна модулів по всій карті та покращення конвеєрів мають бути затверджені командним голосуванням до внесення змін.\n\nУ разі командного голосування перемагає більшість.\n\nЛише 1 або 2 гравці онлайн — цього недостатньо для командного обговорення чи голосування. Проте для безперебійної роботи бази зміна чи видалення побудови можуть бути необхідними. Тоді слід залишити повідомлення в ігровому чаті про те, що ви змінюєте чи видаляєте побудову, і чому це потрібно. Простого твердження, що ваша конструкція краща чи гарніша на вигляд, недостатньо.
map_info_button=Інформація про мапу
map_info_header=Інформація про мапу
map_name_label=Назва мапи:
map_desc_label=Опис мапи:
map_extra_info_label=Додаткова інформація:
softmods_button=Модифікації сценарію
softmods_header=Програмні модифікації та серверні додатки
softmods_rank_text=У нас є проста система рангів для запобігання гриферству. Ви не зможете використовувати ядерну зброю чи планувальник деконструкції, поки ви гість. Після кількох годин гри адміністратор підвищить вас до звичайного рангу. Ви також можете попросити адміністратора про підвищення, якщо працюєте над проєктом, який цього вимагає.\n
softmods_rank_is=Ваш ранг:
softmods_market_label=Ринок
softmods_market_text=На більшості карт біля спавну ви знайдете ринок, де можна робити покупки за монети. Монети отримують за зрубані дерева, виготовлення предметів вручну та знищення гнізд кусюків. Більшість предметів на ринку постійна, але деякі є специфічними для мап (зазвичай насип) і час від часу з'являються та зникають.
softmods_saviour_label=Поїзд-рятівник
softmods_saviour_text=Потяги — найлютіший ворог гравця Factorio. Якщо у вашому інвентарі є щонайменше один портал гравця і вас збиває потяг, ваше життя буде врятовано, але ви втратите портал гравця. Портали гравця можна придбати на ринку.
softmods_plist_label=Список гравців
softmods_plist_text=Показує всіх гравців на сервері та деяку статистику. Список можна відсортувати, натиснувши на заголовки стовпців. Також можна «тикати» інших гравців — у чат викидається випадковий іменник.
softmods_polls_label=Опитування
softmods_polls_text=Опитування допомагають гравцям досягати згоди щодо важливих дій. Хочете покращити важливу будівлю? Створіть опитування, щоб переконатися, що всі згодні. Створювати нові опитування можуть лише постійні гравці.
softmods_tags_label=Мітки
softmods_tags_text=Ви можете призначити собі роль через мітки, щоб інші гравці знали, чим ви займаєтеся. Або просто використайте мітку як прикрасу. Постійні гравці можуть створювати власні мітки — не соромтеся показати свою креативність.
softmods_tasks_label=Завдання
softmods_tasks_text=Не знаєте, чим зайнятися? Чому б не поглянути на завдання, щоб побачити, що потрібно зробити. Постійні гравці можуть додавати нові завдання.
softmods_bp_label=BP\nпомічник
softmods_bp_text=Помічник креслень™ дозволяє віддзеркалювати креслення по горизонталі або вертикалі та\nперетворювати об'єкти в кресленні, наприклад жовті конвеєри на червоні.
softmods_score_label=Бали
softmods_score_text=Показує кількість запущених ракет, звільнених кусюків, збудованих об'єктів і багато іншого!
softmods_shortcuts_label=Швидкі дії
softmods_shortcuts_text=Швидкі дії гравця — це кнопки швидкого доступу, що надають корисні інструменти. Прибирайте тіла кусюків із землі, розкладайте інвентар по сусідніх скринях/печах, підзаряджайте батареї в екіпіруванні від найближчих акумуляторів і не тільки.
softmods_production_hud_label=Прод. HUD
softmods_production_hud_text=Панель виробництва — це вікно статистики виробництва, яке можна постійно тримати на екрані. Додавайте/прибирайте предмети у списку відстежуваних і стежте, щоб фабрика отримувала достатньо ресурсів!
softmods_train_station_teleport_label=Телепорт
softmods_train_station_teleport_text=Телепортація між залізничними станціями дозволяє гравцеві миттєво переміщатися між [entity=train-stop] по всій карті. Все, що потрібно, — стати поруч із [entity=train-stop], а потім у режимі мапи відкрити інший [entity=train-stop] і натиснути кнопку телепортації.
softmods_autofill_label=Автозаповнення
softmods_autofill_text=Автоматично додає боєприпаси під час будівництва турелей. Можна налаштувати фільтрацію типів і кількості боєприпасів.
softmods_paint_brush_label=Пензлик
softmods_paint_brush_text=Фабрика має рости! ...і зі стилем
whats_new_button=Що нового

