diggy_restart_condition_not_met=Копай старанніше, гноме! Тобі потрібно досягти рівня Продуктивність копання __1__, щоб розпочати нову копальницьку пригоду!
crash_site_restart=Перезапускає сценарій Crashsite.
crash_site_restart_abort=Скасовує перезапуск сценарію Crashsite.
crash_site_spy=Витратьте монети, щоб відправити рибу шпигувати за ворогом на короткий час.
crash_site_spy_invalid=Ви повинні вказати дійсне місце, щоб надіслати рибу-шпигуна. Наприклад /spy [gps=-110,-17,redmew]
crash_site_spy_funds=Тренування цих шпигунських риб не дешеві! Вам потрібно більше монет!
crash_site_spy_success=__1__ використав команду /spy і витратив __2__ монет, щоб навчити рибу шпигувати за ворогом [gps=__3__,__4__,redmew]
crash_site_airstrike_invalid=Невірні координати.
crash_site_airstrike=Запустити повітряний удар проти ворога з отруйними капсулами.
crash_site_airstrike_count=Покращуйте пошкодження авіаудару до рівня [font=var]__1__[/font]\n\nЩоб використати авіаудар, покладіть отруйні капсули в скриню спавну, а потім введіть /strike, вказавши gps-позицію\n\nПокращення пошкоджень збільшують кількість отруйних капсул, запущених авіаударом.\n\n[color=255,230,192][font=default-bold]Поточний рівень:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Поточна кількість капсул:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Поточна вартість:[/font][/color] [font=var]__4__[/font]
crash_site_airstrike_radius=Покращує радіус авіаудару до рівня [font=var]__1__[/font]\n\nЩоб використати авіаудар, покладіть отруйні капсули в скриню спавну, а потім введіть /strike, вказавши gps-позицію\n\n[color=255,230,192][font=default-bold]Поточний рівень:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Поточний радіус:[/font][/color] [font=var]__3__[/font]
crash_site_airstrike_radius_name_label=[color=255,230,192][font=default-large-bold]Радіус авіаудару __1__\n[/font][/color]
crash_site_airstrike_count_name_label=[color=255,230,192][font=default-large-bold]Пошкодження авіаудару __1__\n[/font][/color]
crash_site_airstrike_not_researched=Ви ще не дослідили авіаудар. Відвідайте ринок на спавні [gps=-3,-3,redmew]
crash_site_airstrike_insufficient_currency_error=Щоб надіслати авіаудар, завантажте ще __1__ отруйних капсул у платіжну скриню [gps=2.5,-7.5,redmew]
crash_site_airstrike_friendly_fire_error=Вам не варто цього робити: у цільовій зоні не знайдено ворогів.
crash_site_airstrike_damage_upgrade_success=__1__ покращив пошкодження авіаудару до рівня __2__
