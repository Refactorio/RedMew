crash_site_rocket_tank_upgrade_success=__1__ покращив інтервал вогню Танку Ракет до рівня __2__
crash_site_rocket_tanks_description=Покращуйте інтервал стрільби ракетних танків, щоб зменшити час між ракетами.\n\nПокладіть ракети в інвентар танка, щоб вони автоматично цілитися у ворожих червів і гнізда.
crash_site_spider_army_decon_label=[color=255,230,192][font=default-large-bold]Планувальник групування армії павукотронів\n[/font][/color]
crash_site_spider_army_decon_description=Використовуйте цей планувальник деконструкції, щоб швидко зібрати павукотронів в армію. По-перше, рамкою виділіть область із вашими павукотронами. По-друге, одним клацанням лівої кнопки вкажіть цільового павукотрона, за яким слідуватиме ваша група.
