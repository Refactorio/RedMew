[command_custom_help]
tp=<blank|mode|player> 3 різні застосування: "/tp" — телепорт до вибраного об'єкта. "/tp mode" — перемикання режиму телепортації. "/tp Newcott" — телепорт до Newcott.
poll=<{question = "питання", answers = {"відповідь 1", "відповідь 2"}, duration = 300}>
module_only=Доступно лише з увімкненим відповідним модулем
