crash_site_airstrike_planner_label=[color=255,230,192][font=default-large-bold]Пульт наведення отруйного удару\n[/font][/color]
crash_site_airstrike_planner_description=Використовуйте цей планувальник деконструкції, щоб легко запустити отруйний удар одним клацанням. Покладіть його на панель швидкого доступу для зручності.
crash_site_airstrike_no_enemies=Ворогів не знайдено в [gps=__1__,__2__,__3__]. Яка марна витрата отруйних капсул!
crash_site_barrage_planner_label=[color=255,230,192][font=default-large-bold]Пульт наведення залпу\n[/font][/color]
crash_site_barrage_planner_description=Використовуйте цей планувальник деконструкції, щоб легко запустити артилерійський залп одним клацанням. Покладіть його на панель швидкого доступу для зручності.
crash_site_barrage_invalid=Недійсні координати.
crash_site_barrage=Запускає залп самонавідних ракет по ворогу.
crash_site_barrage_count=Покращує шкоду залпу до рівня [font=var]__1__[/font]\n\nЩоб використати залп, покладіть вибухові ракети в скриню спавну, а потім введіть /barrage, вказавши gps-позицію\n\nПокращення шкоди збільшують кількість запущених ракет.\n\n[color=255,230,192][font=default-bold]Поточний рівень:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Поточна кількість ракет:[/font][/color] [font=var]__3__[/font]\n[color=255,230,192][font=default-bold]Поточна вартість:[/font][/color] [font=var]__4__[/font]
crash_site_barrage_radius=Покращує радіус залпу до рівня [font=var]__1__[/font]\n\nЩоб використати залп, покладіть вибухові ракети в скриню спавну, а потім введіть /barrage, вказавши gps-позицію\n\n[color=255,230,192][font=default-bold]Поточний рівень:[/font][/color] [font=var]__2__[/font]\n[color=255,230,192][font=default-bold]Поточний радіус:[/font][/color] [font=var]__3__[/font]
crash_site_barrage_radius_name_label=[color=255,230,192][font=default-large-bold]Радіус ракетного залпу __1__\n[/font][/color]
crash_site_barrage_count_name_label=[color=255,230,192][font=default-large-bold]Шкода ракетного залпу __1__\n[/font][/color]
crash_site_barrage_not_researched=Ви ще не дослідили технологію Залп. Відвідайте ринок на спавні [gps=-3,-3,redmew]
crash_site_barrage_insufficient_currency_error=Щоб надіслати ракетний залп, завантажте ще __1__ вибухових ракет у платіжну скриню [gps=-4.5,-7.5,redmew]
crash_site_barrage_no_nests=Гнізд за цими координатами не знайдено ([gps=__1__,__2__,__3__]), яка марна витрата ракет!
crash_site_barrage_damage_upgrade_success=__1__ підвищив шкоду ракетного залпу до рівня __2__
