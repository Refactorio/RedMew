description=[font=default-bold]RedMew — це спільнота Factorio, яка підтримує власні сервери, карти різних форм і розмірів, сценарії зі скриптами та модифіковані сервери.[/font]\nНаш сценарій пропонує понад 100 різних карт, і ви можете обрати ту, що вам до вподоби, виконавши наступні кроки:\n\n[color=green]Простий режим: відвідайте[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Експертний режим: відредагуйте map_selection.lua у папці сценарію[/color]\nДокладніше про кожну карту дивіться у списку на [color=blue]redmew.com/maps[/color]\n\nКорисні посилання: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Дякуємо, що обрали Redmew — сценарій від Refactorio![/color]
