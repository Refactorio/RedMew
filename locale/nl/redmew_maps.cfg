# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=Grot ingestort!
cave_collapse_warning=Mijnbare entiteiten zoals muren, stenen paden, beton\nen rotsen kunnen een instorting veroorzaken, wees voorzichtig, mijnwerker!\n\nAdvies van de voorman: Plaats elke 4e tegel een muur om\neen instorting te voorkomen. Gebruik stenen paden en betonnen muren\nom het verder te versterken.

night_time_warning=Het lijkt erop dat het plaatsen van zonnepanelen onder de grond\ngeen effect heeft op de energieproductie!\nOnderzoek toont aan dat hetzelfde geldt voor de draagbare versie!\n\nAdvies van de voorman: Zonnepanelen zijn alleen nuttig bij het\ncraften van satellieten

cracking_sound_1=R E N, J U L L I E   G E K K E N !
cracking_sound_2=K R A K

score_cave_collapses=Grot ingestort
score_mine_size=Mijngrootte

auto_play_cutscene=Diggy-cinematic automatisch afspelen
cutscene_case_line2=Welkom bij __1__
cutscene_case_line4=Dit is een aangepast scenario ontwikkeld door __1__
cutscene_case_line5=Word lid van ons op __1__
cutscene_case_line6=De volgende introductie helpt je op weg!
cutscene_case_line7=Als je problemen ondervindt tijdens deze cinematic, laat het ons weten
cutscene_case0_line1=Dit is het startgebied
cutscene_case0_line3=Het uitbreiden van de mijn is gevaarlijk!
cutscene_case1_line1=Muren worden gebruikt om te voorkomen dat het plafond van de grot ons verplettert
cutscene_case2_line1=De markt levert extra voorraden in ruil voor munten
cutscene_case2_line3=Je ontgrendelt nieuwe items wanneer je een niveau omhoog gaat
cutscene_case3_line1=Grotinstortingen komen vaak voor als je geen ondersteuningen plaatst
cutscene_case3_line3=Verschillende soorten baksteen en beton kunnen onze steunpilaren versterken!
cutscene_case4_line1=Deze wereld bevat broze rotsen
cutscene_case4_line3=Onze gereedschappen zijn te krachtig om te voorkomen dat hulpbronnen worden vernietigd
cutscene_case5_line1=De meeste acties geven ervaring!
cutscene_case5_line3=De zwevende tekst geeft de hoeveelheid en de oorzaak van de ervaring aan
cutscene_case6_line1=De inheemse bevolking loert in het donker
cutscene_case6_line3=Wees alert tijdens het graven, neem altijd wat verdediging mee
cutscene_case7_line1=Hiermee eindigt de introductie
cutscene_case7_line3=Veel plezier en blijf graven!
replay_cutscene=Gebruik het commando __1__ om de introductie opnieuw te bekijken

blueprint_tools_tooltip=Blueprint Tools weergeven

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Crashsite-cinematic automatisch afspelen
cutscene1_case_line2=Welkom bij __1__
cutscene1_case_line4=Dit is een aangepast scenario ontwikkeld door __1__
cutscene1_case_line5=Word lid van ons op __1__
cutscene1_case_line6=De volgende introductie helpt je op weg met spelen!
cutscene1_case0_line3=Dit is onze werkbalk!
cutscene1_case0_line4=Hier vind je een breed scala aan tools en informatie over ons!
cutscene1_case0_line5=Beweeg je muis eroverheen voor meer informatie
cutscene1_case0_line6=Met deze knop kun je onze werkbalk in- en uitschakelen
cutscene1_case1_line1=Dit is het startgebied. Het heeft een markt en een muntfabriek.
cutscene1_case1_line2=De muntfabriek produceert munten in beperkt tempo en is op de markt op te waarderen.
cutscene1_case1_line3=Munten kun je ook verkrijgen door bijters, spuwers, wormen en nesten te doden.
cutscene1_case2_line1=Munten worden gebruikt om items te kopen op de markt.
cutscene1_case3_line1=Dit, samen met de ertsvlakken en de muur, is je spawn. Nu naar de buitenposten.

cutscene2_case_line1=Dit is een "Buitenpost". Ze komen in vele vormen en maten, met alles van ijzeren platen tot MK2-pantser.
cutscene2_case_line2=Je zult veel vergelijkbare structuren verspreid over de kaart vinden.
cutscene2_case0_line1=Buitenposten worden verdedigd door vijandelijke torens en muren. De sterkte van de torens schaalt mee met de beloningen binnenin.
cutscene2_case0_line2=Om een buitenpost te "veroveren", moet je alle torens vernietigen.
cutscene2_case1_line1=De buitenpost bevat een markt, buitkisten en magische crafters (montagemachines, chemische fabrieken, enz.).
cutscene2_case2_line1=Magische crafters hebben geen grondstoffen of elektriciteit nodig, zij produceren items gratis. (Deze maakt ijzeren platen.)
cutscene2_case3_line1=Je kunt de fabricagesnelheid op de (lokale) markt upgraden met munten. Sommige markten bevatten extra items.
cutscene2_case4_line1=Bijters evoluëren snel (en vermenigvuldigen zich soms wanneer ze gedood worden!). Tip: houd de vervuiling tot een minimum door de gratis items te benutten.
cutscene2_case5_line1=Het doel van dit scenario is om alle bijters uit te schakelen en een raket te lanceren op de kaart van beperkte grootte.
cutscene2_case5_line2=Dit was de rondleiding. Veel succes en veel plezier!
replay_cutscene=Gebruik het commando __1__ om de introductie opnieuw te bekijken. Je kunt ook op het informatiepictogram drukken voor een tekstsamenvatting.

# locale linked to the quadrants scenario
[quadrants]
on=AAN
off=UIT

compi_spawn_welcome=Welkom bij Redmew - Quadrants!\n\nGebruik de GUI in de linkerbovenhoek om te spelen!
compi_spawn_cute=Ik ben erg schattig

compi_common_transfer_item=Hoe verplaats je items?\nJe kunt ondergrondse transportbanden gebruiken om de andere kant te bereiken\n\nJe kunt items er ook overheen droppen, gebruik gewoon de ´Z´-toets
compi_common_chat=Ben je tot zwijgen gebracht?\nJe kunt chatten met de toets onder ESC\n\nJe kunt dit wijzigen in Instellingen -> Besturing -> Toggle Lua console
compi_common_market=Heb je wat wisselgeld over?\nGeef je hard-verdiende munten uit, hier in de winkel
compi_common_switch=Je kunt van gebied wisselen!\nHet enige dat nodig is, is een lege inventaris\n\nGa gewoon bij mij in de buurt staan en gebruik de gui in de linkerbovenhoek om te wisselen
compi_common_chests=Kun je sommige kisten niet verwijderen?\nSpelers die van gebied wisselen kunnen een kist achterlaten\n\nJe kunt hem legen om hem te verwijderen

compi_quadrant1_welcome=Welkom bij Wetenschap en Militair!\n\nHet commandocentrum van militaire en wetenschappelijke vooruitgang
compi_quadrant1_science=Dit gebied is het enige dat kan onderzoeken\n\nJe zult wat wetenschapspakketten uit andere gebieden moeten importeren
compi_quadrant1_military=In dit gebied kun je alleen militaire items fabriceren\n\nAndere gebieden zijn ervan afhankelijk dat jij militaire items naar hen stuurt

compi_quadrant2_welcome=Welkom bij Tussenproducten en Mijnbouw!\n\nDe enige producent van staal en elektronische schakelingen!
compi_quadrant2_steel=Dit gebied is het enige dat staal kan produceren\n\nAndere gebieden zijn ervan afhankelijk dat jij staal naar hen stuurt
compi_quadrant2_circuits=Dit gebied is het enige dat schakelingen kan produceren\n\nJe moet ze naar andere gebieden exporteren!
compi_quadrant2_resources=Er gaan geruchten:\nDit gebied is extra rijk aan grondstoffen\n\nHet is ideaal voor mijnbouwoperaties

compi_quadrant3_welcome=Welkom bij Olie en Hightech!\n\nThuisbasis van olieverwerking en technologie
compi_quadrant3_oil=Dit gebied is het enige dat ruwe olie kan verwerken\n\nMogelijk moet je ruwe olie uit andere gebieden importeren
compi_quadrant3_tech=Dit gebied is het enige dat allerlei hightechproducten kan produceren\n\nMogelijk moet je veel tussenproducten importeren!
compi_quadrant3_rocket=Ik heb gehoord:\nDit gebied is een perfecte plek om een raket te lanceren\n\nAndere gebieden kunnen je de onderdelen leveren die je nodig hebt

compi_quadrant4_welcome=Welkom bij Logistiek en Transport\n\nThuisbasis van spaghetti en rangeerterreinen
compi_quadrant4_logistic=Dit gebied is het enige dat logistieke oplossingen kan leveren\n\nHet succes van de regio hangt ervan af dat jij deze exporteert!
compi_quadrant4_born=Wist je dat?\nMijn broers en zussen en ik zijn hier geboren

popup_quadrant1_title=Onderzoek en commando centrum
popup_quadrant2_title=Tussenstap productie en mijnbouw
popup_quadrant3_title=Olie en hightech productie
popup_quadrant4_title=Logistieke productie
popup_quadrant1=Onze hoofdopdracht is de regio te voorzien van nieuwe wetenschappelijke ontdekkingen\n\nDaarnaast zijn wij het centrale commandoknooppunt\nWij voorzien de regio van militaire uitrusting
popup_quadrant2=Onze hoofdopdracht is de regio te voorzien van tussenproducten\nWij leveren vooral elektronische schakelingen in verschillende dichtheden\nWij zijn ook het gebied met het staal van de hoogste kwaliteit!\nEen eerste verkenning toont extra grondstoffen in dit gebied
popup_quadrant3=Onze hoofdopdracht is de regio te voorzien van producten op oliebasis\nDaarnaast zijn wij de technologische leider van de regio\nWij voorzien de regio van verschillende hightechproducten (en radioactieve producten)
popup_quadrant4=Onze hoofdopdracht is de regio te voorzien van logistieke oplossingen\nWij leveren vooral oplossingen op basis van transportbanden en bots\nWij zijn ook gespecialiseerd in krachtige treinnetwerken!

