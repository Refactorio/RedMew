# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew Info[/color][/font]\n Community, regels, functies, kaartinfo
welcome_header=Welkom bij Redmew!
welcome_text=RedMew is een community voor spelers van alle niveaus, die zich inzet om de grenzen van Factorio Multiplayer te verleggen via custom scripts en waanzinnige mapontwerpen.\n\nWij zijn een vriendelijke bende; ons doel is om zoveel mogelijk plezier te hebben en we hopen dat jij dat ook hebt.
chatting_header=Hoe te chatten
chatting_text=Om te chatten met andere spelers, druk op de __CONTROL__toggle-console__ toets op je toetsenbord.\nDe standaard toets op Nederlandse toetsenborden is de grave (`) en is onder de ESC toets.\nDit kan worden gewijzigd in __1__ -> __2__ -> __3__.
free_coin_header=Gratis Munten
free_coin_text=Je hebt __1__ __2__ gekregen omdat je naar het welkomsttabblad keek.\nAls je elk tabblad bekijkt, krijg je nog __1__ __2__.\n
free_coin_print=__1__ __2__ toegekend voor het lezen van een tabblad op het info-scherm.
links_header=Nuttige links
links_discord=Bekijk onze discord voor informatie over nieuwe kaarten en stel nieuwe kaarten / ideeën voor.
links_patreon=Bijdragers aan onze Patreon ontvangen speciale voordelen en helpen onze servers onderhouden.
links_saves=Download onze kaarten, een kopie van de start en het einde, van onze website.
links_factoriomaps=Bekijk onze vorige kaarten als Google Map kaart.
rules_header=Regels
rules_text=Veel plezier en speel netjes. Bedenk dat we er allemaal zijn om plezier te hebben, dus laten we het daarbij houden.\n\nGeen haatdragende inhoud of persoonlijke aanvallen.\n\nAls je vermoedt dat iemand aan het griefen is, meld dit dan bij het adminteam via /report of door op de knop naast de speler in de spelerslijst te klikken.
rules_text_danger_ore=Als het bouwwerk van een andere speler aangepast of verwijderd moet worden, moet er eerst een teambespreking of stemming/peiling plaatsvinden vóór de aanpassing of verwijdering.\n\nEen teambespreking of stemming/peiling is niet nodig als de speler die het bouwwerk heeft gemaakt online is en akkoord gaat met de aanpassing of verwijdering.\n\nMapbrede modulewissels en transportbandupgrades moeten als team worden gestemd vóórdat de wissel of upgrade plaatsvindt.\n\nIn het geval van een teamstemming/peiling wint de meerderheid.\n\nMet slechts 1 of 2 spelers online is een teambespreking of stemming/peiling niet mogelijk. Toch kan het aanpassen of verwijderen van een bouwwerk nodig zijn om de basis soepel te laten draaien. Laat dan een bericht achter in de in-game chat waarin staat dat je een bouwwerk aanpast of verwijdert, en waarom dat nodig is. Alleen zeggen dat jouw ontwerp of bouwwerk beter of mooier is, is niet genoeg.
map_info_button=Kaart info
map_info_header=Kaartinformatie
map_name_label=Kaartnaam:
map_desc_label=Kaart omschrijving:
map_extra_info_label=Extra informatie:
softmods_button=Scenario-aanpassingen
softmods_header=Soft Mods en Server Plugins
softmods_rank_text=We hebben een eenvoudig rangsysteem om griefen te voorkomen. Je kunt geen atoombommen of de deconstructieplanner gebruiken als je een gast bent. Als je een paar uur speelt, zal een admin je promoveren tot regular. Je kunt ook een admin vragen om promotie als je aan een project werkt dat dit vereist.\n
softmods_rank_is=Jouw rang is:
softmods_market_label=Markt
softmods_market_text=Op de meeste kaarten vind je bij de spawn een markt waar je met munten aankopen kunt doen. Munten verkrijg je door bomen te kappen, items met de hand te vervaardigen en nesten van bijters te vernietigen. De meeste items in de markt zijn vast, maar sommige zijn kaartspecifiek (meestal opgehoogde grond) en wisselen van tijd tot tijd.
softmods_saviour_label=Treinredder
softmods_saviour_text=Treinen zijn de ergste vijand van een Factorio-speler. Als je minstens één player port in je inventaris hebt en door een trein wordt doodgereden, wordt je leven gespaard maar verlies je een player port. Player ports kun je krijgen bij de markt.
softmods_plist_label=Spelerslijst
softmods_plist_text=Toont alle spelers op de server en laat wat statistieken zien. Je kunt de lijst sorteren door op de kolomkoppen te klikken. Je kunt ook mensen poken, wat een willekeurig zelfstandig naamwoord in de chat gooit.
softmods_polls_label=Peilingen
softmods_polls_text=Peilingen helpen spelers om consensus te bereiken over grote acties. Wil je een belangrijk bouwwerk verbeteren? Maak dan een peiling om te controleren of iedereen het daarmee eens is. Je moet een regular zijn om nieuwe peilingen te maken.
softmods_tags_label=Labels
softmods_tags_text=Je kunt jezelf een rol geven met tags zodat andere spelers weten wat je aan het doen bent. Of gebruik de tag gewoon als decoratie. Regulars kunnen nieuwe eigen tags maken, laat vooral je creativiteit zien.
softmods_tasks_label=Taken
softmods_tasks_text=Niet zeker waar je aan zou moeten werken? Kijk dan naar de taken en zie wat er gedaan moet worden. Regulars kunnen nieuwe taken toevoegen.
softmods_bp_label=BP\nhelper
softmods_bp_text=Met de Blueprint helper™ kun je blueprints horizontaal of verticaal spiegelen en kun je\n de gebruikte entiteiten in de blueprint omzetten, bijvoorbeeld gele transportbanden omzetten naar rode transportbanden.
softmods_score_label=Score
softmods_score_text=Toont het aantal gelanceerde raketten, bevrijde bijters, gebouwde entiteiten en nog veel meer!
softmods_shortcuts_label=Sneltoetsen
softmods_shortcuts_text=Spelersneltoetsen zijn gemakkelijk toegankelijke knoppen die de speler handige tools bieden. Ruim biter-lijken van de grond op, sorteer je inventaris in nabijgelegen kisten/ovens, laad je uitgeruste batterijen op uit nabijgelegen accumulatoren en nog veel meer.
softmods_production_hud_label=Prod. HUD
softmods_production_hud_text=De productie-HUD is een venster met productiestatistieken dat altijd op het scherm kan blijven. Voeg items toe aan of verwijder ze uit de bijgehouden lijst en zorg dat de fabriek goed gevoed wordt!
softmods_train_station_teleport_label=Teleporter
softmods_train_station_teleport_text=Met de treinstation-teleport kun je direct teleporteren tussen [entity=train-stop] op de map. Het enige wat je hoeft te doen is bij een [entity=train-stop] te staan en vanuit de kaartweergave een andere [entity=train-stop] te openen en erheen te teleporteren met de teleportknop.
softmods_autofill_label=Autofill
softmods_autofill_text=Plaatst automatisch munitie bij het bouwen van geschuttorens. Kan worden ingesteld om de munitiesoorten en de hoeveelheid te filteren.
softmods_paint_brush_label=Verfkwast
softmods_paint_brush_text=De fabriek moet groeien! ...met stijl
whats_new_button=Wat is er nieuw

