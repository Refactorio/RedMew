description=[font=default-bold]RedMew is een Factorio-community die aangepaste servers, kaarten in verschillende vormen en maten, gescripte scenario's en gemodde servers beheert.[/font]\nOns scenario biedt meer dan 100 verschillende kaarten, en je kunt de kaart van jouw keuze selecteren met de volgende stappen:\n\n[color=green]Eenvoudige modus: bezoek[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Expertmodus: bewerk map_selection.lua in de scenariomap[/color]\nVoor meer details over elke kaart kun je de lijst op [color=blue]redmew.com/maps[/color] bekijken\n\nNuttige links: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Bedankt dat je voor Redmew kiest, een scenario van Refactorio![/color]
