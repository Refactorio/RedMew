# locale linked to the diggy scenario
[diggy]
cave_collapse=Mağara çöktü!
cave_collapse_warning=Duvarlar, taş yollar, beton\nve kayalar gibi yapıları kazmak göçüğe yol açabilir, dikkatli ol madenci!\n\nUstabaşının tavsiyesi: Göçüğü önlemek için\nher 4. kareye bir duvar yerleştir. Taş yollar ve beton\nkullanarak daha da sağlamlaştır.

night_time_warning=Güneş panellerini yerin altına yerleştirmek\nenerji üretimine etki etmiyor gibi görünüyor!\nAraştırmalar, aynı durumun taşınabilir sürüm için de geçerli olduğunu gösteriyor!\n\nUstabaşının tavsiyesi: Güneş Panelleri yalnızca uydu\nüretiminde işe yarar

cracking_sound_1=K A Ç,  S İ Z   A H M A K L A R !
cracking_sound_2=Ç A T

score_cave_collapses=Mağara göçükleri
score_mine_size=Maden boyutu

auto_play_cutscene=Diggy tanıtım sahnesini otomatik oynat
cutscene_case_line2=__1__ haritasına hoş geldiniz
cutscene_case_line4=Bu, __1__ tarafından geliştirilmiş özel bir senaryodur
cutscene_case_line5=Bize __1__ adresinde katılın
cutscene_case_line6=Aşağıdaki tanıtım, başlamanıza yardımcı olacak!
cutscene_case_line7=Bu tanıtım sahnesi sırasında sorun yaşarsan bize bildir
cutscene_case0_line1=Burası başlangıç alanı
cutscene_case0_line3=Madeni genişletmek tehlikelidir!
cutscene_case1_line1=Duvarlar, mağara tavanının bizi ezmemesi için kullanılır
cutscene_case2_line1=Pazar, madeni para karşılığında ek malzemeler sağlar
cutscene_case2_line3=Seviye atladığında yeni eşyaların kilidini açarsın
cutscene_case3_line1=Destek eklemediğinde mağara göçükleri sık sık gerçekleşir
cutscene_case3_line3=Farklı tuğla ve beton türleri destek sütunlarımızı güçlendirebilir!
cutscene_case4_line1=Bu dünya kırılgan kayalar içerir
cutscene_case4_line3=Araçlarımız hiçbir kaynağı yok olmaktan koruyamayacak kadar güçlü
cutscene_case5_line1=Çoğu eylem deneyim kazandırır!
cutscene_case5_line3=Uçan yazı, deneyimin miktarını ve nedenini gösterir
cutscene_case6_line1=Yerliler karanlıkta pusuda bekliyor
cutscene_case6_line3=Kazarken dikkatli ol, yanında her zaman biraz savunma taşı
cutscene_case7_line1=Tanıtım burada sona eriyor
cutscene_case7_line3=İyi eğlenceler ve kazmaya devam et!
