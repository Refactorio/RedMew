popup_quadrant2=Asıl amacımız bölgeye ara ürünler sağlamak\nAğırlıklı olarak çeşitli yoğunluklarda elektronik devre tedarik ediyoruz\nAyrıca en kaliteli çeliğe sahip bölge biziz!\nİlk araştırma, bu bölgedeki kaynakların arttığını gösteriyor
popup_quadrant3=Asıl amacımız bölgeye petrol bazlı ürünler sağlamak\nİkincil olarak bölgenin teknoloji lideriyiz\nBölgeye çeşitli yüksek teknolojili (ve radyoaktif) ürünler sağlıyoruz
popup_quadrant4=Asıl amacımız bölgeye lojistik çözümler sağlamak\nAğırlıklı olarak bant ve robot tabanlı çözümler tedarik ediyoruz\nAyrıca yüksek performanslı tren ağlarında uzmanız!

