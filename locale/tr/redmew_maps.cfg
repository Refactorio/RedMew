# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Crashsite tanıtım sekansını otomatik oynat
cutscene1_case_line2=__1__ dünyasına hoş geldiniz
cutscene1_case_line4=Bu, __1__ tarafından geliştirilen özel bir senaryodur
cutscene1_case_line5=__1__ adresinde bize katılın
cutscene1_case_line6=Aşağıdaki tanıtım, oyuna başlamanıza yardımcı olacak!
cutscene1_case0_line3=Bu da bizim araç çubuğumuz!
cutscene1_case0_line4=Burada bolca araç ve hakkımızda bilgi bulacaksınız!
cutscene1_case0_line5=Daha fazla bilgi için fare imlecini üzerlerinde bekletin
cutscene1_case0_line6=Araç çubuğumuzu bu düğmeyle açıp kapatabilirsiniz
cutscene1_case1_line1=Burası başlangıç alanı. İçinde bir pazar ve bir sikke basım tesisi var.
cutscene1_case1_line2=Sikke basım tesisi sınırlı bir hızda sikke üretir; pazardan yükseltilebilir.
cutscene1_case1_line3=Sikkeler, biter, spitter, solucan ve üreme yuvası öldürerek de elde edilebilir.
cutscene1_case2_line1=Sikkeler, pazardan eşya satın almak için kullanılır.
cutscene1_case3_line1=Bu, cevher yatakları ve duvarla birlikte doğuş alanınız. Şimdi sırada karakollar var.

cutscene2_case_line1=Bu bir "karakol". Birçok farklı biçim ve boyutta gelirler; demir plakadan MK2 zırhına kadar her şeyi barındırabilirler.
cutscene2_case_line2=Haritaya dağılmış halde buna benzer birçok yapı bulacaksınız.
cutscene2_case0_line1=Karakollar düşman taretleri ve duvarlarıyla savunulur. Taret gücü, içindeki ödüllere göre artar.
cutscene2_case0_line2=Bir karakolu "ele geçirmek" için tüm taretleri yok etmelisiniz.
cutscene2_case1_line1=Karakolda bir Pazar, Ganimet Sandıkları ve Sihirli Üreticiler (montajcılar, kimyasal tesisler vb.) bulunur.
cutscene2_case2_line1=Sihirli Üreticiler girdi veya elektrik gerektirmez; eşyaları bedava üretir. (Bu, demir plaka üretiyor.)
cutscene2_case3_line1=Üretim hızını (yerel) pazardan sikkeyle yükseltebilirsiniz. Bazı pazarlarda ek eşyalar bulunur.
cutscene2_case4_line1=Biterler hızla evrimleşir (ve bazen öldürüldüklerinde çoğalırlar!). İpucu: bedava eşyaları kullanarak kirliliği en aza indirin.
cutscene2_case5_line1=Bu senaryonun amacı, sınırlı boyuttaki haritada tüm biterleri yok edip bir roket fırlatmaktır.
cutscene2_case5_line2=Tur burada sona eriyor. İyi şanslar ve iyi eğlenceler!
replay_cutscene=Tanıtımı tekrar izlemek için __1__ komutunu kullanın. Metin özeti için bilgi simgesine de basabilirsiniz.

