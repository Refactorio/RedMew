compi_spawn_welcome=Redmew - Quadrants dünyasına hoş geldiniz!\n\nOynamak için sol üst köşedeki GUI'yi kullanın!
compi_spawn_cute=Gerçekten sevimliyim

compi_common_transfer_item=Eşyaları nasıl aktarırım?\nKarşı tarafa ulaşmak için yeraltı bandı kullanabilirsiniz\n\nEşyaları karşıya atarak da geçebilirsiniz, sadece ´Z´ tuşunu kullanın
compi_common_chat=Susturuldun mu?\nESC tuşunun altındaki tuşu kullanarak sohbet edebilirsin\n\nBunu Ayarlar -> Kontroller -> Lua konsolunu aç/kapat bölümünden değiştirebilirsin
compi_common_market=Bozuk paran var mı?\nEmekle kazandığın madeni paraları buradaki pazarda harcamaya git
compi_common_switch=Bölge değiştirebilirsin!\nTek gereken, envanterinin boş olması\n\nSadece yanımda dur ve değiştirmek için sol üst köşedeki arayüzü kullan
compi_common_chests=Bazı sandıkları kaldıramıyor musun?\nBölge değiştiren oyuncular arkalarında sandık bırakabilir\n\nKaldırmak için onu boşaltabilirsin

compi_quadrant1_welcome=Bilim ve Askeriye'ye hoş geldin!\n\nAskeri ve bilimsel ilerlemenin komuta merkezi
compi_quadrant1_science=Bu bölge araştırma yapabilen tek bölge\n\nDiğer bölgelerden biraz bilim paketi ithal etmen gerekecek
compi_quadrant1_military=Bu bölgede yalnızca askeri eşyalar üretebilirsin\n\nDiğer bölgeler, onlara askeri eşya göndermene bağlı

compi_quadrant2_welcome=Ara Ürünler ve Madencilik'e hoş geldin!\n\nÇelik ve elektronik devrelerin tek üreticisi!
compi_quadrant2_steel=Bu bölge çelik üretebilen tek bölge\n\nDiğer bölgeler, onlara çelik göndermene bağlı
compi_quadrant2_circuits=Bu bölge devre üretebilen tek bölge\n\nOnları diğer bölgelere ihraç etmen gerekiyor!
compi_quadrant2_resources=Dedikoduya göre:\nBu bölge kaynaklar açısından fazladan zengin\n\nMadencilik işlemleri için ideal

compi_quadrant3_welcome=Petrol ve Yüksek Teknoloji'ye hoş geldin!\n\nPetrol işleme ve teknolojinin yurdu
compi_quadrant3_oil=Bu bölge ham petrol işleyebilen tek bölge\n\nDiğer bölgelerden ham petrol ithal etmen gerekebilir
compi_quadrant3_tech=Bu bölge çeşitli yüksek teknoloji eşyaları üretebilen tek bölge\n\nÇok sayıda ara ürün ithal etmen gerekebilir!
compi_quadrant3_rocket=Duymuştum:\nBu bölge roket fırlatmak için mükemmel bir yer\n\nDiğer bölgeler sana ihtiyacın olan parçaları sağlayabilir

compi_quadrant4_welcome=Lojistik ve Ulaşım'a hoş geldin\n\nSpagettinin ve tren garlarının yurdu
compi_quadrant4_logistic=Bu bölge lojistik çözümleri sunabilen tek bölge\n\nBölgenin başarısı, bunları ihraç etmene bağlı!
compi_quadrant4_born=Biliyor muydun?\nKardeşlerim ve ben burada doğduk

popup_quadrant1_title=Araştırma ve komuta merkezi
