# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew Bilgisi[/color][/font]\n Topluluk, kurallar, özellikler, harita bilgisi
welcome_header=Redmew'e Hoş Geldiniz!
welcome_text=RedMew, özel betikler ve çılgın harita tasarımlarıyla Factorio Çok Oyunculu'nun sınırlarını zorlamaya kendini adamış, her yetenek seviyesinden oyuncudan oluşan bir topluluktur.\n\nBiz samimi bir topluluğuz; amacımız mümkün olduğunca eğlenmek ve sizin de eğleneceğinizi umuyoruz.
chatting_header=Nasıl Sohbet Edilir
chatting_text=Diğer oyuncularla sohbet etmek için klavyenizdeki __CONTROL__toggle-console__ tuşuna basın.\nİngilizce klavyelerde varsayılan tuş, ESC tuşunun altındaki grave (`) tuşudur.\nBu, __1__ -> __2__ -> __3__ bölümünden değiştirilebilir.
free_coin_header=Ücretsiz Madeni Para
free_coin_text=Karşılama sekmesine baktığınız için __1__ __2__ verildi.\nHer sekmenin kontrolü size __1__ __2__ daha kazandıracak.\n
free_coin_print=Bilgi ekranındaki bir sekmeyi okuduğunuz için __1__ __2__ verildi.
links_header=Kullanışlı Linkler
links_discord=Yeni harita bilgileri için ve yeni harita / fikir önerileri sunmak için Discord sunucumuza göz atın.
links_patreon=Özel ayrıcalıklar elde etmek ve sunucularımızın ayakta kalmasına yardım etmek için Patreon'ımıza katkıda bulunun.
links_saves=Haritalarımızı, başlangıç ve bitiş durumlarıyla birlikte, web sitemizden indirin.
links_factoriomaps=Geçmiş haritalarımızı bir Google Haritası olarak görüntüleyin.
rules_header=Kurallar
rules_text=Eğlenin ve güzel oynayın. Unutmayın, hepimiz yalnızca eğlenmek için buradayız, öyle de kalsın.\n\nNefret içeriği veya kişisel saldırılar yoktur.\n\nBirinin kasıtlı olarak yıpratma (griefing) yaptığından şüpheleniyorsanız /report komutunu kullanarak veya oyuncu listesindeki oyuncunun yanındaki bildir düğmesine tıklayarak yönetici ekibine haber verin.
rules_text_danger_ore=Başka bir oyuncunun yapısının değiştirilmesi veya kaldırılması gerekiyorsa, değiştirme ya da kaldırma işleminden önce bir ekip tartışması veya oylama yapılmalıdır.\n\nYapıyı inşa eden oyuncu çevrimiçiyse ve değiştirme veya kaldırmayı kabul ediyorsa ekip tartışması ya da oylama gerekmez.\n\nHarita genelinde modül değişimi ve bant yükseltmesi, işlem yapılmadan önce ekip halinde oylanmalıdır.\n\nEkip oylaması durumunda çoğunluğun kararı geçerlidir.\n\nÇevrimiçi yalnızca 1 veya 2 oyuncu, bir ekip tartışması ya da oylaması için yeterli değildir. Yine de üssün sorunsuz çalışmaya devam etmesi için bir yapının değiştirilmesi veya kaldırılması gerekebilir. Bu durumda, oyun içi sohbete yapının değiştirildiğinin veya kaldırıldığının ve bunun neden gerekli olduğunun belirtildiği bir mesaj bırakılmalıdır. Yalnızca tasarımınızın veya yapınızın daha iyi ya da daha güzel göründüğünü söylemek yeterli değildir.
map_info_button=Harita Bilgisi
map_info_header=Harita Bilgisi
map_name_label=Harita adı:
map_desc_label=Harita açıklaması:
map_extra_info_label=Ek Bilgiler:
softmods_button=Senaryo Modları
softmods_header=Özellikler ve sunucu eklentileri
softmods_rank_text=Yıpratmayı (griefing) önlemek için temel bir rütbe sistemimiz var. Misafirseniz nükleerleri veya sökme planlayıcısını kullanamazsınız. Birkaç saat oynadığınızda bir yönetici sizi düzenli oyuncu (regular) rütbesine yükseltir. Ayrıca üzerinde çalıştığınız bir proje gerektiriyorsa bir yöneticiden terfi isteyebilirsiniz.\n
softmods_rank_is=Rütbeniz:
softmods_market_label=Market
softmods_market_text=Çoğu haritada doğuş noktasının yakınında, satın alma yapmak için madeni paraları kullanabileceğiniz bir pazar bulursunuz. Paralar; ağaç keserek, eşyaları elle üreterek ve biter yuvalarını yok ederek kazanılır. Pazardaki çoğu eşya sabittir, ancak bazıları haritaya özgüdür (genellikle dolgu arazisi) ve zaman zaman listeye girip çıkacaktır.
softmods_saviour_label=Tren kurtarıcı
softmods_saviour_text=Trenler, bir Factorio oyuncusunun en korkulu düşmanıdır. Envanterinizde en az bir oyuncu portu varken bir tren tarafından öldürülürseniz hayatınız bağışlanır ancak bir oyuncu portu kaybedersiniz. Oyuncu portlarını pazardan edinebilirsiniz.
softmods_plist_label=Oyuncu listesi
softmods_plist_text=Sunucudaki tüm oyuncuları listeler ve bazı istatistikleri gösterir. Sütun başlıklarına tıklayarak listeyi sıralayabilirsiniz. Ayrıca oyuncuları dürttebilirsiniz; bu, sohbete rastgele bir ad fırlatır.
softmods_polls_label=Anketler
softmods_polls_text=Anketler, oyuncuların büyük değişiklikler için ortak bir karara varmasına yardımcı olur. Önemli bir yapıyı geliştirmek mi istiyorsunuz? Herkesin buna onay verdiğini görmek için bir anket oluşturun. Yeni anket oluşturabilmek için düzenli oyuncu (regular) olmanız gerekir.
softmods_tags_label=Etiketler
softmods_tags_text=Etiketlerle kendinize bir rol atayarak diğer oyunculara ne yaptığınızı bildirebilirsiniz. Ya da etiketi yalnızca bir süs olarak kullanın. Düzenli oyuncular yeni özel etiketler oluşturabilir; yaratıcılığınızı sergilemeyi ihmal etmeyin.
softmods_tasks_label=Görevler
softmods_tasks_text=Ne üzerinde çalışmanız gerektiğinden emin değilseniz, görevlere bakıp neyin yapılması gerektiğini görmeye ne dersiniz? Düzenli oyuncular yeni görev ekleyebilir.
softmods_bp_label=BP\nyardımcısı
softmods_bp_text=Şablon yardımcısı™, şablonları yatay veya dikey olarak çevirmenize olanak tanır ve\nşablonda kullanılan varlıkları dönüştürmenizi sağlar; örneğin sarı bantları kırmızı bantlara çevirmek gibi.
softmods_score_label=Skor
softmods_score_text=Fırlatılan roket sayısını, kurtardığınız biter sayısını, inşa edilen varlıkları ve çok daha fazlasını gösterir!
softmods_shortcuts_label=Kısayollar
softmods_shortcuts_text=Oyuncu kısayolları, oyuncuya kullanışlı araçlar sunan kolayca erişilebilen düğmelerdir. Biter cesetlerini yerden temizleyin, envanterinizi yakındaki sandıklara/fırınlara ayırın, kuşandığınız pilleri yakındaki akülülerden şarj edin ve çok daha fazlası.
softmods_production_hud_label=Üretim HUD
softmods_production_hud_text=Üretim HUB'ı, sürekli olarak ekranda tutulabilen bir üretim istatistikleri penceresidir. İzlenen listeye eşya ekleyin/kaldırın ve fabrikanın iyi beslendiğinden emin olun!
softmods_train_station_teleport_label=Işınlayıcı
softmods_train_station_teleport_text=Tren İstasyonu Işınlaması, oyuncunun harita genelindeki [entity=train-stop] durakları arasında anında ışınlanmasına olanak tanır. Tek yapmanız gereken bir [entity=train-stop] yanında durmak, harita görünümünden başka bir [entity=train-stop] açmak ve ışınlan düğmesiyle ona ışınlanmaktır.
softmods_autofill_label=Otodoldurma
softmods_autofill_text=Taret kurarken mühimmatı otomatik olarak bırakır. Mühimmat türlerini ve miktarını filtreleyecek şekilde yapılandırılabilir.
softmods_paint_brush_label=Boya fırçası
softmods_paint_brush_text=Fabrika büyümeli! ...üstelik şık bir şekilde
whats_new_button=Yenilikler

