description=[font=default-bold]RedMew, özel sunucular barındıran, farklı şekil ve boyutlarda haritalar, betikli senaryolar ve modlu sunucular sunan bir Factorio topluluğudur.[/font]\nSenaryomuz 100'den fazla farklı harita sunar ve aşağıdaki adımlarla dilediğinizi seçebilirsiniz:\n\n[color=green]Basit Mod: şu adresi ziyaret edin[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Uzman Modu: senaryo klasöründeki map_selection.lua dosyasını düzenleyin[/color]\nHer haritanın ne olduğu hakkında daha fazla ayrıntı için [color=blue]redmew.com/maps[/color] adresindeki listeye göz atın\n\nFaydalı Bağlantılar: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Redmew'u seçtiğiniz için teşekkürler, Refactorio'dan bir senaryo![/color]
