description=[font=default-bold]RedMew je komunita okolo Factoria, která provozuje vlastní servery, mapy různých tvarů a velikostí, skriptované scénáře i modované servery.[/font]\nNáš scénář nabízí více než 100 různých map a jednu z nich si můžete vybrat podle následujících kroků:\n\n[color=green]Jednoduchý režim: navštivte[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Pokročilý režim: upravte soubor map_selection.lua ve složce scénáře[/color]\nPro více informací o jednotlivých mapách se podívejte na seznam na [color=blue]redmew.com/maps[/color]\n\nUžitečné odkazy: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Děkujeme, že jste si vybrali RedMew, scénář od týmu Refactorio![/color]
