# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew Info[/color][/font]\n Komunita, pravidla, funkce, informace o mapě
welcome_header=Vítejte v Redmew!
welcome_text=Redmew je komunita pro hráče všech schopností, která je odhodlána posouvat limity Factorio muliplayeru skrze vlastní skripty a šílené designy map.\n\nJsme přátelští a chceme si užít co možno nejvíce zábavy, doufáme, že ty také.
chatting_header=Jak Chatovat
chatting_text=Abyste mohli chatovat s ostatními hráči, zmáčkněte __CONTROL__toggle-console__ klávesu.\nVýchozí klávesa na českých klávesnicích je středník (;) a je pod klávesou ESC.\nToto můžete změnit v __1__ -> __2__ -> __3__.
free_coin_header=Mince Zdarma
free_coin_text=Dostali jste __1__ __2__ za prohlédnutí záložky Vítejte.\nPodívání se na každou další záložku vám dá __1__ dalších __2__.\n
free_coin_print=__1__ __2__ uděleno za přečtení záložky na informačním okně.
links_header=Užitečné Odkazy
links_discord=Podívejte se na náš Discord pro info o nových mapách a abyste mohli navrhovat nové mapy / nápady.
links_patreon=Přispějte k našemu Patreonu, abyste získali speciální výhody a pomohli udržovat naše servery.
links_saves=Stáhněte si naše mapy, začátek i konec, z našich stránek.
links_factoriomaps=Zobrazte si naše minulé mapy jako Google Map.
rules_header=Pravidla
rules_text=Bavte se a chovejte se slušně. Pamatujte, že jsme tu všichni jen kvůli zábavě, tak to tak i nechme.\n\nŽádný nenávistný obsah ani osobní útoky.\n\nPokud máte podezření, že někdo ničí hru ostatním, informujte tým adminů příkazem /report nebo kliknutím na tlačítko nahlásit vedle hráče v seznamu hráčů.
rules_text_danger_ore=Pokud je potřeba upravit nebo odstranit stavbu jiného hráče, musí před úpravou či odstraněním proběhnout týmová diskuze nebo hlasování.\n\nTýmová diskuze nebo hlasování není nutná, pokud je hráč, který stavbu postavil, online a se změnou či odstraněním souhlasí.\n\nZměna modulů po celé mapě a vylepšování pásových dopravníků musí být před provedením schválena týmovým hlasováním.\n\nV případě týmového hlasování rozhoduje většina.\n\nPouze 1 nebo 2 online hráči nestačí pro týmovou diskuzi nebo hlasování. Úprava nebo odstranění stavby však může být nutná, aby základna běžela hladce. V herním chatu by měla být zanechána zpráva o tom, že stavbu upravujete či odstraňujete, a proč je to potřeba. Samotné tvrzení, že váš návrh či stavba je lepší nebo vypadá líp, nestačí.
map_info_button=Informace o mapě
map_info_header=Informace o mapě
map_name_label=Jméno mapy:
map_desc_label=Popis mapy:
map_extra_info_label=Další Info:
softmods_button=Funkce
softmods_header=Funkce a serverové pluginy
softmods_rank_text=Máme základní systém hodností, který pomáhá předcházet ničení hry. Jako host nemůžete používat atomové bomby ani plán dekonstrukce. Pokud hrajete několik hodin, admin vás povýší na regular. O povýšení můžete také požádat admina, pokud pracujete na projektu, který to vyžaduje.\n
softmods_rank_is=Vaše hodnost je:
softmods_market_label=Obchod
softmods_market_text=Na většině map najdete poblíž spawnu market (obchod), ve kterém můžete za mince nakupovat. Mince získáte kácením stromů, ručním vyráběním předmětů a ničení hnízd biterů. Většina zboží na marketu je stálá, ale některé předměty jsou specifické pro danou mapu (obvykle násyp) a čas od času se střídají.
softmods_saviour_label=Vlakový zachránce
softmods_saviour_text=Vlaky jsou největším nepřítelem factorio hráčů. Pokud máte v inventáři alespoň jeden player port a zabije vás vlak, život vám bude ušetřen, ale o jeden player port přijdete. Player porty můžete získat na marketu.
softmods_plist_label=Seznam hráčů
softmods_plist_text=Zobrazuje seznam všech hráčů na serveru a nějaké statistiky. Seznam můžete seřadit kliknutím na záhlaví sloupců. Můžete také šťouchat do ostatních, čímž se do chatu vypíše náhodné podstatné jméno.
softmods_polls_label=Ankety
softmods_polls_text=Ankety pomáhají hráčům se shodnout na větších akcích. Chcete vylepšit důležitou linku? Vyhlašte anketu, abyste si ověřili, že nikdo není proti. Musíte mít hodnost běžného hráče, abyste mohli vyhlašovat ankety.
softmods_tags_label=Tagy
softmods_tags_text=Můžete si vybrat roli pomocí tagů, abyste ostatním hráčům zdělili, co právě děláte. Nebo prostě použijte tag jako dekoraci. Běžní hráči můžou vytvářet své vlastní tagy, nezapomeňte být kreativní.
softmods_tasks_label=Úkoly
softmods_tasks_text=Nejste si jisti co dělat? Proč se nepodívat na úkoly a zjistit, co je zrovna potřeba udělat. Běžní hráči mohou úkoly spravovat.
softmods_bp_label=BP\npomocník
softmods_bp_text=Plánový pomocník™ vám umožní převracet plány vertikálně nebo horizontálně a\npřevádět entity použité v plánu, např. měnit žluté pásy na červené.
softmods_score_label=Skóre
softmods_score_text=Ukazuje počet vypuštěných raket, osvobozených kousačů, postavených entit a mnoho dalšího!
softmods_shortcuts_label=Zkratky
softmods_shortcuts_text=Zkratky hráče jsou snadno dostupná tlačítka, která hráči poskytují užitečné nástroje. Vyčistěte mrtvá těla biterů ze země, roztřiďte inventář do okolních truhel/pecí, dobijte vybavené baterie z blízkých akumulátorů a mnohem víc.
softmods_production_hud_label=Prod. HUD
softmods_production_hud_text=Produkční HUD je okno se statistikami výroby, které může být na obrazovce neustále. Přidávejte/odstraňujte předměty ze sledovaného seznamu a ujistěte se, že továrna má dostatek surovin!
softmods_train_station_teleport_label=Teleportér
softmods_train_station_teleport_text=Teleport mezi železničními stanicemi umožňuje hráči okamžitě se teleportovat mezi [entity=train-stop] po celé mapě. Stačí stát poblíž [entity=train-stop], v zobrazení mapy otevřít jiný [entity=train-stop] a teleportovat se k němu pomocí jeho tlačítka teleport.
softmods_autofill_label=Automatické plnění
softmods_autofill_text=Automaticky dosype munici při stavbě věží. Lze nastavit filtrování typů munice a jejich množství.
softmods_paint_brush_label=Štětec
softmods_paint_brush_text=Továrna musí růst! ...se stylem
whats_new_button=Co je nového

