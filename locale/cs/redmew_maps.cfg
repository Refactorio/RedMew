# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=Jeskyně se zhroutila!
cave_collapse_warning=Dolování entit jako jsou zdi, kamenné cesty, beton\nnebo kameny může způsobit zával, dávej pozor, horníku!\n\nRada vedoucího: Umísti zeď každé 4. pole, abys\npředešel závalu. Pro další zpevnění použij kamenné\ncesty a beton.

night_time_warning=Umístění solárních panelů pod zemí zjevně\nnemá žádný vliv na výrobu energie!\nStudie ukazují, že totéž platí i o přenosné verzi!\n\nRada vedoucího: Solární panely jsou užitečné pouze při vyrábění\nsatelitů

cracking_sound_1=U T E Č T E,  B L Á Z N I !
cracking_sound_2=K Ř U P

score_cave_collapses=Závaly jeskyní
score_mine_size=Velikost dolu

auto_play_cutscene=Automatické přehrání intro sekvence Diggy
cutscene_case_line2=Vítejte v __1__
cutscene_case_line4=Toto je vlastní scénář vytvořený týmem __1__
cutscene_case_line5=Přidej se k nám na __1__
cutscene_case_line6=Následující úvod vám pomůže začít!
cutscene_case_line7=Pokud během této intro sekvence narazíte na problémy, dejte nám vědět
cutscene_case0_line1=Toto je startovní oblast
cutscene_case0_line3=Rozšiřování dolu je nebezpečné!
cutscene_case1_line1=Zdi drží strop jeskyně, aby na nás nespadl
cutscene_case2_line1=Trh poskytuje další zásoby výměnou za mince
cutscene_case2_line3=Nové předměty odemknete po postupu na vyšší úroveň
cutscene_case3_line1=Bez přidání podpor se závaly vyskytují často
cutscene_case3_line3=Různé typy cihel a betonu mohou zpevnit naše podpůrné pilíře!
cutscene_case4_line1=Tento svět obsahuje křehké kameny
cutscene_case4_line3=Naše nástroje jsou tak výkonné, že suroviny nelze před zničením ochránit
cutscene_case5_line1=Většina akcí dává zkušenosti!
cutscene_case5_line3=Plovoucí text ukazuje množství a příčinu získaných zkušeností
cutscene_case6_line1=Domorodé obyvatelstvo číhá ve tmě
cutscene_case6_line3=Při kopání buďte obezřetní, mějte vždy s sebou nějakou obranu
cutscene_case7_line1=Tímto úvod končí
cutscene_case7_line3=Bavte se a jděte kopat!
replay_cutscene=Chcete-li znovu přehrát úvod, použijte příkaz __1__

blueprint_tools_tooltip=Zobrazit nástroje plánů

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Automatické přehrání intro sekvence Crashsite
cutscene1_case_line2=Vítejte v __1__
cutscene1_case_line4=Toto je vlastní scénář vytvořený týmem __1__
cutscene1_case_line5=Přidej se k nám na __1__
cutscene1_case_line6=Následující úvod vám pomůže začít hrát!
cutscene1_case0_line3=Toto je náš panel nástrojů!
cutscene1_case0_line4=Zde najdete širokou škálu nástrojů a informací o nás!
cutscene1_case0_line5=Najeďte na ně myší a zobrazí se další informace
cutscene1_case0_line6=Tímto tlačítkem můžete zobrazit nebo skrýt náš panel nástrojů
cutscene1_case1_line1=Toto je startovní oblast. Má trh a mincovnu.
cutscene1_case1_line2=Mincovna vyrábí mince omezeným tempem, které lze vylepšit na trhu.
cutscene1_case1_line3=Mince lze získat i zabíjením bitrů, spitterů, červů a hnízd.
cutscene1_case2_line1=Mince se používají k nákupu předmětů na trhu.
cutscene1_case3_line1=Toto spolu s ložisky rud a zdí je váš spawn. A teď k opěrným bodům.

cutscene2_case_line1=Toto je "opěrný bod". Vyskytují se v mnoha podobách a velikostech, s předměty od železných destiček až po zbroj MK2.
cutscene2_case_line2=Po mapě najdete roztroušeno mnoho podobných staveb.
cutscene2_case0_line1=Opěrné body brání nepřátelské věže a zdi. Síla věží odpovídá odměnám uvnitř.
cutscene2_case0_line2=Chcete-li opěrný bod "dobýt", musíte zničit všechny věže.
cutscene2_case1_line1=Opěrný bod obsahuje trh, truhly s kořistí a magické výrobní stroje (sestavovače, chemické závody atd.).
cutscene2_case2_line1=Magické výrobní stroje nepotřebují žádné vstupy ani elektřinu a vyrábějí předměty zdarma. (Tento vyrábí železné destičky.)
cutscene2_case3_line1=Rychlost výroby můžete vylepšit na (místním) trhu za mince. Některé trhy obsahují další předměty.
cutscene2_case4_line1=Bitři se rychle vyvíjejí (a po smrti se občas rozmnoží!). Tip: udržujte znečištění na minimu tím, že využijete předměty zdarma.
cutscene2_case5_line1=Cílem tohoto scénáře je zničit všechny bitry a vypustit raketu na mapě omezené velikosti.
cutscene2_case5_line2=Tímto prohlídka končí. Hodně štěstí a zábavy!
replay_cutscene=Úvod si můžete znovu přehrát příkazem __1__. Textové shrnutí zobrazíte také stisknutím ikony informace.

# locale linked to the quadrants scenario
[quadrants]
on=ZAP.
off=VYP.

compi_spawn_welcome=Vítejte v Redmew - Quadrants!\n\nPoužijte GUI vlevo nahoře k hraní!
compi_spawn_cute=Jsem opravdu roztomilá

compi_common_transfer_item=Jak přenášet předměty?\nNa druhou stranu se dostanete pomocí podzemních dopravníků\n\nPředměty můžete také přehodit, stačí použít klávesu ´Z´
compi_common_chat=Byl jste umlčen?\nChatovat můžete pomocí klávesy pod ESC\n\nZměnit to můžete v Nastavení -> Ovládání -> Toggle Lua console
compi_common_market=Máte nějaké drobné?\nTěžce vydělané mince utraťte zde na trhu
compi_common_switch=Můžete přepnout oblast!\nStačí mít prázdný inventář\n\nStačí stát poblíž mě a použít grafické rozhraní v levém horním rohu pro přepnutí
compi_common_chests=Nemůžete odstranit některé truhly?\nHráči, kteří přepnou oblast, mohou po sobě truhlu zanechat\n\nTruhlu můžete vyprázdnit, čímž ji odstraníte

compi_quadrant1_welcome=Vítejte ve Vědě a Vojenství!\n\nVelitelské centrum vojenského a vědeckého pokroku
compi_quadrant1_science=Tato oblast je jediná, která může zkoumat\n\nNěkteré vědecké balíčky budete muset dovážet z jiných oblastí
compi_quadrant1_military=V této oblasti můžete vyrábět pouze vojenské předměty\n\nOstatní oblasti závisí na tom, že jim budete posílat vojenské předměty

compi_quadrant2_welcome=Vítejte v Meziproduktech a Hornictví!\n\nJediný výrobce oceli a elektronických obvodů!
compi_quadrant2_steel=Tato oblast je jediná, která dokáže vyrábět ocel\n\nOstatní oblasti závisí na tom, že jim ocel pošlete
compi_quadrant2_circuits=Tato oblast je jediná, která dokáže vyrábět obvody\n\nMusíte je vyvážet do dalších oblastí!
compi_quadrant2_resources=Pověry tvrdí, že:\nTento kvadrant je bohatý na přírodní suroviny.\n\nJe proto ideální pro těžební operace

compi_quadrant3_welcome=Vítejte v Ropě a Technice!\n\nDomov petrochemického průmyslu a technologií
compi_quadrant3_oil=Tato oblast je jediná, která je schopna zpracovávat surovou ropu.\n\nMožná bude třeba ropu dovážet z jiných oblastí
compi_quadrant3_tech=Tato oblast je jediná, která může produkovat všelijaké předměty s pokročilými technologiemi\n\nPravděpodobně bude třeba dovážet hodně meziproduktů!
compi_quadrant3_rocket=Slyšel jsem, že:\nTato oblast je perfektní místo na odpálení vesmírné rakety\n\nJíné oblasti mohou poskytnout potřebné díly

compi_quadrant4_welcome=Vítejte v Logistice a dopravě\n\nDomově špaget a železničních dep
compi_quadrant4_logistic=Tato oblast je jediná, která dokáže poskytovat logistická řešení\n\nÚspěch regionu závisí na tom, že je budete vyvážet!
compi_quadrant4_born=Věděl jsi, že\njá a mý sourozenci jsme se zde narodili

popup_quadrant1_title=Výzkum a velící centrum
popup_quadrant2_title=Meziprodukce a těžba
popup_quadrant3_title=Ropa a výroba špičkových technologií
popup_quadrant4_title=Logistická produkce
popup_quadrant1=Naším hlavním cílem je zásobovat region novými vědeckými objevy\n\nVedle toho jsme centrálním velitelským střediskem\nZásobujeme region vojenskou technikou
popup_quadrant2=Naším hlavním cílem je zásobovat region mezivýrobky\nPředevším dodáváme elektronické obvody v různých hustotách\nJsme také oblastí s ocelí nejvyšší kvality!\nPočáteční průzkum ukazuje v této oblasti zvýšené zásoby surovin
popup_quadrant3=Naším hlavním cílem je zásobovat region produkty na bázi ropy\nVedle toho jsme technologickým lídrem regionu\nZásobujeme region různými produkty vysokých technologií (a radioaktivními produkty)
popup_quadrant4=Naším hlavním cílem je zásobovat region logistickými řešeními\nPředevším dodáváme řešení založená na pásech a robotech\nSpecializujeme se také na vysoce výkonné železniční sítě!

