# This file holds all the locale strings for specific maps

# locale linked to the diggy scenario
[diggy]
cave_collapse=Luola romahti!
cave_collapse_warning=Kaivosrakenteet, kuten seinät, kivipolut, betoni\nja kivet, voivat aiheuttaa luolan romahduksen, ole varovainen kaivaja!\n\nEsimiehen neuvo: Sijoita seinä joka neljäs laatta\nestääksesi romahduksen. Käytä kivipolkuja ja betonia\nvahvistaaksesi rakennetta entisestään.

night_time_warning=Aurinkopaneelien sijoittaminen maan alle ei näytä vaikuttavan\nsähkön tuotantoon!\nTutkimukset osoittavat, että sama pätee kannettavaan versioon!\n\nEsimiehen neuvot: Aurinkopaneelit ovat hyödyllisiä vain satelliittien\nvalmistamisessa

cracking_sound_1=J U O K S E, S I N Ä  T Y P E R Y S !
cracking_sound_2=H A L K E A M A

score_cave_collapses=Luolan romahdukset
score_mine_size=Kaivoksen koko

auto_play_cutscene=Toista Diggy-välinäytös automaattisesti
cutscene_case_line2=Tervetuloa __1__
cutscene_case_line4=Tämä on __1__:n kehittämä mukautettu skenaario
cutscene_case_line5=Liity meihin __1__
cutscene_case_line6=Seuraava esittely auttaa sinua pääsemään alkuun!
cutscene_case_line7=Jos kohtaat ongelmia tämän välinäytöksen aikana, kerro siitä meille
cutscene_case0_line1=Tämä on lähtökohta
cutscene_case0_line3=Kaivosten laajentaminen on vaarallista!
cutscene_case1_line1=Muureja käytetään pitämään luolan katto murskaamasta meitä
cutscene_case2_line1=Markkinat tarjoavat ylimääräisiä tarvikkeita vastineeksi kolikoita
cutscene_case2_line3=Avaat uusia esineitä, kun nouset tasoa
cutscene_case3_line1=Luolaromahduksia tapahtuu usein, jos et lisää tukia
cutscene_case3_line3=Erilaiset tiilet ja betoni voivat vahvistaa tukipilareitamme!
cutscene_case4_line1=Tämä maailma sisältää hauraita kiviä
cutscene_case4_line3=Työkalumme ovat liian tehokkaita, eikä mikään resurssi säästy tuholta.
cutscene_case5_line1=Useimmat toiminnot antavat kokemusta!
cutscene_case5_line3=Kelluva teksti osoittaa kokemuksen määrän ja syyn
cutscene_case6_line1=Alkuperäisasukkaat väijyvät pimeässä
cutscene_case6_line3=Ole varovainen kaivaessasi ja tuo aina mukaasi puolustusta
cutscene_case7_line1=Johdantokappale on päättynyt.
cutscene_case7_line3=Pidä hauskaa ja jatka kaivamista!
replay_cutscene=Toistaaksesi esittelyn, käytä komentoa __1__

blueprint_tools_tooltip=Näytä rakennussuunnitelmatyökalut

# locale linked to the crashsite scenario
[crashsite]
auto_play_cutscene=Toista Crashsite-välinäytös automaattisesti
cutscene1_case_line2=Tervetuloa __1__
cutscene1_case_line4=Tämä on __1__:n kehittämä mukautettu skenaario
cutscene1_case_line5=Liity meihin __1__
cutscene1_case_line6=Seuraava esittely auttaa sinua aloittamaan pelaamisen!
cutscene1_case0_line3=Tämä on työkalurivimme!
cutscene1_case0_line4=Täältä löydät laajan valikoiman työkaluja ja informaatiota meistä!
cutscene1_case0_line5=Pidä hiirtä niiden päällä saadaksesi lisätietoa
cutscene1_case0_line6=Voit näyttää/piilottaa työkalurivin tällä painikkeella
cutscene1_case1_line1=Tämä on lähtöalue. Sillä on markkinat ja kolikkorahapaja.
cutscene1_case1_line2=Kolikkorahapaja tuottaa rajoitetusti kolikoita, jotka on päivitettävissä markkinoilla.
cutscene1_case1_line3=Kolikoita voidaan hankkia myös tappamalla purijoita, sylkeilijöitä, matoja ja kutuja.
cutscene1_case2_line1=Kolikoita käytetään ostamaan esineitä markkinoilla.
cutscene1_case3_line1=Tämä yhdessä malmpilkkien ja seinän kanssa on kutusi. Jatketaan kohti etuvartioita.

cutscene2_case_line1=Tämä on "etuvartio". Niitä on monenlaisia muodoiltaan ja kokoiltaan, sisältäen kaikkea rautalevyistä MK2-haarniskoihin.
cutscene2_case_line2=Kartalta löytyy monia tähän samankaltaisia rakenteita.
cutscene2_case0_line1=Etuvartioita puolustavat vihollisen tornit ja seinät. Tornien vahvuus kasvaa niiden sisällä olevien palkintojen mukaan.
cutscene2_case0_line2=Voit "valloittaa" etuvartion tuhoamalla kaikki tornit.
cutscene2_case1_line1=Etuvartio sisältää markkinat, Loot Chestit ja Magic Crafterit (kokoonpanijat, kemialliset laitokset jne.).
cutscene2_case2_line1=Magic Crafter ei vaadi syötettä tai sähköä, vaan tuottaa esineitä ilmaiseksi. (Tämä valmistaa rautalevyjä.)
cutscene2_case3_line1=Voit päivittää nikkarointinopeutta (paikallisilla) markkinoilla kolikoilla. Jotkut markkinat sisältävät lisää kohteita.
cutscene2_case4_line1=Purelijat kehittyvät nopeasti (ja joskus lisääntyvät tapettaessa!). Vinkki: pidä saasteet minimaalisena hyödyntämällä ilmaisia esineitä.
cutscene2_case5_line1=Tämän skenaarion tavoitteena on poistaa kaikki purijat ja käynnistää raketti rajallisen kokoisella kartalla.
cutscene2_case5_line2=Kierros päättyy. Onnea ja pidä hauskaa!
replay_cutscene=Toistaaksesi esityksen käytä komentoa __1__. Voit myös painaa informaatiokuvaketta saadaksesi tekstiyhteenvedon.

# locale linked to the quadrants scenario
[quadrants]
on=PÄÄLLÄ
off=POIS

compi_spawn_welcome=Tervetuloa Redmew - Quadrants!\n\nKäytä vasemmassa yläkulmassa olevaa graafista käyttöliittymää!
compi_spawn_cute=Minä olen kaunis

compi_common_transfer_item=Kuinka siirrät esineitä?\nVoit käyttää maanalaisia hihnoja päästäksesi toiselle puolelle\n\nVoit myös pudottaa esineitä yli käyttämällä ´Z´-näppäintä
compi_common_chat=Oletko mykistetty?\nVoit keskustella ESC-näppäimen avulla\n\nVoit muuttaa tätä kohdassa Asetukset -> Ohjaukset -> Vaihda Lua-konsoli
compi_common_market=Vaihtorahoja?\nMene käyttämään ahkerasti ansaitsemasi kolikot täällä markkinoilla
compi_common_switch=Voit vaihtaa aluetta!\nAinoa ehto on, että tavaraluettelosi on tyhjä\n\nSeiso lähelläni ja vaihda aluetta vasemmassa yläkulmassa olevalla käyttöliittymällä
compi_common_chests=Etkö pysty poistamaan joitakin arkkuja?\nAluetta vaihtavat pelaajat voivat jättää arkun jälkeensä\n\nVoit tyhjentää sen poistaaksesi sen

compi_quadrant1_welcome=Tervetuloa Tiede ja sotilas!\n\nSotilaallisen ja tieteellisen edistyksen komentokeskus
compi_quadrant1_science=Tämä alue on ainoa, joka voi tutkia\n\nSinun pitäisi tuoda joitakin tiedepaketteja muilta alueilta
compi_quadrant1_military=Voit valmistaa vain sotilaallisia esineitä tällä alueella\n\nMuut alueet riippuvat siitä, että lähetät niille sotilaallisia esineitä

compi_quadrant2_welcome=Tervetuloa Välituotteiden ja louhinnan alueelle!\n\nAinoa teräksen ja elektroniikkapiirien tuottaja!
compi_quadrant2_steel=Tämä alue on ainoa, joka voi tuottaa terästä\n\nMuut alueet riippuvat siitä, että lähetät niille terästä.
compi_quadrant2_circuits=Tämä alue on ainoa, joka voi tuottaa piirejä\n\nSinun täytyy viedä ne muille alueille!
compi_quadrant2_resources=Huhurit sanovat:\nTämä alue on runsaasti resursseja\n\nSe sopii erinomaisesti kaivostoimintaan

compi_quadrant3_welcome=Tervetuloa Öljyn ja huipputeknologian alueelle!\n\nÖljynjalostuksen ja teknologian koti
compi_quadrant3_oil=Tämä alue on ainoa, joka voi käsitellä raakaöljyä\n\nSaatat joutua tuomaan raakaöljyä muilta alueilta
compi_quadrant3_tech=Tämä alue on ainoa, joka voi tuottaa erilaisia korkean teknologian tuotteita\n\nSaatat joutua tuomaan paljon välituotteita!
compi_quadrant3_rocket=Olen kuullut:\nTämä alue on täydellinen paikka käynnistää raketti\n\nMuut alueet voivat tarjota sinulle tarvitsemasi osat

compi_quadrant4_welcome=Tervetuloa logistiikkaan ja kuljetukseen\n\nspagetin ja junarakennusten koti
compi_quadrant4_logistic=Tämä alue on ainoa, joka voi toimittaa logistisia ratkaisuja\n\nAlueen menestys riippuu siitä, että viet nämä!
compi_quadrant4_born=Tiesitkö?\nSisarukseni ja minä olemme syntyneet täällä

popup_quadrant1_title=Tutkimus- ja komentokeskus
popup_quadrant2_title=Välituotteiden tuotanto ja kaivostoiminta
popup_quadrant3_title=Öljyn ja huipputeknologian tuotanto
popup_quadrant4_title=Logistinen tuotanto
popup_quadrant1=Päätavoitteenamme on tarjota alueelle uusia tieteellisiä löytöjä\n\nToissijaisesti olemme keskeinen komentokeskus\nTarjoamme alueelle sotilaallista varustetta.
popup_quadrant2=Päätavoitteenamme on tarjota alueelle välituotteita\nToimitamme pääasiassa elektronisia piirejä eri tiheyksinä\nAlueellamme on myös alueen laadukkain teräs!\nAlustava kartoitus osoittaa, että alueen resursseja on lisätty
popup_quadrant3=Päätavoitteenamme on tarjota alueelle öljypohjaisia tuotteita\nToissijaisesti olemme alueen teknologinen johtaja\nTarjoamme alueelle erilaisia korkean teknologian (ja radioaktiivisia) tuotteita.
popup_quadrant4=Päätavoitteenamme on tarjota alueelle logistisia ratkaisuja\nToimitamme ensisijaisesti vyö ja bottipohjaisia ratkaisuja\nOlemme myös erikoistuneet tehokkaisiin junaverkkoihin!

