description=[font=default-bold]RedMew on Factorio-yhteisö, joka ylläpitää muokattuja palvelimia, karttoja eri muodoissa ja kokoissa, skriptattuja skenaarioita ja modattuja palvelimia.[/font]\nSkenaariomme tarjoaa yli 100 erilaista karttaa, ja voit valita haluamasi seuraavilla vaiheilla:\n\n[color=green]Yksinkertainen tila: käy osoitteessa[/color] [color=blue]redmew.com/guide[/color]\n[color=yellow]Expert-tila: muokkaa map_selection.lua-tiedostoa skenaariokansiossa[/color]\nLisätietoja jokaisesta kartasta löydät listasta osoitteessa [color=blue]redmew.com/maps[/color]\n\nHyödyllisiä linkkejä: Discord - [color=blue]refactorio.de/discord[/color]\nGithub - [color=blue]github.com/Refactorio/RedMew[/color]\nPatreon - [color=blue]patreon.com/redmew[/color]\n\n[color=red]Kiitos, että valitsit Redmew:n, Refactorion skenaarion![/color]
