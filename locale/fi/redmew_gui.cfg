# This file holds all the locale strings for guis

[info]
tooltip=[font=var][color=1,0.9,0.75]RedMew Info[/color][/font]\n Yhteisö, säännöt, ominaisuudet ja karttatiedot
welcome_header=Tervetuloa Redmew:iin!
welcome_text=RedMew on kaikentasoisille pelaajille tarkoitettu yhteisö, joka pyrkii työntämään Factorio-moninpelin rajoja mukautettujen skriptien ja hullujen karttasuunnitelmien avulla.\n\nOlemme ystävällinen porukka: tavoitteemme on pitää hauskaa mahdollisimman paljon, ja toivomme, että myös sinä pidät.
chatting_header=Miten keskustellaan
chatting_text=Keskustele muiden pelaajien kanssa painamalla __CONTROL__toggle-console__-näppäintä näppäimistölläsi.\nSen oletusnäppäin englanninkielisissä näppäimistöissä on heittomerkki (`) ja se on ESC-näppäimen alla.\nTämän voi muuttaa kohdassa __1__ -> __2__ -> __3__.
free_coin_header=Ilmaisia kolikkoja
free_coin_text=Sinulle on annettu __1__ __2__ tervetuliaisvälilehden katselusta.\nJokaisen välilehden valitseminen palkitsee sinut __1__ lisää __2__.\n
free_coin_print=__1__ __2__ palkittiin lukemalla välilehti informaatio-ruudulla.
links_header=Hyödyllisiä linkkejä
links_discord=Tutustu discordiimme saadaksesi tietoa uusista kartoista ja ehdottaaksesi uusia karttoja / ideoita.
links_patreon=Tue Patreoniamme saadaksesi erikoisetuja ja auttaaksesi ylläpitämään palvelimiamme.
links_saves=Lataa karttojemme alku- ja lopputilat verkkosivuiltamme.
links_factoriomaps=Tarkastele aiempia karttoja Google Mapina.
rules_header=Säännöt
rules_text=Pidä hauskaa ja pelaa reilusti. Muista, että olemme kaikki täällä viettääksemme hauskoja hetkiä, joten säilytetään se niin.\n\nEi vihamielistä sisältöä eikä henkilökohtaisia hyökkäyksiä.\n\nJos epäilet jotakuta töheryksistä, ilmoita ylläpitotiimille /report-komennolla tai napsauttamalla pelaajalistassa pelaajan vieressä olevaa raporttipainiketta.
rules_text_danger_ore=Jos toisen pelaajan rakennelmaa täytyy muuttaa tai poistaa, ennen muutosta tai poistoa on pidettävä tiimikeskustelu tai järjestettävä äänestys.\n\nTiimikeskustelua tai äänestystä ei tarvita, jos rakennelman tehnyt pelaaja on paikalla ja hyväksyy muutoksen tai poiston.\n\nKoko karttaa koskevat moduulien vaihdot ja hihnoiden päivitykset on äänestettävä tiiminä ennen muuttamista tai päivittämistä.\n\nTiimiäänestyksessä enemmistö voittaa.\n\nVain 1 tai 2 pelaajan läsnäolo ei riitä tiimikeskusteluksi tai äänestykseksi. Silti rakennelman muuttaminen tai poistaminen voi olla tarpeen, jotta tukikohta toimisi sujuvasti. Tällöin pelin sisäiseen chattiin jätetään viesti, jossa ilmoitetaan muutettavasta tai poistettavasta rakennelmasta ja perustelut sille. Pelkkä väite, että oma ratkaisu tai rakennelma on parempi tai näyttää paremmalta, ei riitä.
map_info_button=Karttatiedot
map_info_header=Kartan tiedot
map_name_label=Kartan nimi:
map_desc_label=Kartan kuvaus:
map_extra_info_label=Lisätiedot:
softmods_button=Ominaisuudet
softmods_header=Ominaisuudet ja palvelimen liitännäiset
softmods_rank_text=Meillä on yksinkertainen arvojärjestelmä töheryksien estämiseksi. Et voi käyttää ydinaseita tai purkusuunnittelijaa, jos olet vieras. Pelattuasi muutaman tunnin ylläpitäjä ylentää sinut vakiopelaajaksi. Voit myös pyytää ylennystä ylläpitäjältä, jos projektisi vaatii sitä.\n
softmods_rank_is=Sinun arvo on:
softmods_market_label=Kauppa
softmods_market_text=Useimmissa kartoissa syntymäpisteen lähellä on markkinat, joissa voit tehdä ostoksia kolikoilla. Kolikoita saa hakkaamalla puita, valmistamalla esineitä käsin ja tuhoamalla purelijapesiä. Suurin osa markkinoiden esineistä on vakioita, mutta jotkut ovat karttakohtaisia (yleensä täyttömaata) ja vaihtuvat sisään ja ulos aika ajoin.
softmods_saviour_label=Junapelastaja
softmods_saviour_text=Junat ovat factorio-pelaajan pahin vihollinen. Jos inventaariossasi on vähintään yksi pelaajaportti ja juna tappaa sinut, henkesi säästyy, mutta menetät yhden pelaajaportin. Pelaajaportteja voi saada markkinapaikalta.
softmods_plist_label=Pelaajaluettelo
softmods_plist_text=Luettelee kaikki palvelimella olevat pelaajat ja näyttää joitakin tilastoja. Voit järjestää listan napsauttamalla sarakkeiden otsikoita. Voit myös tökiä ihmisiä, jolloin chattiin heitetään satunnainen substantiivi.
softmods_polls_label=Äänestykset
softmods_polls_text=Kyselyt auttavat pelaajia saavuttamaan yksimielisyyden suurista toimista. Haluatko parantaa tärkeää rakennelmaa? Tee kysely varmistaaksesi, että kaikki ovat samaa mieltä. Uusia kyselyjä voi luoda vain vakiopelaaja.
softmods_tags_label=Tagit
softmods_tags_text=Voit asettaa itsellesi tagilla roolin ja kertoa muille pelaajille, mitä olet tekemässä. Tai käyttää tagia vain koristeena. Vakiopelaajat voivat luoda uusia omia tageja, joten esittele luovuutesi.
softmods_tasks_label=Tehtävät
softmods_tasks_text=Etkö tiedä, minkä parissa pitäisi työskennellä? Tutustu tehtäviin ja katso, mitä pitää tehdä. Vakiopelaajat voivat lisätä uusia tehtäviä.
softmods_bp_label=BP\navustaja
softmods_bp_text=Blueprint helper™ kääntää suunnitelmat vaaka- tai pystysuunnassa ja mahdollistaa\nsuunnitelmassa käytettyjen entiteettien muuntamisen, esim. keltaiset hihnat punaisiksi hihnoiksi.
softmods_score_label=Pisteet
softmods_score_text=Näyttää muun muassa laukaistujen rakettien, vapautettujen purelijien ja rakennettujen entiteettien määrän!
softmods_shortcuts_label=Pikatoiminnot
softmods_shortcuts_text=Pikatoiminnot ovat pelaajan helposti saatavilla olevia painikkeita, jotka tarjoavat hyödyllisiä työkaluja. Siivoa purelijien ruumiit maasta, lajittele inventaariosi läheisiin arkistoihin/uuneihin, lataa päällääsi olevia akkuja lähellä olevista sähkövarastoista ja paljon muuta.
softmods_production_hud_label=Tuotanto-HUD
softmods_production_hud_text=Tuotanto-HUD on tuotantotilastoikkuna, joka voi pysyä näytöllä jatkuvasti. Lisää tai poista esineitä seurattavalta listalta ja varmista, että tehdas saa riittävästi materiaaleja!
softmods_train_station_teleport_label=Teleportteri
softmods_train_station_teleport_text=Junasema-teleportin ansiosta pelaaja voi siirtyä hetkessä [entity=train-stop]-asemien välillä ympäri karttaa. Sinun tarvitsee vain seistä jonkin [entity=train-stop]-aseman lähellä ja avata karttanäkymästä toinen [entity=train-stop]-asema, jonka luo voit siirtyä sen teleport-painikkeella.
softmods_autofill_label=Automaattinen täyttö
softmods_autofill_text=Asettaa ampumatarvikkeet automaattisesti tornien rakentaessa. Toimintoa voi mukauttaa suodattamalla patruunatyyppejä ja niiden määrää.
softmods_paint_brush_label=Maalaussivellin
softmods_paint_brush_text=Tehtaan on kasvettava! ...tyylikkäästi
whats_new_button=Mitä uutta

